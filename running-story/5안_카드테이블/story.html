<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="data.js"></script>
<script src="beat.js"></script>
<script src="drums.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=30;
// ---------- per-run text (title / memo are not in the FIT file)
const RUN={title:'회복조깅',memo:'10km 뛰려다가 8km까지만',
  review:'10km 뛰려다가 8km까지만\n아직도 근육통이 심하다\n따뜻하게 입어서 그런지 다리가 힘들어서 그런지\n심박수가 급상승 해버렸다\n내일은 하루 더 쉬고 토요일 오전에 뛰어야지',   // keep the memo's own line breaks (\n)
  photos:['img/photo1.jpg','img/photo2.jpg'],photoCaps:['11월 26일 밤','오후 7시 24분']};
// ---------- look: card table (green felt, spotlight, playing cards, gold, poker chips)
const C={felt:'#0F3D2E',gold:'#E6C068',goldD:'#A8873E',cream:'#F7F3EA',ink:'#15130F',red:'#C8102E',blue:'#2B5FD9',dim:'rgba(247,243,234,.62)',faint:'rgba(247,243,234,.14)',green:'#3DDC84',orange:'#FF9A3D',back:'#7A0F1C'};
const ZC=['#8E969E','#C9CED4','#3E8EDE','#2FAE66','#F08A24','#D93A37'];        // chip colours = zone colours (존 미만 1 2 3 4 5)
const hrCol=h=>['#8E969E','#C9CED4','#4AB3F4','#3DDC84','#F5A623','#F0524F'][DATA.zones.filter(b=>h>=b).length];
const F={serif:'Playfair Display',ks:'Noto Serif KR',kr:'Noto Sans KR',pen:'Nanum Pen Script',mono:'DM Mono'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---------- utils
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=t=>1-Math.pow(1-t,3),eio3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eoBack=(t,s=1.7)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mmss=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const pace=s=>{s=Math.round(s);return `${Math.floor(s/60)}'${String(s%60).padStart(2,'0')}"`};
const dsec=s=>{s=Math.round(s);return s>=60?`${Math.floor(s/60)}분 ${s%60}초`:`${s}초`};
function tx(s,x,y,px,fam,col,{w='',al='left',a=1,ls=0,maxW=0,glow=0}={}){
  ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.textAlign=al;ctx.textBaseline='alphabetic';ctx.letterSpacing=ls+'px';ctx.fillStyle=col;if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow}
  const m=ctx.measureText(s).width;ctx.translate(x,y);if(maxW&&m>maxW)ctx.scale(maxW/m,1);ctx.fillText(s,0,0);ctx.restore()}
function tw(s,px,fam,w='',ls=0){ctx.save();ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

// ---------- beat grid of the edited song: 129 BPM four-on-the-floor; drop at bar 3, outro after the join
const BT=BEATS.map(b=>b[0]),DB=BEATS.filter(b=>b[1]).map(b=>b[0]);
const BPER=(()=>{const d=BT.slice(1).map((b,i)=>b-BT[i]).sort((a,b)=>a-b);return d[Math.floor(d.length/2)]})();
const lastOf=(arr,t)=>{let r=-1e9;for(const x of arr){if(x<=t)r=x;else break}return r};
const KICKS=DRUMS.beats.filter(b=>b[1]>.45).map(b=>b[0]);
const kickP=(t,k=.12)=>{const b=lastOf(KICKS,t);return t-b<1?Math.exp(-(t-b)/k):0};
const beatP=(t,k=.12)=>{const b=lastOf(BT,t);return t-b<1?Math.exp(-(t-b)/k):0};
const nearDB=x=>DB.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a,DB[0]);
const beatsFrom=(t0,n)=>{const i=BT.findIndex(b=>b>=t0-.02);return BT.slice(i,i+n)};
const T1=nearDB(3.67),T2=nearDB(7.36),T3=nearDB(11.05),TJ=nearDB(12.9),T4=nearDB(14.75),T5=nearDB(18.44),T6=nearDB(20.25);

// ---------- images
const IMG={};['garmin','front','wave'].forEach(n=>{const im=new Image();im.src=`img/${n}.png`;IMG[n]=im});
const PHOTOS=RUN.photos.map(src=>{const im=new Image();im.src=src;return im});
function drawImg(n,cx,by,h,{rot=0,sx=1,alpha=1}={}){const im=IMG[n];const w=im.width*h/im.height;
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(cx,by);ctx.rotate(rot);ctx.scale(sx,1);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore()}

// ---------- data
const S=DATA.session,TOTD=S.dist,TT=S.time;
const LAPS=DATA.laps.map(l=>l[1]/(l[0]/1000)),LAPD=DATA.laps.map(l=>l[0]),NL=LAPS.length;
const LAPR=LAPS.map(s=>Math.round(s));
const FAST=LAPR.indexOf(Math.min(...LAPR)),SLOW=LAPR.indexOf(Math.max(...LAPR));
const lapLabel=i=>LAPD[i]>=990?`${i+1}km`:`${(LAPD.slice(0,i+1).reduce((a,b)=>a+b,0)/1000).toFixed(2)}km`;
const MAXP=(DATA.maxPace&&DATA.maxPace.sec)||Math.min(...LAPS),MAXD=(DATA.maxPace&&DATA.maxPace.dist)||TOTD;
const PSER=DATA.paceSeries||[];const PSORT=PSER.map(x=>x[1]).sort((a,b)=>a-b);const P98=PSORT.length?PSORT[Math.floor(PSORT.length*.98)]:Math.max(...LAPS);
const PLO=Math.floor((Math.min(MAXP,PSORT[0]||MAXP,...LAPS)-8)/10)*10,PHI=Math.ceil((Math.max(P98,...LAPS)+10)/10)*10;
const AVGP=TT/(TOTD/1000);
const SPLIT_LINE=(()=>{const sp=Math.max(...LAPR)-Math.min(...LAPR);const last=LAPR[NL-1],first=LAPR[0];
  if(sp<=20)return'흔들림 없이 같은 리듬으로';if(last===Math.min(...LAPR)&&first>=Math.max(...LAPR)-5)return'갈수록 빨라지고 마지막은 스퍼트';
  if(last===Math.min(...LAPR))return'마지막 1km는 스퍼트';return'구간마다 리듬을 바꿔 가며'})();
const ZS=DATA.zoneSec,ZTOT=ZS.reduce((a,b)=>a+b,0),ZMAX=Math.max(...ZS);const ZTOP=ZS.slice(1).indexOf(Math.max(...ZS.slice(1)))+1;
const ZONE_LINE=`가장 오래 머문 구간은 ${ZTOP}존 ${Math.round(ZS[ZTOP]/ZTOT*100)}%`;
const zRange=i=>i===0?`${DATA.zones[0]-1} 이하`:i<5?`${DATA.zones[i-1]}~${DATA.zones[i]-1}`:`${DATA.zones[4]} 이상`;
const BRK=DATA.breaks||[];
const BREAK_LINE=BRK.length?`중간에 ${BRK.length}번 멈춤 ${dsec(BRK.reduce((a,b)=>a+b.dur,0))}`:'중간 멈춤 없이 연속 달리기';
const MEMO=RUN.review.split('\n').map(s=>s.trim()).filter(Boolean);
const SK=Math.min(NL-1,Math.floor(MAXD/1000));
const SPRINT_T=SK===NL-1&&LAPR[NL-1]===Math.min(...LAPR)?'마지막 1km 스퍼트':SK===NL-1?'마지막 1km 가장 빠른 순간':`${SK+1}km 구간 가장 빠른 순간`;

// ---------- felt, spotlight
const FELT=document.createElement('canvas');FELT.width=W;FELT.height=H;
function buildFelt(){const g=FELT.getContext('2d');g.fillStyle=C.felt;g.fillRect(0,0,W,H);
  for(let i=0;i<40000;i++){const x=rnd(i*1.3)*W,y=rnd(i*2.7+3)*H;g.fillStyle=rnd(i*4.1)>.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.08)';g.fillRect(x,y,1.6,1.6)}
  const v=g.createRadialGradient(540,820,250,540,960,1300);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.78)');g.fillStyle=v;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(230,192,104,.18)';g.lineWidth=3;g.beginPath();g.ellipse(540,1980,760,520,0,Math.PI,2*Math.PI);g.stroke()}
function table(t,lamp=1){ctx.drawImage(FELT,0,0);const k=lamp*(1+.25*kickP(t));const g=ctx.createRadialGradient(540,640,0,540,700,1050);
  g.addColorStop(0,`rgba(255,236,190,${.16*k})`);g.addColorStop(.6,`rgba(255,226,170,${.05*k})`);g.addColorStop(1,'rgba(255,226,170,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

// ---------- suits and cards
function suit(kind,x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s/100,s/100);ctx.fillStyle=col;ctx.beginPath();
  if(kind==='h'){ctx.moveTo(0,35);ctx.bezierCurveTo(-60,-5,-45,-55,0,-25);ctx.bezierCurveTo(45,-55,60,-5,0,35)}
  else if(kind==='d'){ctx.moveTo(0,-45);ctx.lineTo(34,0);ctx.lineTo(0,45);ctx.lineTo(-34,0)}
  else if(kind==='s'){ctx.moveTo(0,-45);ctx.bezierCurveTo(55,0,45,40,8,22);ctx.lineTo(16,45);ctx.lineTo(-16,45);ctx.lineTo(-8,22);ctx.bezierCurveTo(-45,40,-55,0,0,-45)}
  else{[[0,-22],[-22,8],[22,8]].forEach(([a,b])=>{ctx.moveTo(a+21,b);ctx.arc(a,b,21,0,7)});ctx.moveTo(-10,10);ctx.lineTo(10,10);ctx.lineTo(16,45);ctx.lineTo(-16,45)}
  ctx.closePath();ctx.fill();ctx.restore()}
// a card at (cx,cy) w x h; flip 0 = face, 1 = back; draw(face) gets local coords centred on the card
function card(cx,cy,w,h,rot,face,{flip=0,shadow=true,edge=null,alpha=1}={}){const sx=Math.abs(Math.cos(flip*Math.PI))||.001;const back=flip>.5;
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(cx,cy);ctx.rotate(rot);ctx.scale(sx,1);
  if(shadow){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=26;ctx.shadowOffsetY=10}
  rr(-w/2,-h/2,w,h,Math.min(w,h)*.06);ctx.fillStyle=back?C.back:C.cream;ctx.fill();ctx.shadowColor='transparent';
  if(back){ctx.save();rr(-w/2+10,-h/2+10,w-20,h-20,Math.min(w,h)*.05);ctx.clip();ctx.strokeStyle='rgba(230,192,104,.35)';ctx.lineWidth=2;
    for(let i=-h;i<w+h;i+=26){ctx.beginPath();ctx.moveTo(-w/2+i,-h/2);ctx.lineTo(-w/2+i-h,h/2);ctx.stroke();ctx.beginPath();ctx.moveTo(-w/2+i-h,-h/2);ctx.lineTo(-w/2+i,h/2);ctx.stroke()}
    ctx.restore();ctx.strokeStyle=C.gold;ctx.lineWidth=3;rr(-w/2+10,-h/2+10,w-20,h-20,Math.min(w,h)*.05);ctx.stroke();suit('s',0,0,Math.min(w,h)*.22,C.gold)}
  else{face&&face(w,h);if(edge){ctx.strokeStyle=edge;ctx.lineWidth=6;rr(-w/2+3,-h/2+3,w-6,h-6,Math.min(w,h)*.055);ctx.stroke()}}
  ctx.restore()}
function corner(w,h,rank,kind,col,px=44){tx(rank,-w/2+18,-h/2+px+6,px,F.serif,col,{w:'900'});suit(kind,-w/2+18+tw(rank,px,F.serif,'900')/2,-h/2+px+32,px*.6,col);
  ctx.save();ctx.rotate(Math.PI);tx(rank,-w/2+18,-h/2+px+6,px,F.serif,col,{w:'900'});suit(kind,-w/2+18+tw(rank,px,F.serif,'900')/2,-h/2+px+32,px*.6,col);ctx.restore()}
// dealing: a card flies from the dealer's shoe (top right), spins and lands
function deal(t,t0,x,y,rot,dur=.28){const p=eo3(P(t,t0,t0+dur));return{x:lerp(1180,x,p),y:lerp(-200,y,p),r:lerp(rot+1.6,rot,p),p}}
function photoFace(im,cap){return(w,h)=>{const iw=w-36,ih=h-120;const s=Math.max(iw/im.width,ih/im.height);const sw=iw/s,sh=ih/s;ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,-iw/2,-h/2+18,iw,ih);
  tx(cap,0,h/2-36,46,F.pen,C.ink,{al:'center'})}}
function countFace(n){return(w,h)=>{const col=C.red;corner(w,h,String(n),'h',col,52);tx(String(n),0,h*.2,h*.52,F.serif,col,{al:'center',w:'900'})}}
// three cards flip 3 2 1 on three beats; the 4th beat (or the next downbeat) reveals what follows
function countdown(t,beats,cx,cy,w,h,alpha=1){if(t<beats[0])return;const i=beats.filter(b=>t>=b).length-1;const n=3-i;if(n<1)return;
  const p=P(t,beats[i],beats[i]+.14);ctx.save();ctx.globalAlpha*=alpha;const s=1+.08*(1-p);
  card(cx,cy,w*s,h*s,(i-1)*.04,countFace(n),{flip:.5*(1-p),edge:C.gold});ctx.restore()}

// ---------- 0 ~ T1 (two-bar build): title, photo cards dealt, then 3 2 1 into the drop
function sceneIntro(t){table(t,.4+.6*eo3(P(t,0,1.2)));
  tx('오늘의 러닝',540,170,40,F.ks,C.gold,{al:'center',w:'900',ls:6,a:P(t,.1,.5)});
  const b=beatsFrom(0,8);const cd=BT.filter(x=>x<T1-.05).slice(-3);/* 3 2 1 on the last three beats before the drop */const dim=P(t,cd[0]-.1,cd[0]+.1);
  PHOTOS.forEach((im,i)=>{const d=deal(t,b[1+i],i?770:310,i?1210:1160,i?.08:-.08);if(t<b[1+i])return;
    card(d.x,d.y,430,600,d.r,photoFace(im,RUN.photoCaps[i]||''),{alpha:1-.75*dim})});
  if(t>=b[3]){const p=eo3(P(t,b[3],b[3]+.2));ctx.save();ctx.globalAlpha*=p*(1-.75*dim);
    tx(RUN.title,540,440,150,F.ks,C.cream,{al:'center',w:'900',glow:20});tx(RUN.memo,540,520,40,F.kr,C.gold,{al:'center',w:'700'});tx(S.dateLong,540,575,30,F.kr,C.dim,{al:'center',w:'500'});ctx.restore()}
  if(dim>0){ctx.fillStyle=`rgba(0,0,0,${.35*dim})`;ctx.fillRect(0,0,W,H)}
  countdown(t,cd,540,900,420,588)}

// ---------- T1 ~ T2 (drop): the Garmin capture is the face of one big card, flipped on the drop (shown whole, never zoomed)
const CAP={w:1080,h:1483};
function header(t,t0,title,sub){const a=eo3(P(t,t0,t0+.2));tx(title,90,250,66,F.ks,C.cream,{w:'900',a});tx(sub,92,304,26,F.kr,C.gold,{w:'700',a});
  ['s','h','d','c'].forEach((k,i)=>suit(k,800+i*52,232,40,(k==='h'||k==='d')?C.red:C.cream))}
function sceneCapture(t){table(t);header(t,T1,'오늘의 기록','가민 커넥트 그대로');
  const cw=740,chh=cw*CAP.h/CAP.w+40;const fp=P(t,T1,T1+.22);
  card(560,380+chh/2,cw+40,chh,-.01,(w,h)=>{ctx.drawImage(IMG.garmin,-cw/2,-h/2+20,cw,cw*CAP.h/CAP.w)},{flip:1-eo3(fp)});
  const iy=380+20,ih=cw*CAP.h/CAP.w;const REG=[[0,.405,'지도'],[.41,.565,'제목'],[.575,1,'기록']];const hb=beatsFrom(T1+BPER,6);
  REG.forEach(([a,b,lab],i)=>{const t0=hb[i*2];if(t<t0)return;const cy=iy+(a+b)/2*ih;const p=eoBack(P(t,t0,t0+.2),2);
    ctx.save();ctx.translate(-120+200*p,cy);ctx.fillStyle=C.gold;ctx.beginPath();ctx.arc(0,0,58,0,7);ctx.fill();ctx.strokeStyle=C.cream;ctx.lineWidth=5;ctx.setLineDash([12,10]);ctx.beginPath();ctx.arc(0,0,48,0,7);ctx.stroke();ctx.setLineDash([]);
    tx(lab,0,12,34,F.ks,C.ink,{al:'center',w:'900'});ctx.restore()})}

// ---------- T2 ~ T3: splits are cards dealt top to bottom, 1km to the last km
function sceneSplits(t){table(t);header(t,T2,'구간 기록','1km마다 걸린 시간  금빛 막대가 길수록 빠름');
  const lo=Math.min(...LAPS)-25,hi=Math.max(...LAPS)+15;const rh=Math.min(116,920/NL);
  LAPS.forEach((s,k)=>{const t0=T2+.05+k*BPER/2;if(t<t0)return;const y=420+k*rh+rh/2;const d=deal(t,t0,540,y,0,.22);
    const isF=k===FAST,isS=k===SLOW;const col=isF?C.red:isS?C.blue:C.ink;const kind=isF?'h':isS?'s':(k%2?'d':'c');
    card(d.x,d.y,900,rh-14,d.r,(w,h)=>{tx(String(k+1),-w/2+26,16,50,F.serif,(kind==='h'||kind==='d')?C.red:C.ink,{w:'900'});suit(kind,-w/2+80,4,30,(kind==='h'||kind==='d')?C.red:C.ink);
      tx(LAPD[k]>=990?'km':lapLabel(k),-w/2+110,14,24,F.kr,'rgba(21,19,15,.55)',{w:'700'});
      const len=lerp(120,420,(hi-s)/(hi-lo))*eo3(P(t,t0+.1,t0+.35));ctx.fillStyle=isF?C.red:isS?C.blue:C.goldD;rr(-w/2+190,-8,len,16,8);ctx.fill();
      if(isF||isS)tx(isF?'가장 빠름':'가장 느림',-w/2+200+len+14,10,26,F.kr,col,{w:'900'});
      tx(pace(s),w/2-26,20,56,F.serif,col,{al:'right',w:'900'})},{edge:isF?C.red:null})});
  const ft=nearDB(T2+4*BPER-.01)+BPER*2;if(t>=ft){const a=eo3(P(t,ft,ft+.2));tx('평균페이스',92,1410,30,F.kr,C.dim,{w:'700',a});tx(pace(AVGP),90,1500,86,F.serif,C.green,{w:'900',a});
    tx('빠른 1km와 느린 1km 차이',990,1410,30,F.kr,C.dim,{al:'right',w:'700',a});tx(dsec(LAPR[SLOW]-LAPR[FAST]),990,1490,60,F.ks,C.gold,{al:'right',w:'900',a})}}

// ---------- T3 ~ T4: pace graph in gold; the km of the fastest moment lit red from bar TJ, then an ace card call-out
const GX0=160,GX1=975,GY0=560,GY1=1110;
const gx=d=>GX0+d/TOTD*(GX1-GX0),gy=p=>GY0+clamp((p-PLO)/(PHI-PLO))*(GY1-GY0);
function sceneWave(t){table(t);header(t,T3,'페이스 그래프',`${(TOTD/1000).toFixed(2)}km 실제 페이스`);
  const WS=[];let c=T3+.1;for(let k=0;k<NL;k++){if(k===SK){c=Math.max(c,TJ);WS.push(c);c+=2*BPER}else{WS.push(c);c+=BPER/2}}
  const SK0=WS[SK],SK1=SK0+2*BPER;const kEnd=k=>k<NL-1?(k+1)*1000:TOTD;
  const prog=k=>k===SK?Math.pow(P(t,SK0,SK1),1.4):eo3(P(t,WS[k],WS[k]+.2));
  let dR=0;for(let k=0;k<NL;k++){const q=prog(k);if(q>0)dR=Math.max(dR,lerp(k*1000,kEnd(k),q))}
  const sp=P(t,SK0,SK0+.12);
  for(let p=Math.ceil(PLO/60)*60;p<=PHI;p+=60){const y=gy(p);ctx.strokeStyle=C.faint;ctx.lineWidth=2;ctx.setLineDash([6,10]);ctx.beginPath();ctx.moveTo(GX0,y);ctx.lineTo(GX1,y);ctx.stroke();ctx.setLineDash([]);
    tx(pace(p),GX0-14,y+8,22,F.mono,C.dim,{al:'right',w:'500'})}
  for(let k=0;k<=NL;k++){const x=gx(Math.min(k*1000,TOTD));ctx.fillStyle=C.faint;ctx.fillRect(x-1,GY0-10,2,GY1-GY0+10);tx(k===NL?`${(TOTD/1000).toFixed(2)}km`:String(k),x,GY1+40,22,F.mono,C.dim,{al:k===NL?'right':'center',w:'500'})}
  const sx0=gx(SK*1000),sx1=gx(kEnd(SK));if(sp>0){ctx.fillStyle=`rgba(200,16,46,${(.22+.08*kickP(t))*sp})`;ctx.fillRect(sx0,GY0-80,sx1-sx0,GY1-GY0+80)}
  LAPS.forEach((s,k)=>{if(t<WS[k])return;const x0=gx(k*1000),x1=gx(kEnd(k));const isK=k===SK&&sp>0;const col=isK?'#FF5A6E':k===FAST?C.orange:k===SLOW?'#7FA6FF':C.cream;
    tx(pace(s),(x0+x1)/2,GY0-36,isK?34:28,F.serif,col,{al:'center',w:'900',a:isK?1:1-.5*sp});
    ctx.save();ctx.globalAlpha*=.7*(isK?1:1-.5*sp);ctx.strokeStyle=col;ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(x0+4,gy(s));ctx.lineTo(x1-4,gy(s));ctx.stroke();ctx.restore()});
  const pts=PSER.filter(q=>q[0]<=dR).map(q=>[gx(q[0]),gy(q[1]),q[0]]);
  const line=(arr,col,wd,al,glow)=>{if(arr.length<2)return;ctx.save();ctx.globalAlpha*=al;ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowColor=col;ctx.shadowBlur=glow;ctx.beginPath();arr.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore()};
  line(pts,C.gold,4.5,1-.6*sp,10);if(sp>0)line(pts.filter(q=>q[2]>=SK*1000-30&&q[2]<=kEnd(SK)),'#FF3B55',7,1,16);
  if(t>=SK1){const x=gx(MAXD),y=gy(MAXP);ctx.fillStyle='#FF3B55';ctx.beginPath();ctx.arc(x,y,10+6*beatP(t),0,7);ctx.fill();
    const ct=SK1+BPER/2;if(t>=ct){const d=deal(t,ct,450,700,-.03,.25);ctx.strokeStyle='#FF3B55';ctx.lineWidth=3;ctx.globalAlpha=d.p;ctx.beginPath();ctx.moveTo(d.x+320,d.y);ctx.lineTo(x-16,y);ctx.stroke();ctx.globalAlpha=1;
      card(d.x,d.y,640,236,d.r,(w,h)=>{corner(w,h,'A','h',C.red,38);tx(SPRINT_T,-w/2+96,-h/2+60,36,F.ks,C.ink,{w:'900'});tx('순간 최고',-w/2+96,-h/2+104,26,F.kr,'rgba(21,19,15,.6)',{w:'700'});
        tx(pace(MAXP),-w/2+96,h/2-28,84,F.serif,C.red,{w:'900'});tx(`${lapLabel(SK)} 구간`,w/2-84,-h/2+104,26,F.kr,'rgba(21,19,15,.6)',{al:'right',w:'700'});tx(pace(LAPS[SK]),w/2-84,h/2-34,50,F.serif,C.ink,{al:'right',w:'900'})},{edge:C.gold})}}
  const rb=beatsFrom(T3+2*BPER-.02,3);
  [['평균페이스',pace(AVGP),C.green],['최고 페이스',pace(MAXP),'#FF5A6E'],['총 거리',(TOTD/1000).toFixed(2)+'km',C.gold]].forEach(([l,v,c],i)=>{if(t<rb[i])return;const a=eo3(P(t,rb[i],rb[i]+.2));
    tx(l,90+i*310,1300,28,F.kr,C.dim,{w:'700',a});tx(v,90+i*310,1384+(1-a)*14,72,F.serif,c,{w:'900',a})});
  if(t>rb[2]+BPER)tx(SPLIT_LINE,540,1520,58,F.pen,C.cream,{al:'center'})}

// ---------- T4 ~ T5: heart rate zones as poker chip stacks (one chip per ~40 s), stacked 16th by 16th, tops hop on every kick
function chip(x,y,col,top=true){ctx.fillStyle=col;ctx.fillRect(x-56,y,112,12);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(x-56,y,112,12);
  ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<5;i++)ctx.fillRect(x-48+i*22,y+3,8,6);
  if(top){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,56,18,0,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=5;ctx.setLineDash([10,12]);ctx.beginPath();ctx.ellipse(x,y,48,14,0,0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,30,9,0,0,7);ctx.stroke()}}
function sceneZones(t){table(t);header(t,T4,'심박존별 시간','가민 심박존 기준  칩 높이가 머문 시간');
  const base=1050,maxN=38;const order=[0,1,2,3,4,5];
  order.forEach((z,i)=>{const x=165+i*150;const sec=ZS[z];const N=sec>0?Math.max(1,Math.round(maxN*sec/ZMAX)):0;const t0=T4+.1+i*BPER/2;const col=ZC[z];
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,base+16,64,20,0,0,7);ctx.fill();
    const n=t<t0?0:Math.round(N*eo3(P(t,t0,t0+BPER*2)));const hop=t>t0+BPER*2?14*kickP(t,.09):0;
    for(let j=0;j<n;j++){const y=base-j*12-(j>=n-3?hop*(j-(n-4))/3:0);chip(x,y,col,j===n-1)}
    if(t>=t0){const a=eo3(P(t,t0,t0+.2));tx(z?`${z}존`:'존 미만',x,base+86,z?40:28,F.ks,col,{al:'center',w:'900',a});tx(zRange(z),x,base+118,20,F.mono,C.dim,{al:'center',a});
      tx(mmss(sec),x,base+172,44,F.serif,sec>0?C.cream:'rgba(247,243,234,.35)',{al:'center',w:'900',a});tx(`${Math.round(sec/ZTOT*100)}%`,x,base+208,26,F.kr,col,{al:'center',w:'900',a})}});
  const hb=beatsFrom(nearDB(T4+4*BPER-.01),3);
  [['평균심박수',S.avgHR],['최대심박수',S.maxHR]].forEach(([l,v],k)=>{if(t<hb[k])return;const a=eo3(P(t,hb[k],hb[k]+.2));const al=k?'right':'left',x=k?990:90;tx(l,x,1360,30,F.kr,C.dim,{al,w:'700',a});
    const vw=tw(String(v),96,F.serif,'900'),uw=tw('bpm',30,F.kr,'700');tx(String(v),k?x-uw-10:x,1458,96,F.serif,hrCol(v),{al,w:'900',a});tx('bpm',k?x:x+vw+10,1458,30,F.kr,C.dim,{al,w:'700',a})});
  if(t>hb[2]){tx(ZONE_LINE,540,1570,58,F.pen,C.cream,{al:'center'});tx(BREAK_LINE,540,1630,26,F.kr,BRK.length?C.orange:C.dim,{al:'center',w:'700'})}}

// ---------- T5 ~ T6: last bar before the outro: 3 2 1 again, then the final hand
function sceneFinal(t){table(t);const b=beatsFrom(T5,4);tx('FINAL HAND',540,420,44,F.serif,C.gold,{al:'center',w:'900',ls:10,a:eo3(P(t,T5,T5+.2))});
  countdown(t,b.slice(1,4),540,960,420,588)}

// ---------- T6 ~ 30 (outro loop): a fanned hand of six stat cards, title, the memo on a dealer's card
function memoLayout(maxW,maxLines){for(let px=50;px>=38;px-=2){if(MEMO.length<=maxLines&&MEMO.every(l=>tw(l,px,F.pen)<=maxW))return{px,lines:MEMO}}
  for(let px=50;px>28;px-=2){const lines=[];for(const ln of MEMO){if(tw(ln,px,F.pen)<=maxW){lines.push(ln);continue}let cur='';for(const w of ln.split(' ')){const tt=cur?cur+' '+w:w;if(tw(tt,px,F.pen)>maxW&&cur){lines.push(cur);cur=w}else cur=tt}if(cur)lines.push(cur)}
    if(lines.length<=maxLines)return{px,lines}}return{px:28,lines:MEMO.slice(0,maxLines)}}
let ML=null;
function sceneLoop(t){table(t);const e=t-T6;const lb=beatsFrom(T6,16);
  tx('오늘의 러닝',540,160,36,F.ks,C.gold,{al:'center',w:'900',ls:6});
  tx(RUN.title,540,280,112,F.ks,C.cream,{al:'center',w:'900',glow:16,a:eo3(P(e,0,.3))});
  {const a=eo3(P(e,.2,.5));ctx.save();ctx.globalAlpha*=a;const w=tw('완주',40,F.ks,'900')+48;ctx.fillStyle=C.red;rr(540-w/2,305,w,58,29);ctx.fill();tx('완주',540,348,40,F.ks,C.cream,{al:'center',w:'900'});ctx.restore()}
  // fanned hand: each card shows its stat in the top-left corner like a real hand of cards
  const hrColL=h=>['#6B7480','#7D8792','#1F86D6','#16A35A','#D9860B','#D93A37'][DATA.zones.filter(b=>h>=b).length];   // zone colours readable on the cream cards
  const CR=[['총 거리',(TOTD/1000).toFixed(2),'km','#E0621A','d'],['달린시간',mmss(TT),'','#1F6FEB','s'],['평균페이스',pace(AVGP),'','#16A35A','h'],
    ['평균심박수',String(S.avgHR),'bpm',hrColL(S.avgHR),'c'],['최대심박수',String(S.maxHR),'bpm',hrColL(S.maxHR),'d'],['칼로리',String(S.kcal),'kcal',C.ink,'s']];
  const piv=[540,1720],R=1060,sway=Math.sin(e*1.1)*.012;
  CR.forEach(([l,v,u,col,kind],i)=>{const t0=T6+.1+i*BPER/2;if(t<t0)return;const a=(i-2.5)*.13+sway;const p=eo3(P(t,t0,t0+.3));const ang=lerp(0,a,p);
    const cx=piv[0]+Math.sin(ang)*R,cy=piv[1]-Math.cos(ang)*R+(1-p)*200;
    card(cx,cy,250,350,ang,(w,h)=>{const L=-w/2+20;tx(l,L,-h/2+44,24,F.kr,'rgba(21,19,15,.6)',{w:'700'});tx(v,L,-h/2+104,v.length>4?50:58,F.serif,col,{w:'900'});if(u)tx(u,L+2,-h/2+136,22,F.kr,'rgba(21,19,15,.55)',{w:'700'});
      suit(kind,L+16,-h/2+178,30,col);suit(kind,0,h*.12,110,col)},{edge:i===0?C.gold:null})});
  // joker: a tiny Star Runner card tucked behind the hand (easter egg)
  {const t0=T6+3*BPER+.1;if(t>=t0){const p=eo3(P(t,t0,t0+.3));card(960,850+(1-p)*80,120,168,.32,(w,h)=>{tx('JOKER',0,-h/2+26,16,F.serif,C.red,{al:'center',w:'900',ls:2});const wv=(e%4)>2.6&&(e%4)<3.6;drawImg(wv?'wave':'front',0,h/2-16,104)},{alpha:p})}}
  // dealer's card with the memo (line breaks kept)
  const mt=lb[4];if(t>=mt){const d=deal(t,mt,540,1250,-.006,.3);card(d.x,d.y,900,420,d.r,(w,h)=>{corner(w,h,'K','h',C.red,34);
    tx('러닝 메모',0,-h/2+58,32,F.ks,C.ink,{al:'center',w:'900'});ctx.fillStyle='rgba(21,19,15,.2)';ctx.fillRect(-w/2+90,-h/2+80,w-180,2);
    if(!ML)ML=memoLayout(w-200,6);const lh=ML.px*1.22,top=-h/2+80+(h-80-ML.lines.length*lh)/2+ML.px*.9;
    ML.lines.forEach((ln,i)=>{const t1=mt+.3+BPER/2*i;if(t<t1)return;tx(ln,0,top+i*lh,ML.px,F.pen,C.ink,{al:'center',a:eo3(P(t,t1,t1+.2))})})},{edge:C.gold})}
  tx(S.dateLong,540,1540,28,F.kr,C.dim,{al:'center',w:'500',a:P(e,1,1.4)})}

// ---------- timeline
const SCENES=[[0,sceneIntro],[T1,sceneCapture],[T2,sceneSplits],[T3,sceneWave],[T4,sceneZones],[T5,sceneFinal],[T6,sceneLoop]];
function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  let k=0;SCENES.forEach(([s],i)=>{if(t>=s)k=i});
  const s0=SCENES[k][0];const tr=k>0?P(t,s0,s0+.16):1;
  if(tr<1){ctx.save();ctx.globalAlpha=1;SCENES[k-1][1](t);ctx.restore();ctx.save();ctx.beginPath();ctx.rect(0,0,W*eo3(tr),H);ctx.clip();SCENES[k][1](t);ctx.restore();   // a card-table wipe on the downbeat
    ctx.fillStyle=C.gold;ctx.fillRect(W*eo3(tr)-3,0,6,H)}
  else SCENES[k][1](t);
  const fl=t>=T1?Math.exp(-(t-T1)/.25):0;if(fl>.01){ctx.fillStyle=`rgba(255,236,190,${.35*fl})`;ctx.fillRect(0,0,W,H)}   // the drop
  const fi=1-P(t,0,.3);if(fi>0){ctx.fillStyle=`rgba(0,0,0,${fi})`;ctx.fillRect(0,0,W,H)}}
window.render=render;window.DUR=DUR;
(async()=>{buildFelt();await Promise.all([...Object.values(IMG),...PHOTOS].map(im=>im.complete?0:new Promise(r=>{im.onload=r;im.onerror=r})));
  const fams=[[F.serif,'900'],[F.ks,'900'],[F.kr,'500'],[F.kr,'700'],[F.kr,'900'],[F.pen,''],[F.mono,'500']];
  await Promise.all(fams.map(([f,w])=>document.fonts.load(`${w} 40px "${f}"`,'가나다ABC123')));await document.fonts.ready;window.READY=true;
  const q=new URLSearchParams(location.search);if(q.has('t'))render(+q.get('t'));else{const s=performance.now();(function loop(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(loop)})()}})();

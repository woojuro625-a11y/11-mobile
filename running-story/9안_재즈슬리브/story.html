<html><head><meta charset="utf-8">

<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="data.js"></script>
<script src="beat.js"></script>
<script src="drums.js"></script>
<script src="bass.js"></script>
<script src="memo_emphasis.js"></script>
<script src="lib/three147.min.js"></script><script src="lib/GLTFLoader.js"></script><script src="lib/starrunner_glb.js"></script><script src="lib/starrunner.js"></script><script src="jazz3d.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=30;
// ---------- per-run text (title / memo are not in the FIT file)
const RUN={title:'회복 조깅',memo:'ROR 프리런',
  review:'ROR 프리런\n주말 오전 따듯한 날씨와 함께\n심박오류로 5km 까지 너무 높게 찍혀서\n다시 끼고 정상화\n놀랬네잉',   // keep the memo's own line breaks (\n)
  reviewMarks:'[[ROR 프리런|key]]\n주말 오전 [[따듯한 날씨|feel]]와 함께\n[[심박오류|body]]로 [[5km]] 까지 [[너무 높게|body]] 찍혀서\n다시 끼고 [[정상화|key]]\n[[놀랬네잉|feel]]',
  photos:['img/photo1.jpg','img/photo2.jpg','img/photo3.jpg'],photoCaps:['토요일 아침','ROR 프리런','달린 뒤 만난 고양이']};
// ---------- look: a modern jazz record sleeve (off-white paper, ink black, cobalt blue, tangerine), flat colour blocks, duotone photos,
// condensed numerals; things snap in on the song's chord stabs in hard steps (stop-motion), no soft easing
const C={paper:'#EDE6D6',paper2:'#F6F1E6',ink:'#141414',ink2:'rgba(20,20,20,.62)',ink3:'rgba(20,20,20,.12)',cobalt:'#2347C6',tang:'#FF6A1F',white:'#F6F1E6',dim:'rgba(246,241,230,.62)'};
const ZT=['#6B7480','#7D8792','#1F86D6','#16A35A','#D9860B','#D93A37'];      // zone colours (존 미만 1 2 3 4 5), readable on paper
const hrCol=h=>ZT[DATA.zones.filter(b=>h>=b).length];
const F={num:'Big Shoulders Display',kr:'IBM Plex Sans KR',memo:'Gowun Batang'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---------- utils
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=t=>1-Math.pow(1-t,3),eio3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mmss=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const pace=s=>{s=Math.round(s);return `${Math.floor(s/60)}'${String(s%60).padStart(2,'0')}"`};
const dsec=s=>{s=Math.round(s);return s>=60?`${Math.floor(s/60)}분 ${s%60}초`:`${s}초`};
function tx(s,x,y,px,fam,col,{w='',al='left',a=1,ls=0,maxW=0}={}){
  ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.textAlign=al;ctx.textBaseline='alphabetic';ctx.letterSpacing=ls+'px';ctx.fillStyle=col;
  const m=ctx.measureText(s).width;ctx.translate(x,y);if(maxW&&m>maxW)ctx.scale(maxW/m,1);ctx.fillText(s,0,0);ctx.restore()}
function tw(s,px,fam,w='',ls=0){ctx.save();ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
// staccato: a thing arrives in 3 hard steps over 0.12 s (stop-motion), then sits still
const snap=(t,t0)=>t<t0?-1:Math.min(1,Math.floor((t-t0)/.04+1)/3);
function snapIn(t,t0,draw,{dx=0,dy=40}={}){const q=snap(t,t0);if(q<0)return;ctx.save();ctx.translate(dx*(1-q),dy*(1-q));draw(q);ctx.restore()}

// ---------- the song: a warm, laid-back groove at 84.7 BPM in G (with the bluesy F), staccato chord stabs on the beat, a sliding bass, wide stereo;
// played from the very start (no edit) with a 1 s fade-out. Bars start on the chord changes: 2.59, 5.43, 8.26 ... (one bar 2.83 s)
const BT=BEATS.map(b=>b[0]),DB=BEATS.filter(b=>b[1]).map(b=>b[0]);
const BPER=BT[1]-BT[0];
const lastOf=(arr,t)=>{let r=-1e9;for(const x of arr){if(x<=t)r=x;else break}return r};
const fr=t=>Math.max(0,Math.min(1799,Math.floor(t*60)));const bassAt=t=>BASS[fr(t)],loudAt=t=>LOUD[fr(t)];
const stabP=(t,k=.09)=>{const b=lastOf(BT,t);return t-b<1?Math.exp(-(t-b)/k):0};
const T1=DB[1],T2=DB[2],T3=DB[3]+BPER*2,T4=DB[5],T5=DB[6];       // capture 5.43 / splits 8.26 / pace 12.51 / zones 16.76 / ending 19.60 (all of it up by 22 s, then it holds)
const OUTRO=28.3;

// ---------- images
const IMG={};['garmin'].forEach(n=>{const im=new Image();im.src=`img/${n}.png`;IMG[n]=im});
const PHOTOS=RUN.photos.map(src=>{const im=new Image();im.src=src;return im});

// ---------- data
const S=DATA.session,TOTD=S.dist,TT=S.time;
const LAPS=DATA.laps.map(l=>l[1]/(l[0]/1000)),LAPD=DATA.laps.map(l=>l[0]),NL=LAPS.length;
const LAPR=LAPS.map(s=>Math.round(s));
const FAST=LAPR.indexOf(Math.min(...LAPR)),SLOW=LAPR.indexOf(Math.max(...LAPR));
const lapLabel=i=>LAPD[i]>=990?`${i+1}km`:`${(LAPD.slice(0,i+1).reduce((a,b)=>a+b,0)/1000).toFixed(2)}km`;
const MAXP=(DATA.maxPace&&DATA.maxPace.sec)||Math.min(...LAPS),MAXD=(DATA.maxPace&&DATA.maxPace.dist)||TOTD;
const PSER=DATA.paceSeries||[];const PSORT=PSER.map(x=>x[1]).sort((a,b)=>a-b);const P98=PSORT.length?PSORT[Math.floor(PSORT.length*.98)]:Math.max(...LAPS);
const PLO=Math.floor((Math.min(MAXP,PSORT[0]||MAXP,...LAPS)-8)/10)*10,PHI=Math.ceil((Math.max(P98,...LAPS)+10)/10)*10;
const AVGP=TT/(TOTD/1000);
const SPLIT_LINE=(()=>{const sp=Math.max(...LAPR)-Math.min(...LAPR);const last=LAPR[NL-1];
  const full=LAPR.filter((_,i)=>LAPD[i]>=990),h=Math.floor(full.length/2),avg=a=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length);
  const faster=full.length>=4&&avg(full.slice(0,h))>avg(full.slice(h))+5;const lastLbl=LAPD[NL-1]>=990?'마지막 1km':`마지막 ${(LAPD[NL-1]/1000).toFixed(2)}km`;
  if(sp<=20)return'흔들림 없이 같은 리듬으로';if(last===Math.min(...LAPR))return faster?`갈수록 빨라지고 ${lastLbl}는 스퍼트`:`${lastLbl}는 스퍼트`;
  return faster?'갈수록 빨라진 러닝':'구간마다 리듬을 바꿔 가며'})();
const ZS=DATA.zoneSec,ZTOT=ZS.reduce((a,b)=>a+b,0),ZMAX=Math.max(...ZS);const ZTOP=ZS.slice(1).indexOf(Math.max(...ZS.slice(1)))+1;
const ZONE_LINE=`가장 오래 머문 구간은 ${ZTOP}존 ${Math.round(ZS[ZTOP]/ZTOT*100)}%`;
const zRange=i=>i===0?`${DATA.zones[0]-1} 이하`:i<5?`${DATA.zones[i-1]}~${DATA.zones[i]-1}`:`${DATA.zones[4]} 이상`;
const BRK=DATA.breaks||[];
const BREAK_LINE=BRK.length?`중간에 ${BRK.length}번 멈춤 ${dsec(BRK.reduce((a,b)=>a+b.dur,0))}`:'중간 멈춤 없이 연속 달리기';
const SK=Math.min(NL-1,Math.floor(MAXD/1000));
const SPRINT_T=SK===NL-1&&LAPR[NL-1]===Math.min(...LAPR)?'마지막 구간 스퍼트':SK===NL-1?'마지막 구간 가장 빠른 순간':`${SK+1}km 구간 가장 빠른 순간`;

// ---------- paper with a faint print texture; duotone photos
const PAPER=document.createElement('canvas');PAPER.width=W;PAPER.height=H;
function buildPaper(){const g=PAPER.getContext('2d');g.fillStyle=C.paper;g.fillRect(0,0,W,H);
  for(let i=0;i<30000;i++){g.fillStyle=rnd(i*1.9)>.5?'rgba(80,60,30,.045)':'rgba(255,255,255,.3)';g.fillRect(rnd(i*2.3)*W,rnd(i*3.7+1)*H,1.6,1.6)}}
const DUO=['img/duo1.png','img/duo2.png','img/duo3.png'].map(src=>{const im=new Image();im.src=src;return im});   // duotones made with scripts/duotone.py (cobalt / tangerine / warm grey)
function buildDuo(){}
function bgPaper(){ctx.drawImage(PAPER,0,0)}
function bgInk(){ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H)}
// page header: Korean title in heavy sans, a thick ink rule, a small subtitle; snaps in on the scene's first stab
function header(t,t0,title,sub,{dark=false}={}){const col=dark?C.white:C.ink;
  snapIn(t,t0,()=>{tx(title,70,232,76,F.kr,col,{w:'700'});ctx.fillStyle=col;ctx.fillRect(72,262,936,6)},{dy:30});
  snapIn(t,t0+BPER/2,()=>tx(sub,72,312,26,F.kr,dark?C.dim:C.ink2,{w:'500'}),{dy:20})}
// scene change: a flat colour block crosses the page in hard steps on the downbeat (covers the old page at the cut)
function blockWipe(t,t0,col){const p=P(t,t0-.18,t0+.18);if(p<=0||p>=1)return;const q=Math.floor(p*6)/6;ctx.fillStyle=col;ctx.fillRect(lerp(-W,W,q),0,W,H)}

// ---------- Star Runner, jazz cat in a beret (live 3D). Relaxed arms down; finger snaps on 2 and 4, shoulder sway, a side step, a little shuffle;
// the hero of the opening and the ending; in the data pages he only strolls along the bottom with the walking bass (an easter egg)
const DPX=330;let DR=null,GLC=null;
const MOVES=['sway','snap','step','snap','shuffle','sway','snap','step'];
const DEF={bob:0,squash:1,lean:0,yaw:0,roll:0,head:0,headTurn:0,headTilt:0,shR:[0,0,28],shL:[0,0,-28],elR:-14,elL:-14,hipR:0,kneeR:0,hipL:0,kneeL:0,azim:.18};
function mixPose(a,b,w){const o={};for(const k in DEF){const x=a[k]??DEF[k],y=b[k]??DEF[k];o[k]=Array.isArray(x)?x.map((v,i)=>lerp(v,y[i],w)):lerp(x,y,w)}return o}
function movePose(mv,t){const e=clamp(.5+loudAt(t)*2,0,1);const bt=(t-BT[0])/BPER,ph=((bt%1)+1)%1;const dip=.5+.5*Math.cos(2*Math.PI*ph);const sw=Math.sin(Math.PI*bt);
  const o={...DEF,bob:-.03*e*dip,head:3+8*e*dip,lean:2,roll:3*sw*e,headTilt:4*sw};
  if(mv==='sway'){o.shR=[-14*sw,0,26];o.shL=[14*sw,0,-26];o.yaw=8*sw;o.kneeR=8*Math.max(0,sw);o.kneeL=8*Math.max(0,-sw)}
  if(mv==='snap'){const c=Math.pow(Math.max(0,Math.cos(Math.PI*(bt-1))),10);const side=Math.floor(bt/2)%2?1:-1;            // a finger snap at shoulder height on 2 and 4, alternating hands
    if(side>0){o.shR=[-55,0,-10];o.elR=-95-12*c}else{o.shL=[-55,0,10];o.elL=-95-12*c}o.head+=5*c;o.headTurn=10*side}
  if(mv==='step'){const r=Math.max(0,sw),l=Math.max(0,-sw);o.hipR=-24*r;o.kneeR=30*r;o.hipL=-24*l;o.kneeL=30*l;o.yaw=12*sw;o.shR=[-16*l,0,26];o.shL=[-16*r,0,-26]}
  if(mv==='shuffle'){const q=Math.sin(2*Math.PI*bt);o.roll=-5*q;o.shR=[-20,0,22+10*q];o.shL=[-20,0,-22+10*q];o.elR=o.elL=-60;o.kneeR=12+10*q;o.kneeL=12-10*q}
  return o}
function heroState(t){const db=lastOf(DB,t);const bi=Math.max(0,DB.indexOf(db));const mv=i=>MOVES[((i%MOVES.length)+MOVES.length)%MOVES.length];
  let o=movePose(mv(bi),t);const w=eio3(P(t,db,db+BPER*.75));if(bi>0&&w<1)o=mixPose(movePose(mv(bi-1),t),o,w);
  if(t>OUTRO){const u=P(t,OUTRO,OUTRO+.5);o=mixPose(o,{...DEF,head:-4},u);const wv=P(t,OUTRO+.3,OUTRO+.7);if(wv>0){o.shR=[-15,0,lerp(28,-95,eo3(wv))];o.elR=-40+30*Math.sin((t-OUTRO)*9);o.headTilt=8*wv}}
  return o}
function walkState(t){const s2=Math.sin(Math.PI*(t-BT[0])/BPER);return{...DEF,yaw:-80,hipR:-24*s2,hipL:24*s2,kneeR:10+26*Math.max(0,s2),kneeL:10+26*Math.max(0,-s2),shR:[20*s2,0,26],shL:[-20*s2,0,-26],elR:-22,elL:-22,bob:-.02*Math.abs(s2),head:4+4*Math.abs(s2)}}
function dancer(t,cx,feetY,sc){if(!DR)return;const [gw,gh]=DR.size;const k=sc*240/DPX;ctx.drawImage(GLC,cx-gw*k/2,feetY-gh*DR.feet*k,gw*k,gh*k)}
function stroll(t,t0,t1){const u=P(t,t0,t1);dancer(t,lerp(-80,1160,u),1862,.32)}

// ---------- 0 ~ T1: the sleeve front: three duotone photo strips snap up one per stab, the title, the memo, the date; Star Runner snaps his fingers
function sceneIntro(t){bgInk();
  const b=BT;[0,1,2].forEach(i=>{if(!DUO[i])return;const x=30+i*345,y=130;snapIn(t,b[i]+.02,()=>{ctx.drawImage(DUO[i],x,y);ctx.fillStyle=C.ink;ctx.fillRect(x,y+640-56,330,56);
    tx(RUN.photoCaps[i]||'',x+18,y+640-18,26,F.kr,C.white,{w:'500',maxW:294})},{dy:60})});
  snapIn(t,b[3]+.02,()=>{tx(RUN.title,70,960,150,F.kr,C.white,{w:'700'})},{dx:-60,dy:0});
  snapIn(t,b[4]+.02,()=>{ctx.fillStyle=C.tang;ctx.fillRect(72,1000,tw(RUN.memo,48,F.kr,'700')+44,72);tx(RUN.memo,94,1052,48,F.kr,C.ink,{w:'700'})},{dx:-40,dy:0});
  snapIn(t,b[5]+.02,()=>{tx(S.dateLong,72,1130,30,F.kr,C.dim,{w:'500'});ctx.fillStyle=C.cobalt;ctx.fillRect(72,1160,936,8)},{dy:20});
  snapIn(t,b[6]+.02,()=>{tx((TOTD/1000).toFixed(2),72,1420,210,F.num,C.white,{w:'900'});tx('KM',80+tw((TOTD/1000).toFixed(2),210,F.num,'900'),1420,60,F.num,C.tang,{w:'800'})},{dx:-60,dy:0});
  dancer(t,820,1830,.62)}

// ---------- T1 ~ T2: the whole Garmin capture (never zoomed or covered) on a cobalt block, ink tags beside it
const CAP={w:1080,h:1431};
function sceneCapture(t){bgPaper();header(t,T1,'오늘의 기록','가민 커넥트 그대로');
  const cw=600,ch=cw*CAP.h/CAP.w,x=W-60-cw,y=380;
  snapIn(t,T1+.02,()=>{ctx.fillStyle=C.cobalt;ctx.fillRect(0,y-40,W,ch+80);ctx.fillStyle=C.ink;ctx.fillRect(x-14,y-14,cw+28,ch+28);ctx.drawImage(IMG.garmin,x,y,cw,ch)},{dx:80,dy:0});
  const REG=[[0,.42,'지도'],[.445,.575,'제목'],[.585,1,'기록']];
  REG.forEach(([a,b,lab],i)=>{const t0=T1+BPER*(1+i*.5);const cy=y+(a+b)/2*ch;snapIn(t,t0,()=>{ctx.fillStyle=C.white;ctx.fillRect(60,cy-32,160,64);tx(lab,140,cy+12,34,F.kr,C.ink,{al:'center',w:'700'});
    ctx.fillStyle=C.white;ctx.fillRect(220,cy-3,x-14-220,6)},{dx:-40,dy:0})});
  stroll(t,T1,T2)}

// ---------- T2 ~ T3: splits as a record's back-cover tracklist: number, a flat cobalt bar, the time in its own column; fastest tangerine, slowest ink outline
function sceneSplits(t){bgPaper();header(t,T2,'구간 기록','1km마다 걸린 시간  막대가 길수록 빠름');
  const top=380,rh=Math.min(104,860/NL);const BX=250,BW=530,NX=1010;const lo=Math.min(...LAPS)-20,hi=Math.max(...LAPS)+10;
  LAPS.forEach((s,k)=>{const t0=T2+.1+k*BPER*.36;const q=snap(t,t0);if(q<0)return;const y=top+k*rh+rh/2;const isF=k===FAST,isS=k===SLOW;const L=lerp(.4,1,(hi-s)/(hi-lo))*BW;
    ctx.fillStyle=C.ink3;ctx.fillRect(70,y+rh/2-1,940,2);
    const lb=lapLabel(k).replace('km','');tx(lb,70,y+20,56,F.num,isF?C.tang:C.ink,{w:'900'});tx('km',78+tw(lb,56,F.num,'900'),y+18,24,F.kr,C.ink2,{w:'700'});
    if(isS){ctx.strokeStyle=C.ink;ctx.lineWidth=4;ctx.strokeRect(BX+2,y-18,L*q-4,36)}else{ctx.fillStyle=isF?C.tang:C.cobalt;ctx.fillRect(BX,y-20,L*q,40)}
    if(q>=1){tx(pace(s),NX,y+22,62,F.num,isF?C.tang:C.ink,{al:'right',w:'800'});if(isF||isS)tx(isF?'가장 빠름':'가장 느림',BX+L+16,y+9,24,F.kr,isF?C.tang:C.ink,{w:'700'})}});
  const ft=T2+BPER*3.6;snapIn(t,ft,()=>{ctx.fillStyle=C.ink;ctx.fillRect(70,1360,940,6);
    tx('평균페이스',72,1430,28,F.kr,C.ink2,{w:'700'});tx(pace(AVGP),66,1560,140,F.num,C.ink,{w:'900'});
    tx('가장 빠른 구간과 느린 구간 차이',1008,1430,28,F.kr,C.ink2,{al:'right',w:'700'});tx(dsec(LAPR[SLOW]-LAPR[FAST]),1008,1540,76,F.kr,C.tang,{al:'right',w:'700'})},{dy:30});
  stroll(t,T2,T3)}

// ---------- T3 ~ T4: pace graph: an ink line over a flat cobalt area; the km of the fastest moment printed tangerine and drawn slowly; a black card stays to the end
const GX0=170,GX1=1000,GY0=520,GY1=1020;
const gx=d=>GX0+d/TOTD*(GX1-GX0),gy=p=>GY0+clamp((p-PLO)/(PHI-PLO))*(GY1-GY0);
function sceneWave(t){bgPaper();header(t,T3,'페이스 그래프',`${(TOTD/1000).toFixed(2)}km 실제 페이스`);
  const WS=[];let c=T3+.15;for(let k=0;k<NL;k++){WS.push(c);c+=k===SK?BPER*2:BPER/4}
  const SK0=WS[SK],SK1=SK0+BPER*2;const kEnd=k=>k<NL-1?(k+1)*1000:TOTD;
  const revAt=tt=>{let d=0;for(let k=0;k<NL;k++){const q=k===SK?Math.pow(P(tt,SK0,SK1),1.3):Math.max(0,snap(tt,WS[k]));if(q>0)d=Math.max(d,lerp(k*1000,kEnd(k),q))}return d};
  const sp=t>=SK0?1:0;
  for(let p=Math.ceil(PLO/60)*60;p<=PHI;p+=60){const y=gy(p);ctx.fillStyle=C.ink3;ctx.fillRect(GX0,y-1,GX1-GX0,2);tx(pace(p),GX0-14,y+10,30,F.num,C.ink2,{al:'right',w:'700'})}
  ctx.fillStyle=C.ink;ctx.fillRect(GX0,GY1+10,GX1-GX0,5);
  for(let k=0;k<=NL;k++){if(k<NL&&k*1000>TOTD-700)continue;const x=gx(Math.min(k*1000,TOTD));tx(k===NL?`${(TOTD/1000).toFixed(2)}km`:String(k),x,GY1+56,32,F.num,C.ink,{al:k===NL?'right':'center',w:'800'})}
  const sx0=gx(SK*1000),sx1=gx(kEnd(SK));if(sp){ctx.fillStyle='rgba(255,106,31,.2)';ctx.fillRect(sx0,GY0-70,sx1-sx0,GY1-GY0+80)}
  LAPS.forEach((s,k)=>{if(t<WS[k])return;const x0=gx(k*1000),x1=gx(kEnd(k));const isK=k===SK&&sp;tx(pace(s),(x0+x1)/2,GY0-30,isK?36:28,F.num,isK?C.tang:C.ink,{al:'center',w:'800',a:isK?1:1-.4*sp})});
  const dR=revAt(t);const pts=PSER.filter(q=>q[0]<=dR).map(q=>[gx(q[0]),gy(q[1]),q[0]]);
  if(pts.length>1){ctx.save();ctx.beginPath();ctx.moveTo(pts[0][0],GY1+10);pts.forEach(q=>ctx.lineTo(q[0],q[1]));ctx.lineTo(pts[pts.length-1][0],GY1+10);ctx.closePath();ctx.fillStyle=C.cobalt;ctx.globalAlpha*=sp?.55:1;ctx.fill();ctx.restore();
    ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore()}
  if(sp){const pk=pts.filter(q=>q[2]>=SK*1000-30&&q[2]<=kEnd(SK));if(pk.length>1){ctx.save();ctx.strokeStyle=C.tang;ctx.lineWidth=9;ctx.lineJoin='round';ctx.beginPath();pk.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore()}}
  if(t>=SK1){const near=PSER.reduce((a,q)=>Math.abs(q[0]-MAXD)<Math.abs(a[0]-MAXD)?q:a,PSER[0]||[MAXD,MAXP]);const x=gx(near[0]),y=gy(near[1]);   // on the drawn line
    ctx.fillStyle=C.ink;ctx.fillRect(x-12,y-12,24,24);ctx.fillStyle=C.tang;ctx.fillRect(x-7,y-7,14,14);
    snapIn(t,SK1+BPER*.5,()=>{const cx=70,cy=1130;ctx.fillStyle=C.ink;ctx.fillRect(cx,cy,640,210);ctx.fillStyle=C.tang;ctx.fillRect(cx,cy,14,210);
      tx(SPRINT_T,cx+44,cy+58,34,F.kr,C.white,{w:'700'});tx('순간 최고',cx+44,cy+150,24,F.kr,C.dim,{w:'500'});tx(pace(MAXP),cx+160,cy+180,110,F.num,C.tang,{w:'900'});
      tx(`${lapLabel(SK)} 구간`,cx+610,cy+110,24,F.kr,C.dim,{al:'right',w:'500'});tx(pace(LAPS[SK]),cx+610,cy+178,62,F.num,C.white,{al:'right',w:'800'})},{dx:-60,dy:0})}
  const rb=[T3+BPER*4,T3+BPER*4.5,T3+BPER*5];
  [['평균페이스',pace(AVGP),C.ink],['최고 페이스',pace(MAXP),C.tang],['총 거리',(TOTD/1000).toFixed(2)+'km',C.cobalt]].forEach(([l,v,c],i)=>snapIn(t,rb[i],()=>{tx(l,72+i*312,1430,26,F.kr,C.ink2,{w:'700'});tx(v,68+i*312,1520,84,F.num,c,{w:'900'})},{dy:30}));
  snapIn(t,rb[2]+BPER,()=>tx(SPLIT_LINE,72,1610,40,F.kr,C.ink,{w:'700'}),{dx:-40,dy:0});
  stroll(t,T3,T4)}

// ---------- T4 ~ T5: heart rate zones (Garmin order 5존 -> 존 미만) as flat blocks in zone colours; average and max big
function sceneZones(t){bgPaper();header(t,T4,'심박존별 시간','가민 심박존 기준');
  [5,4,3,2,1,0].forEach((z,r)=>{const t0=T4+.1+r*BPER/3;const q=snap(t,t0);if(q<0)return;const y=380+r*112;const sec=ZS[z];const col=ZT[z];
    ctx.fillStyle=col;ctx.fillRect(70,y,130,64);tx(z?`${z}존`:'존 미만',135,y+44,z?34:24,F.kr,C.white,{al:'center',w:'700'});tx(zRange(z),135,y+94,20,F.kr,C.ink2,{al:'center',w:'500'});
    const L=sec>0?Math.max(14,560*sec/ZMAX):0;if(L>0){ctx.fillStyle=col;ctx.fillRect(230,y+8,L*q,48)}
    if(q>=1){const x2=230+L+20;tx(mmss(sec),x2,y+52,56,F.num,sec>0?C.ink:'rgba(20,20,20,.3)',{w:'800'});tx(`${Math.round(sec/ZTOT*100)}%`,x2+tw(mmss(sec),56,F.num,'800')+12,y+50,26,F.kr,col,{w:'700'})}});
  const hb=[T4+BPER*1.5,T4+BPER*1.8];
  [['평균심박수',S.avgHR],['최대심박수',S.maxHR]].forEach(([l,v],k)=>snapIn(t,hb[k],()=>{const al=k?'right':'left',x=k?1008:72;ctx.fillStyle=C.ink;ctx.fillRect(k?560:70,1100,450,6);
    tx(l,x,1160,28,F.kr,C.ink2,{al,w:'700'});const vw=tw(String(v),150,F.num,'900'),uw=tw('bpm',30,F.kr,'700');tx(String(v),k?x-uw-12:x,1310,150,F.num,hrCol(v),{al,w:'900'});tx('bpm',k?x:x+vw+12,1310,30,F.kr,C.ink2,{al,w:'700'})},{dy:30}));
  snapIn(t,hb[1]+BPER*.5,()=>{tx(ZONE_LINE,72,1420,44,F.kr,C.ink,{w:'700'});tx(BREAK_LINE,72,1476,28,F.kr,BRK.length?C.tang:C.ink2,{w:'500'})},{dx:-40,dy:0});
  stroll(t,T4,T5)}

// ---------- T5 ~ 30: the back cover: a cobalt band with the title and a tangerine 완주 sticker, Star Runner in his beret, the stats in condensed numerals,
// the memo as liner notes on paper (running-memo-emphasis, record-sleeve style); everything is up by 22 s and holds to the end
function memoStyle(){const COL={num:C.tang,body:'#C8372D',plan:C.cobalt,feel:C.cobalt,key:C.ink};
  return{px:44,headScale:1.12,glow:0,k:0,
    font:(px,kind)=>kind==='num'?`900 ${Math.round(px*1.08)}px "${F.num}"`:kind==='key'?`700 ${px}px "${F.memo}"`:`${px}px "${F.memo}"`,
    color:(kind,k)=>!kind?C.ink:k>.5?COL[kind]:C.ink,
    decorate:(c,kind,x,y,w,px,k)=>{if(k<=0)return;c.save();
      if(kind==='plan'){c.fillStyle='rgba(35,71,198,.16)';c.fillRect(x-4,y-px*.78,(w+8)*k,px*1.0)}
      else if(kind==='body'){c.fillStyle='#C8372D';c.fillRect(x,y+8,w*k,4)}
      else if(kind==='feel'){c.fillStyle=C.cobalt;c.fillRect(x,y+8,w*k,3);c.fillRect(x,y+15,w*k,3)}
      else if(kind==='num'){c.fillStyle='rgba(255,106,31,.16)';c.fillRect(x-6,y-px*.82,w+12,px*1.04)}
      else{c.fillStyle=C.ink;c.fillRect(x,y+8,w*k,4)}c.restore()}}}
let ML=null;
function sceneEnd(t){bgInk();
  snapIn(t,T5+.02,()=>{ctx.fillStyle=C.cobalt;ctx.fillRect(0,0,W,400);tx('오늘의 러닝',72,150,30,F.kr,C.dim,{w:'500',ls:3});tx(RUN.title,66,300,120,F.kr,C.white,{w:'700'})},{dx:0,dy:-60});
  snapIn(t,T5+BPER*.5,()=>{ctx.save();ctx.translate(900,240);ctx.rotate(-.12);ctx.fillStyle=C.tang;ctx.beginPath();ctx.arc(0,0,92,0,7);ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,78,0,7);ctx.stroke();
    tx('완주',0,18,52,F.kr,C.ink,{al:'center',w:'700'});ctx.restore()},{dy:-30});
  dancer(t,540,900,.82);
  const CR=[['총 거리',(TOTD/1000).toFixed(2),'km',C.white],['달린시간',mmss(TT),'',C.white],['평균페이스',pace(AVGP),'',C.tang],
    ['평균심박수',String(S.avgHR),'bpm',hrCol(S.avgHR)],['최대심박수',String(S.maxHR),'bpm',hrCol(S.maxHR)],['칼로리',String(S.kcal),'kcal',C.white]];
  CR.forEach(([l,v,u,c],i)=>{const t0=T5+BPER*(.9+.18*i);const col=i%3,row=Math.floor(i/3);const x=72+col*320,y=960+row*150;
    snapIn(t,t0,()=>{ctx.fillStyle='rgba(246,241,230,.25)';ctx.fillRect(x,y-40,290,2);tx(l,x,y,24,F.kr,C.dim,{w:'500'});const vw=tw(v,80,F.num,'900');tx(v,x-2,y+84,80,F.num,c,{w:'900'});if(u)tx(u,x+vw+8,y+82,24,F.kr,C.dim,{w:'500'})},{dy:30})});
  const mt=T5+BPER*1.8,x=60,y=1250,w=960,h=520;
  snapIn(t,mt,()=>{ctx.fillStyle=C.paper2;ctx.fillRect(x,y,w,h);ctx.fillStyle=C.ink;ctx.fillRect(x+40,y+90,w-80,4);tx('러닝 메모',x+40,y+66,32,F.kr,C.ink,{w:'700'});
    tx('LINER NOTES',x+w-40,y+66,26,F.num,C.ink2,{al:'right',w:'800',ls:3})},{dy:60});
  if(t>=mt){const MLN=MemoEmphasis.parse(RUN.review,RUN.reviewMarks);const mo=memoStyle();
    if(!ML){for(let px=50;px>=32;px-=2){mo.px=px;if(MLN.every(l=>MemoEmphasis.width(ctx,l,mo)<=w-110)){ML={px};break}}if(!ML)ML={px:32}}mo.px=ML.px;
    const lh=ML.px*1.55,top=y+110+(h-110-MLN.length*lh)/2+ML.px*.95;
    MLN.forEach((ln,i)=>{const t1=mt+.1+.14*i;if(t<t1)return;mo.k=P(t,t1+.1,t1+.3)>=1?1:Math.floor(P(t,t1+.1,t1+.3)*3)/3;MemoEmphasis.drawLine(ctx,ln,540,top+i*lh,mo)})}}

// ---------- timeline: hard cuts on the bar; a flat colour block crosses at each cut
const SCENES=[[0,sceneIntro],[T1,sceneCapture],[T2,sceneSplits],[T3,sceneWave],[T4,sceneZones],[T5,sceneEnd]];
const WIPES=[C.cobalt,C.tang,C.ink,C.cobalt,C.tang];
function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);
  if(DR)DR.draw(t<T1||t>=T5?heroState(t):walkState(t));
  let k=0;SCENES.forEach(([s],i)=>{if(t>=s)k=i});SCENES[k][1](t);
  SCENES.slice(1).forEach(([s],i)=>blockWipe(t,s,WIPES[i]));
  const fi=1-P(t,0,.35);if(fi>0){ctx.fillStyle=`rgba(20,20,20,${fi})`;ctx.fillRect(0,0,W,H)}}
window.render=render;window.DUR=DUR;
(async()=>{buildPaper();await Promise.all([...Object.values(IMG),...PHOTOS,...DUO].map(im=>im.complete?0:new Promise(r=>{im.onload=r;im.onerror=r})));buildDuo();
  const fams=[[F.num,'700'],[F.num,'800'],[F.num,'900'],[F.kr,'500'],[F.kr,'700'],[F.memo,''],[F.memo,'700']];
  await Promise.all(fams.map(([f,w])=>document.fonts.load(`${w} 40px "${f}"`,'가나다ABC123')));await document.fonts.ready;
  GLC=document.createElement('canvas');DR=await Jazz3D.init(GLC,{px:DPX});window.READY=true;
  const q=new URLSearchParams(location.search);if(q.has('t'))render(+q.get('t'));else{const s=performance.now();(function loop(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(loop)})()}})();
</script></body></html>

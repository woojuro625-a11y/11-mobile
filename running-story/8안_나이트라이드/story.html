<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="data.js"></script>
<script src="beat.js"></script>
<script src="drums.js"></script>
<script src="bass.js"></script>
<script src="memo_emphasis.js"></script>
<script src="lib/three147.min.js"></script><script src="lib/GLTFLoader.js"></script><script src="lib/starrunner_glb.js"></script><script src="lib/starrunner.js"></script><script src="rider3d.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=30;
// ---------- per-run text (title / memo are not in the FIT file)
const RUN={title:'회복조깅',memo:'10km 뛰려다가 8km까지만',
  review:'10km 뛰려다가 8km까지만\n아직도 근육통이 심하다\n따뜻하게 입어서 그런지 다리가 힘들어서 그런지\n심박수가 급상승 해버렸다\n내일은 하루 더 쉬고 토요일 오전에 뛰어야지',   // keep the memo's own line breaks (\n)
  reviewMarks:'[[10km]] 뛰려다가 [[8km]]까지만\n아직도 [[근육통|body]]이 심하다\n따뜻하게 입어서 그런지 [[다리가 힘들어서|body]] 그런지\n[[심박수가 급상승|body]] 해버렸다\n내일은 [[하루 더 쉬고|plan]] [[토요일 오전|plan]]에 뛰어야지',
  photos:['img/photo1.jpg','img/photo2.jpg'],photoCaps:['11월 26일 밤','오후 7시 24분']};
// ---------- look: a night highway seen from a speeding motorcycle (navy sky, city glow on the horizon, sodium street lamps rushing past, teal accents)
const C={bg:'#07090D',panel:'rgba(10,13,19,.86)',white:'#F4F1EA',dim:'rgba(244,241,234,.6)',faint:'rgba(244,241,234,.13)',amber:'#FFA43A',teal:'#3DD6C8',red:'#FF4B3E',green:'#35C46A',blue:'#5AA9FF'};
const ZC=['#9AA3AD','#C9D0D8','#4AB3F4','#3DDC84','#F5A623','#F0524F'];        // zone colours (존 미만 1 2 3 4 5) on dark
const hrCol=h=>ZC[DATA.zones.filter(b=>h>=b).length];
const F={hd:'Black Han Sans',num:'Saira Condensed',kr:'Noto Sans KR',memo:'Gowun Dodum'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---------- utils
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=t=>1-Math.pow(1-t,3),eio3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,eob=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mmss=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const pace=s=>{s=Math.round(s);return `${Math.floor(s/60)}'${String(s%60).padStart(2,'0')}"`};
const dsec=s=>{s=Math.round(s);return s>=60?`${Math.floor(s/60)}분 ${s%60}초`:`${s}초`};
function tx(s,x,y,px,fam,col,{w='',al='left',a=1,ls=0,maxW=0}={}){
  ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.textAlign=al;ctx.textBaseline='alphabetic';ctx.letterSpacing=ls+'px';ctx.fillStyle=col;
  const m=ctx.measureText(s).width;ctx.translate(x,y);if(maxW&&m>maxW)ctx.scale(maxW/m,1);ctx.fillText(s,0,0);ctx.restore()}
function tw(s,px,fam,w='',ls=0){ctx.save();ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

// ---------- the song: dark four-on-the-floor house ~126 BPM in E phrygian, open hats on the offbeats
// edit (bars of 1.90 s): bar0 intro | bar2 the bass hits | bar3~5 riser | bar6 DROP | bar9 break | bar10 groove | bar11 join to the last drop | bar13 end hit | ring-out
const BT=BEATS.map(b=>b[0]),DB=BEATS.filter(b=>b[1]).map(b=>b[0]);
const BPER=BT[1]-BT[0],BAR=BPER*4;const bar=k=>DB[k];
const lastOf=(arr,t)=>{let r=-1e9;for(const x of arr){if(x<=t)r=x;else break}return r};
const KK=DRUMS.beats.filter(b=>b[1]>.3).map(b=>b[0]);
const kickP=(t,k=.1)=>{const b=lastOf(KK,t);return t-b<1?Math.exp(-(t-b)/k):0};
const OFF=BT.map(b=>b+BPER/2);const hatP=(t,k=.06)=>{const b=lastOf(OFF,t);return t-b<1?Math.exp(-(t-b)/k):0};
const fr=t=>Math.max(0,Math.min(1799,Math.floor(t*60)));const bassAt=t=>BASS[fr(t)],loudAt=t=>LOUD[fr(t)];
const beatsFrom=(t0,n)=>{const i=BT.findIndex(b=>b>=t0-.02);return BT.slice(i,i+n)};
const T1=bar(2),T2=bar(4),T3=bar(6),T4=bar(9),T5=bar(11),HIT=bar(13),RING=bar(14);
// riding speed follows the song: slow intro, rolling after the bass, speeding up through the riser, full speed on the drop, easing in the break, stopping in the ring-out
function speed(t){if(t<T1)return .5;if(t<bar(3))return .9;if(t<T3)return lerp(.9,2.4,eio3(P(t,bar(3),T3)));if(t<T4)return 3.2;if(t<bar(10))return 1.1;if(t<HIT)return 2.8;
  return 2.8*Math.pow(1-P(t,HIT,RING+1.2),2)}
const DIST=new Float32Array(1801);for(let i=1;i<=1800;i++)DIST[i]=DIST[i-1]+speed((i-.5)/60)/60;
const distAt=t=>{const f=clamp(t*60,0,1800),i=Math.floor(f);return i>=1800?DIST[1800]:lerp(DIST[i],DIST[i+1],f-i)};

// ---------- images
const IMG={};['garmin'].forEach(n=>{const im=new Image();im.src=`img/${n}.png`;IMG[n]=im});
const PHOTOS=RUN.photos.map(src=>{const im=new Image();im.src=src;return im});

// ---------- data
const S=DATA.session,TOTD=S.dist,TT=S.time;
const LAPS=DATA.laps.map(l=>l[1]/(l[0]/1000)),LAPD=DATA.laps.map(l=>l[0]),NL=LAPS.length;
const LAPR=LAPS.map(s=>Math.round(s));
const FAST=LAPR.indexOf(Math.min(...LAPR)),SLOW=LAPR.indexOf(Math.max(...LAPR));
const lapLabel=i=>LAPD[i]>=990?`${i+1}km`:`${(LAPD.slice(0,i+1).reduce((a,b)=>a+b,0)/1000).toFixed(2)}km`;
const MAXP=(DATA.maxPace&&DATA.maxPace.sec)||Math.min(...LAPS),MAXD=(DATA.maxPace&&DATA.maxPace.dist)||TOTD;
const PSER=DATA.paceSeries||[];const PSORT=PSER.map(x=>x[1]).sort((a,b)=>a-b);const P98=PSORT.length?PSORT[Math.floor(PSORT.length*.98)]:Math.max(...LAPS);
const PLO=Math.floor((Math.min(MAXP,PSORT[0]||MAXP,...LAPS)-8)/10)*10,PHI=Math.ceil((Math.max(P98,...LAPS)+10)/10)*10;
const AVGP=TT/(TOTD/1000);
const SPLIT_LINE=(()=>{const sp=Math.max(...LAPR)-Math.min(...LAPR);const last=LAPR[NL-1],first=LAPR[0];
  if(sp<=20)return'흔들림 없이 같은 리듬으로';if(last===Math.min(...LAPR)&&first>=Math.max(...LAPR)-5)return'갈수록 빨라지고 마지막은 스퍼트';
  if(last===Math.min(...LAPR))return'마지막 1km는 스퍼트';return'구간마다 리듬을 바꿔 가며'})();
const ZS=DATA.zoneSec,ZTOT=ZS.reduce((a,b)=>a+b,0),ZMAX=Math.max(...ZS);const ZTOP=ZS.slice(1).indexOf(Math.max(...ZS.slice(1)))+1;
const ZONE_LINE=`가장 오래 머문 구간은 ${ZTOP}존 ${Math.round(ZS[ZTOP]/ZTOT*100)}%`;
const zRange=i=>i===0?`${DATA.zones[0]-1} 이하`:i<5?`${DATA.zones[i-1]}~${DATA.zones[i]-1}`:`${DATA.zones[4]} 이상`;
const BRK=DATA.breaks||[];
const BREAK_LINE=BRK.length?`중간에 ${BRK.length}번 멈춤 ${dsec(BRK.reduce((a,b)=>a+b.dur,0))}`:'중간 멈춤 없이 연속 달리기';
const SK=Math.min(NL-1,Math.floor(MAXD/1000));
const SPRINT_T=SK===NL-1&&LAPR[NL-1]===Math.min(...LAPR)?'마지막 1km 스퍼트':SK===NL-1?'마지막 1km 가장 빠른 순간':`${SK+1}km 구간 가장 빠른 순간`;

// ---------- the highway: a photo of an empty city highway at night, zoomed continuously around its vanishing point (forward in the rider's view,
// backwards when the camera rides in front of Star Runner) with two cross-faded copies, zoom blur and light streaks that grow with the song's speed;
// in the rider's view the real handlebars, gauge and tank (cut out of the cockpit photo) stay fixed in front
const ROAD=new Image();ROAD.src='img/hwy_open.jpg';const COCK=new Image();COCK.src='img/cockpit.png';
const VPI={x:459,y:900};const VP={x:540,y:860};const ZZ=1.28;
const bend=t=>.5*Math.sin(2*Math.PI*t/11)+.22*Math.sin(2*Math.PI*t/4.7+1);
function roadLayer(s,a){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.translate(VP.x,VP.y);ctx.scale(s,s);ctx.drawImage(ROAD,-VPI.x,-VPI.y,1080,1920);ctx.restore()}
function road(t,{dim=0,dir=1}={}){const sp=speed(t),k=kickP(t,.11)*Math.min(1,loudAt(t)*3+.15);
  ctx.fillStyle='#05070C';ctx.fillRect(0,0,W,H);
  const ph=distAt(t)*.42*dir,p=((ph%1)+1)%1;const base=1.09;                                    // base > 1 so the shifted photo always fills the frame
  roadLayer(base*Math.pow(ZZ,p),1);roadLayer(base*Math.pow(ZZ,p+1),1-p);                         // two copies one zoom-step apart, cross-faded: an endless ride
  const zb=clamp((sp-1.2)/2);if(zb>0)for(let j=1;j<=3;j++)roadLayer(base*Math.pow(ZZ,p)*(1+.018*j*zb*(1+sp*.2)),.16*zb);   // zoom blur
  const lg=ctx.createRadialGradient(VP.x,VP.y,0,VP.x,VP.y,900);lg.addColorStop(0,'rgba(255,180,100,0)');lg.addColorStop(.6,`rgba(255,170,80,${.05+.1*k})`);lg.addColorStop(1,'rgba(255,170,80,0)');ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);   // lamps flare on the kick
  const d=distAt(t);const n=Math.round(10+22*clamp(sp/3.2));for(let i=0;i<n;i++){const a=rnd(i)*Math.PI*2,q=(((dir>0?d*1.6:-d*1.6)+rnd(i+9))%1+1)%1;const r0=160+q*1000,r1=r0+40+q*q*420*(.5+sp*.3);   // light streaks
    const warm=rnd(i+3)>.4;ctx.strokeStyle=warm?`rgba(255,200,130,${.32*q*clamp(sp/2)})`:`rgba(210,235,255,${.26*q*clamp(sp/2)})`;ctx.lineWidth=1.5+q*2.5;
    ctx.beginPath();ctx.moveTo(VP.x+Math.cos(a)*r0,VP.y+Math.sin(a)*r0*.85);ctx.lineTo(VP.x+Math.cos(a)*r1,VP.y+Math.sin(a)*r1*.85);ctx.stroke()}
  const v=ctx.createRadialGradient(VP.x,VP.y,300,VP.x,VP.y,1300);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(0,0,0,${.45+.15*clamp(sp/3)})`);ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  const sc=ctx.createLinearGradient(0,0,0,520);sc.addColorStop(0,'rgba(4,6,10,.7)');sc.addColorStop(1,'rgba(4,6,10,0)');ctx.fillStyle=sc;ctx.fillRect(0,0,W,520);
  if(dim>0){ctx.fillStyle=`rgba(4,6,10,${dim*.6})`;ctx.fillRect(0,0,W,H)}}
const tunnel=(t,o)=>road(t,o);
// the rider's view: the real cockpit in front, shaking a little with speed and the kick; a tiny Star Runner bobblehead stands on the dash (the easter egg)
function cockpit(t){const sp=speed(t);const sh=(rnd(Math.floor(t*30))-.5)*2*(.4+sp*.45)+2.2*kickP(t,.08);ctx.save();ctx.translate(sh*.5,sh);
  ctx.drawImage(COCK,-6,1250-6,1092,682);
  if(DR){const [gw,gh]=DR.size;const k=.16*240/DPX;ctx.drawImage(GLC,712-gw*k/2,1356-gh*DR.feet*k,gw*k,gh*k)}
  ctx.restore()}
// a glass screen on the dash (TFT / navigation): dark glass, thin cyan bezel, soft glow, faint scanlines
function hud(x,y,w,h,label,t,t0){const p=eo3(P(t,t0,t0+.35));if(p<=0)return 0;ctx.save();ctx.globalAlpha*=p;ctx.translate(0,30*(1-p));
  ctx.shadowColor='rgba(61,214,200,.35)';ctx.shadowBlur=40;ctx.fillStyle='rgba(6,10,16,.8)';rr(x,y,w,h,30);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(120,230,220,.45)';ctx.lineWidth=2;rr(x,y,w,h,30);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;for(let yy=y+6;yy<y+h;yy+=6){ctx.beginPath();ctx.moveTo(x+14,yy);ctx.lineTo(x+w-14,yy);ctx.stroke()}
  const gl=ctx.createLinearGradient(0,y,0,y+h*.4);gl.addColorStop(0,'rgba(255,255,255,.07)');gl.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=gl;rr(x+2,y+2,w-4,h*.4,28);ctx.fill();
  if(label){tx(label,x+30,y+44,22,F.num,'rgba(120,230,220,.85)',{w:'600',ls:4})}ctx.restore();return p}
function header(t,t0,title,sub){const p=eo3(P(t,t0,t0+.3));ctx.save();ctx.globalAlpha*=p;ctx.translate(-40*(1-p),0);
  ctx.fillStyle=C.amber;ctx.fillRect(80,180,10,104);tx(title,112,250,72,F.hd,C.white);tx(sub,114,292,26,F.kr,C.amber,{w:'700'});ctx.restore()}
function pop(t,t0,draw,{dur=.28,from=.6}={}){if(t<t0)return;const p=P(t,t0,t0+dur);ctx.save();ctx.globalAlpha*=clamp(p*2.5);draw(lerp(from,1,eob(p)));ctx.restore()}

// ---------- Star Runner on his motorcycle (live 3D, bike goggles). The hero of the opening and the ending; in the data scenes only his face in the mirror.
// Motion follows the song: leans into the road's bends, nods on the beat, tucks down for speed on the drop, a fist pump, a wheelie on the end hit, then stops and waves
const DPX=330;let DR=null,GLC=null;
function riderState(t){const e=clamp(speed(t)/2.4,.3,1);const bt=(t-BT[0])/BPER,ph=((bt%1)+1)%1;const hit=Math.pow(.5+.5*Math.cos(2*Math.PI*ph),2);
  const o={azim:.32,elev:.1,roll:-16*bend(t)-2*Math.sin(t*5)*e*.3,yaw:-6*bend(t),bob:.012*Math.abs(Math.sin(t*17))*e+.02*kickP(t,.1),head:4+7*hit,headTurn:8*Math.sin(2*Math.PI*t/(BAR*2)),tuck:0,spin:distAt(t)*9};
  if(t<T1){o.headTurn=lerp(-26,0,eio3(P(t,BT[2],BT[4])))+6*Math.sin(t*2);o.tuck=0}                                                  // the opening: looks over at the camera, then ahead
  if(t>=T5){o.tuck=eio3(P(t,T5,T5+.5))*(1-eio3(P(t,HIT-.25,HIT)));                                                                  // the last drop: tuck down for speed
    const fp=P(t,bar(12),bar(12)+BPER*2);if(fp>0&&fp<1){const u=Math.sin(Math.PI*fp);o.shR=[lerp(-86,-40,u),0,lerp(-12,-60,u)];o.elR=lerp(-12,-110,u)+20*Math.sin(fp*Math.PI*6)*u;o.headTurn=-14*u}   // a fist pump
    const wh=P(t,HIT,HIT+1.6);if(wh>0&&wh<1){const u=Math.sin(Math.PI*Math.pow(wh,.7));o.lean=-24*u;o.bob+=.32*u;o.head-=10*u}       // the wheelie on the end hit
    const st=P(t,RING,RING+1.2);if(st>0){const u=eio3(st);o.roll*=1-u;o.yaw*=1-u;o.bob*=1-u;o.headTurn=lerp(o.headTurn,-10,u);o.head=lerp(o.head,0,u);o.azim=lerp(.32,.15,u);
      const wv=P(t,RING+1.3,RING+1.7);if(wv>0){o.shL=[lerp(-80,-15,eo3(wv)),0,lerp(12,100,eo3(wv))];o.elL=-40+30*Math.sin((t-RING)*9);o.headTilt=-8*wv}}}
  return o}
function bobbleState(t){const bt=(t-BT[0])/BPER,ph=((bt%1)+1)%1;const hit=Math.pow(.5+.5*Math.cos(2*Math.PI*ph),2);const sh=kickP(t,.12);
  return{stand:true,azim:-.35,elev:.15,head:6+14*hit,headTurn:10*Math.sin(t*1.7),headTilt:8*Math.sin(t*2.3),roll:4*Math.sin(t*9)*(.3+sh),bob:.03*sh,shR:[0,0,-14],shL:[0,0,14],elR:-15,elL:-15}}   // the dash bobblehead nods with every bump
function mirrorState(t){const bt=(t-BT[0])/BPER,ph=((bt%1)+1)%1;return{azim:0,elev:.06,head:3+6*Math.pow(.5+.5*Math.cos(2*Math.PI*ph),2),headTurn:6*Math.sin(t*1.3),roll:-6*bend(t),spin:distAt(t)*9}}
function runner(t,cx,feetY,sc){if(!DR)return;const [gw,gh]=DR.size;const k=sc*240/DPX;const y0=feetY-gh*DR.feet*k;
  ctx.save();ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.ellipse(cx,feetY+6,gw*k*.2,12*sc,0,0,7);ctx.fill();ctx.drawImage(GLC,cx-gw*k/2,y0,gw*k,gh*k);ctx.restore()}

// ---------- 0 ~ T1: the tunnel at night, title, photos as lit panels on the walls
function sceneIntro(t){road(t,{dim:.1,dir:-1});const b=BT;
  pop(t,b[0]+.05,s=>tx('오늘의 러닝',540,210,40,F.hd,C.amber,{al:'center'}));
  pop(t,b[1],s=>{ctx.save();ctx.translate(540,350);ctx.scale(s,s);tx(RUN.title,0,0,150,F.hd,C.white,{al:'center'});ctx.restore()});
  pop(t,b[2],s=>{tx(RUN.memo,540,440,40,F.hd,C.amber,{al:'center'});tx(S.dateLong,540,494,30,F.kr,C.dim,{al:'center',w:'500'})});
  PHOTOS.forEach((im,i)=>{const t0=b[4+i*2];const cx=i?790:290,cy=880,w=380,h=470;
    pop(t,t0,s=>{ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);ctx.shadowColor='rgba(255,164,58,.55)';ctx.shadowBlur=40;ctx.fillStyle='#10141B';ctx.fillRect(-w/2-12,-h/2-12,w+24,h+84);ctx.shadowBlur=0;
      const sc=Math.max(w/im.width,h/im.height);const sw=w/sc,sh=h/sc;ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,-w/2,-h/2,w,h);
      ctx.strokeStyle=C.amber;ctx.lineWidth=3;ctx.strokeRect(-w/2-12,-h/2-12,w+24,h+84);tx(RUN.photoCaps[i]||'',0,h/2+52,32,F.kr,C.white,{al:'center',w:'700'});ctx.restore()})});
  runner(t,540,1800,.78)}

// ---------- T1 ~ T2: the whole Garmin capture on a phone clipped into a handlebar mount (never zoomed or covered), tags beside it
const CAP={w:1080,h:1483};
function sceneCapture(t){road(t,{dim:.35});header(t,T1,'오늘의 기록','가민 커넥트 그대로');
  const cw=560,ch=cw*CAP.h/CAP.w,x=540-cw/2+40,y=372;const p=eo3(P(t,T1,T1+.4));ctx.save();ctx.globalAlpha*=p;ctx.translate(0,60*(1-p));
  ctx.fillStyle='#1A1C21';ctx.fillRect(x+cw/2-18,y+ch+20,36,1320-(y+ch+20));ctx.fillStyle='#2A2D34';ctx.fillRect(x+cw/2-30,y+ch+10,60,24);            // mount stem down to the bars
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=40;ctx.fillStyle='#0D0E11';rr(x-20,y-24,cw+40,ch+48,48);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#3A3D45';ctx.lineWidth=3;rr(x-20,y-24,cw+40,ch+48,48);ctx.stroke();
  [[x-34,y+ch*.3],[x+cw+20,y+ch*.3]].forEach(([cx,cy])=>{ctx.fillStyle='#22252B';rr(cx,cy,14,120,6);ctx.fill()});                                    // the clamp arms
  ctx.save();rr(x,y,cw,ch,22);ctx.clip();ctx.drawImage(IMG.garmin,x,y,cw,ch);ctx.restore();ctx.restore();
  const REG=[[0,.405,'지도'],[.41,.565,'제목'],[.575,1,'기록']];const hb=beatsFrom(T1,8);
  REG.forEach(([a,b,lab],i)=>{const t0=hb[1+i*2];const cy=y+(a+b)/2*ch;if(t<t0)return;const q=eo3(P(t,t0,t0+.25));
    ctx.save();ctx.globalAlpha*=q;ctx.fillStyle=C.amber;rr(30,cy-28,104,56,8);ctx.fill();tx(lab,82,cy+11,30,F.hd,'#120C04',{al:'center'});
    ctx.strokeStyle=C.amber;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(136,cy);ctx.lineTo(lerp(136,x-40,q),cy);ctx.stroke();ctx.restore()});
  cockpit(t)}

// ---------- T2 ~ T3 (the riser): splits on the bike's TFT lap screen, 1km to the last km top to bottom, one row per beat, faster and faster
function sceneSplits(t){road(t,{dim:.35});header(t,T2,'구간 기록','1km마다 걸린 시간  막대가 길수록 빠름');
  const X=60,Y=360,Wd=960,Hd=860;hud(X,Y,Wd,Hd,'LAP  1KM SPLITS',t,T2);
  const lo=Math.min(...LAPS)-25,hi=Math.max(...LAPS)+15;const rh=Math.min(88,620/NL);
  LAPS.forEach((s,k)=>{const t0=T2+.15+k*BPER*.7;const y=Y+80+k*rh;const isF=k===FAST,isS=k===SLOW;const len=lerp(200,520,(hi-s)/(hi-lo));const col=isF?C.red:isS?C.blue:C.amber;
    if(t<t0)return;const p=eo3(P(t,t0,t0+.25));tx(lapLabel(k),X+40,y+52,34,F.num,C.dim,{w:'600'});
    const segs=Math.round(len/22);for(let j=0;j<segs;j++){const q=clamp(p*segs-j);if(q<=0)break;ctx.fillStyle=col;ctx.globalAlpha=.3+.7*q;rr(X+150+j*22,y+16,16,46,3);ctx.fill();ctx.globalAlpha=1}   // LED segments
    const vt=t0+.18;if(t>=vt){const a=P(t,vt,vt+.2);tx(pace(s),X+150+segs*22+20,y+58,52,F.num,isF?C.red:isS?C.blue:C.white,{w:'800',a});
      if(isF||isS){const tg=isF?'가장 빠름':'가장 느림';ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=col;const ww=tw(tg,22,F.hd)+20;rr(X+Wd-ww-36,y+20,ww,38,8);ctx.fill();tx(tg,X+Wd-36-ww/2,y+47,22,F.hd,'#0A0C10',{al:'center'});ctx.restore()}}});
  const ft=T2+BPER*6.4;pop(t,ft,s=>{ctx.fillStyle='rgba(120,230,220,.18)';ctx.fillRect(X+30,Y+Hd-150,Wd-60,2);
    tx('평균페이스',X+40,Y+Hd-104,28,F.kr,C.dim,{w:'700'});tx(pace(AVGP),X+40,Y+Hd-30,80,F.num,C.teal,{w:'800'});
    tx('빠른 1km와 느린 1km 차이',X+Wd-40,Y+Hd-104,28,F.kr,C.dim,{al:'right',w:'700'});tx(dsec(LAPR[SLOW]-LAPR[FAST]),X+Wd-40,Y+Hd-36,58,F.hd,C.amber,{al:'right'})});
  cockpit(t)}

// ---------- T3 ~ T4 (the drop, full speed): the pace graph as a route on the navigation screen; a position arrow drives along it;
// the km with the fastest moment is lit red and drawn slowly; then the sprint card stays to the end of the scene
const GX0=170,GX1=970,GY0=600,GY1=930;
const gx=d=>GX0+d/TOTD*(GX1-GX0),gy=p=>GY0+clamp((p-PLO)/(PHI-PLO))*(GY1-GY0);
function sceneWave(t){road(t,{dim:.35});header(t,T3,'페이스 그래프',`${(TOTD/1000).toFixed(2)}km 실제 페이스`);
  const X=50,Y=360,Wd=980,Hd=860;hud(X,Y,Wd,Hd,'NAVI  PACE ROUTE',t,T3);
  ctx.save();rr(X+2,Y+2,Wd-4,Hd-4,28);ctx.clip();ctx.strokeStyle='rgba(90,170,200,.07)';ctx.lineWidth=2;                                            // a faint street grid like a night map
  for(let i=0;i<14;i++){ctx.beginPath();ctx.moveTo(X+rnd(i)*Wd,Y);ctx.lineTo(X+rnd(i+20)*Wd,Y+Hd);ctx.stroke();ctx.beginPath();ctx.moveTo(X,Y+rnd(i+40)*Hd);ctx.lineTo(X+Wd,Y+rnd(i+60)*Hd);ctx.stroke()}ctx.restore();
  const WS=[];let c=T3+.15;for(let k=0;k<NL;k++){WS.push(c);c+=k===SK?BPER*3:BPER/2}
  const SK0=WS[SK],SK1=SK0+BPER*3;const kEnd=k=>k<NL-1?(k+1)*1000:TOTD;
  const revAt=tt=>{let d=0;for(let k=0;k<NL;k++){const q=k===SK?Math.pow(P(tt,SK0,SK1),1.3):eo3(P(tt,WS[k],WS[k]+.25));if(q>0)d=Math.max(d,lerp(k*1000,kEnd(k),q))}return d};
  const sp=P(t,SK0,SK0+.2);if(t<T3+.15)return cockpit(t);
  for(let p=Math.ceil(PLO/60)*60;p<=PHI;p+=60){const y=gy(p);ctx.strokeStyle='rgba(244,241,234,.12)';ctx.lineWidth=2;ctx.setLineDash([6,10]);ctx.beginPath();ctx.moveTo(GX0,y);ctx.lineTo(GX1,y);ctx.stroke();ctx.setLineDash([]);
    tx(pace(p),GX0-14,y+8,24,F.num,C.dim,{al:'right',w:'600'})}
  for(let k=0;k<=NL;k++){const x=gx(Math.min(k*1000,TOTD));tx(k===NL?`${(TOTD/1000).toFixed(2)}km`:String(k),x,GY1+40,24,F.num,C.dim,{al:k===NL?'right':'center',w:'600'})}
  const sx0=gx(SK*1000),sx1=gx(kEnd(SK));if(sp>0){const g=ctx.createLinearGradient(0,GY0-60,0,GY1);g.addColorStop(0,`rgba(255,75,62,${.34*sp})`);g.addColorStop(1,'rgba(255,75,62,0)');ctx.fillStyle=g;ctx.fillRect(sx0,GY0-60,sx1-sx0,GY1-GY0+60)}
  LAPS.forEach((s,k)=>{if(t<WS[k])return;const x0=gx(k*1000),x1=gx(kEnd(k));const isK=k===SK&&sp>0;const col=isK?C.red:k===FAST?C.amber:k===SLOW?C.blue:C.white;
    tx(pace(s),(x0+x1)/2,GY0-30,isK?32:24,F.num,col,{al:'center',w:'800',a:isK?1:1-.45*sp})});
  const dR=revAt(t);const pts=PSER.filter(q=>q[0]<=dR).map(q=>[gx(q[0]),gy(q[1]),q[0]]);
  if(pts.length>1){ctx.save();ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle='rgba(61,214,200,.25)';ctx.lineWidth=16;ctx.globalAlpha*=1-.45*sp;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();
    ctx.strokeStyle=C.teal;ctx.lineWidth=5;ctx.stroke();ctx.restore();
    const hd=pts[pts.length-1],pv=pts[Math.max(0,pts.length-4)];if(dR<TOTD-5){const a=Math.atan2(hd[1]-pv[1],hd[0]-pv[0]);ctx.save();ctx.translate(hd[0],hd[1]);ctx.rotate(a);ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-10,-11);ctx.lineTo(-5,0);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();ctx.restore()}}   // the nav position arrow
  if(sp>0){const pk=pts.filter(q=>q[2]>=SK*1000-30&&q[2]<=kEnd(SK));if(pk.length>1){ctx.save();ctx.shadowColor=C.red;ctx.shadowBlur=20;ctx.strokeStyle=C.red;ctx.lineWidth=7;ctx.lineJoin='round';ctx.beginPath();pk.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore()}}
  if(t>=SK1){const x=gx(MAXD),y=gy(MAXP);ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    pop(t,SK1,s=>{ctx.save();ctx.translate(430,700);ctx.strokeStyle=C.red;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(280,0);ctx.lineTo(x-430-14,y-700);ctx.stroke();ctx.scale(s,s);
      ctx.fillStyle='rgba(30,8,8,.92)';rr(-280,-90,560,180,16);ctx.fill();ctx.strokeStyle=C.red;ctx.lineWidth=3;rr(-280,-90,560,180,16);ctx.stroke();ctx.fillStyle=C.red;rr(-280,-90,14,180,[16,0,0,16]);ctx.fill();
      tx(SPRINT_T,-240,-34,34,F.hd,C.white);tx('순간 최고',-240,40,24,F.kr,C.dim,{w:'700'});tx(pace(MAXP),-126,62,80,F.num,C.red,{w:'800'});
      tx(`${lapLabel(SK)} 구간`,252,4,24,F.kr,C.dim,{al:'right',w:'700'});tx(pace(LAPS[SK]),252,62,50,F.num,C.white,{al:'right',w:'800'});ctx.restore()})}
  const rb=[T3+BPER*7,T3+BPER*7.5,T3+BPER*8];
  [['평균페이스',pace(AVGP),C.teal],['최고 페이스',pace(MAXP),C.red],['총 거리',(TOTD/1000).toFixed(2)+'km',C.amber]].forEach(([l,v,c],i)=>pop(t,rb[i],s=>{tx(l,110+i*300,1040,26,F.kr,C.dim,{w:'700'});tx(v,110+i*300,1114,70,F.num,c,{w:'800'})}));
  pop(t,T3+BPER*9,s=>tx(SPLIT_LINE,540,1192,42,F.hd,C.white,{al:'center'}));
  cockpit(t)}

// ---------- T4 ~ T5 (the break, then the groove): heart rate zones on the cluster (Garmin order 5존 -> 존 미만) as LED bars, and a tacho-style heart rate gauge
function sceneZones(t){road(t,{dim:.35});header(t,T4,'심박존별 시간','가민 심박존 기준');
  const X=50,Y=360,Wd=980,Hd=860;hud(X,Y,Wd,Hd,'HEART RATE  ZONES',t,T4);
  [5,4,3,2,1,0].forEach((z,r)=>{const t0=T4+.15+r*BPER/3;const y=Y+62+r*86;const sec=ZS[z];const col=ZC[z];if(t<t0)return;const p=eo3(P(t,t0,t0+.3));
    ctx.save();ctx.globalAlpha*=clamp(p*2);ctx.fillStyle=col;rr(X+40,y+6,118,52,8);ctx.fill();tx(z?`${z}존`:'존 미만',X+99,y+44,z?34:22,F.hd,'#0A0C10',{al:'center'});ctx.restore();
    tx(zRange(z),X+99,y+82,20,F.kr,C.dim,{al:'center',w:'700',a:p});
    const L=sec>0?Math.max(26,470*sec/ZMAX):0;const n=Math.round(L/24);for(let j=0;j<n;j++){const q=clamp(p*n-j);if(q<=0)break;ctx.fillStyle=col;ctx.globalAlpha=.35+.65*q;rr(X+190+j*24,y+10,18,44,3);ctx.fill();ctx.globalAlpha=1}
    const x2=X+190+n*24+16;tx(mmss(sec),x2,y+50,46,F.num,sec>0?C.white:'rgba(244,241,234,.35)',{w:'800',a:P(t,t0+.1,t0+.3)});tx(`${Math.round(sec/ZTOT*100)}%`,x2+tw(mmss(sec),46,F.num,'800')+10,y+48,24,F.kr,col,{w:'900',a:P(t,t0+.1,t0+.3)})});
  // tacho gauge: 90~190 bpm, zone-coloured band, needle sweeps to the average, a red mark at the max
  const gt=bar(10);const gp=eo3(P(t,gt,gt+.6));if(gp>0){const cx=540,cy=1150,R=112,A0=Math.PI*.85,A1=Math.PI*2.15,lo=90,hi=190;const ang=b=>A0+(clamp((b-lo)/(hi-lo)))*(A1-A0);
    ctx.save();ctx.globalAlpha*=gp;ctx.lineWidth=18;const edges=[lo,...DATA.zones,hi];for(let z=0;z<6;z++){ctx.strokeStyle=ZC[z];ctx.beginPath();ctx.arc(cx,cy,R,ang(edges[z]),ang(edges[z+1]));ctx.stroke()}
    for(let b=lo;b<=hi;b+=10){const a=ang(b);ctx.strokeStyle='rgba(244,241,234,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(R-16),cy+Math.sin(a)*(R-16));ctx.lineTo(cx+Math.cos(a)*(R-28),cy+Math.sin(a)*(R-28));ctx.stroke()}
    const am=ang(S.maxHR);ctx.strokeStyle=C.red;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx+Math.cos(am)*(R-12),cy+Math.sin(am)*(R-12));ctx.lineTo(cx+Math.cos(am)*(R+16),cy+Math.sin(am)*(R+16));ctx.stroke();
    const an=lerp(A0,ang(S.avgHR),eo3(P(t,gt+.2,gt+1)));ctx.strokeStyle='#FFFFFF';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(an)*(R-30),cy+Math.sin(an)*(R-30));ctx.stroke();ctx.fillStyle='#22252B';ctx.beginPath();ctx.arc(cx,cy,14,0,7);ctx.fill();ctx.restore();
    [['평균심박수',S.avgHR,0],['최대심박수',S.maxHR,1]].forEach(([l,v,k])=>{const al=k?'right':'left',x=k?X+Wd-40:X+40;tx(l,x,1100,26,F.kr,C.dim,{al,w:'700',a:gp});
      const vw=tw(String(v),84,F.num,'800'),uw=tw('bpm',24,F.kr,'700');tx(String(v),k?x-uw-8:x,1180,80,F.num,hrCol(v),{al,w:'800',a:gp});tx('bpm',k?x:x+vw+8,1180,24,F.kr,C.dim,{al,w:'700',a:gp})})}
  pop(t,bar(10)+BPER*2,s=>{tx(ZONE_LINE,540,962,38,F.hd,C.white,{al:'center'});tx(BREAK_LINE,540,1000,24,F.kr,BRK.length?C.amber:C.dim,{al:'center',w:'700'})});
  cockpit(t)}

// ---------- T5 ~ 30 (the last drop, the end hit, the ring-out): title, Star Runner, stats; 완주 lights up like an exit sign on the end hit; the memo; the tunnel slows and stops
function memoStyle(){const COL={num:C.amber,body:C.red,plan:C.teal,feel:C.blue,key:C.white};
  return{px:44,headScale:1.12,glow:0,k:0,
    font:(px,kind)=>kind==='num'?`800 ${Math.round(px*1.05)}px "${F.num}"`:`${px}px "${F.memo}"`,
    color:(kind,k)=>!kind?C.white:k>.5?COL[kind]:C.white,
    decorate:(c,kind,x,y,w,px,k)=>{if(k<=0)return;c.save();
      if(kind==='plan'){c.fillStyle='rgba(61,214,200,.24)';c.beginPath();c.roundRect(x-5,y-px*.78,(w+10)*k,px*1.02,4);c.fill()}
      else if(kind==='body'){c.strokeStyle=C.red;c.lineWidth=4;c.setLineDash([12,7]);c.beginPath();c.moveTo(x,y+10);c.lineTo(x+w*k,y+10);c.stroke()}      // like a lane marking
      else if(kind==='num'){c.fillStyle=`rgba(255,164,58,${.16*k})`;c.beginPath();c.roundRect(x-6,y-px*.8,w+12,px*1.04,6);c.fill()}
      else{c.fillStyle=C.white;c.fillRect(x,y+9,w*k,3)}c.restore()}}}
let ML=null;
function sceneEnd(t){const hit=P(t,HIT,HIT+.15),ring=P(t,RING,RING+2.5);road(t,{dim:.3+.12*ring,dir:-1});
  const flash=t>=HIT?Math.exp(-(t-HIT)/.18):0;
  pop(t,T5,s=>tx('오늘의 러닝',90,170,36,F.hd,C.amber));
  pop(t,T5+BPER/2,s=>{ctx.save();ctx.translate(90,282);ctx.scale(s,s);tx(RUN.title,0,0,108,F.hd,C.white);ctx.restore()});
  // 완주: a dark sign that lights up green on the end hit
  {const x=760,y=170,w=250,h=124;ctx.save();ctx.globalAlpha*=P(t,T5+BPER,T5+BPER+.3);ctx.fillStyle=hit>0?C.green:'#0D2216';if(hit>0){ctx.shadowColor=C.green;ctx.shadowBlur=30+40*flash}rr(x,y,w,h,12);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle=hit>0?'#E9FFF0':'rgba(53,196,106,.5)';ctx.lineWidth=4;rr(x+8,y+8,w-16,h-16,8);ctx.stroke();
    tx('완주',x+w/2-20,y+84,62,F.hd,hit>0?'#06140B':'rgba(53,196,106,.45)',{al:'center'});
    ctx.fillStyle=hit>0?'#06140B':'rgba(53,196,106,.45)';ctx.beginPath();ctx.moveTo(x+w-58,y+46);ctx.lineTo(x+w-30,y+62);ctx.lineTo(x+w-58,y+78);ctx.closePath();ctx.fill();ctx.restore()}
  runner(t,540,860,.9);
  const CR=[['총 거리',(TOTD/1000).toFixed(2),'km',C.amber],['달린시간',mmss(TT),'',C.blue],['평균페이스',pace(AVGP),'',C.teal],
    ['평균심박수',String(S.avgHR),'bpm',hrCol(S.avgHR)],['최대심박수',String(S.maxHR),'bpm',hrCol(S.maxHR)],['칼로리',String(S.kcal),'kcal',C.white]];
  pop(t,T5+BPER,s=>{ctx.fillStyle=C.panel;rr(60,880,960,290,18);ctx.fill()});
  CR.forEach(([l,v,u,c],i)=>{const t0=T5+BPER*(1.5+.5*i);const col=i%3,row=Math.floor(i/3);const cx=220+col*320,y=940+row*130;
    pop(t,t0,s=>{tx(l,cx,y,26,F.kr,C.dim,{al:'center',w:'700'});const vw=tw(v,64,F.num,'800'),uw=u?tw(u,22,F.kr,'700')+6:0;tx(v,cx-uw/2,y+70,64,F.num,c,{al:'center',w:'800'});if(u)tx(u,cx-uw/2+vw/2+6,y+68,22,F.kr,C.dim,{w:'700'})})});
  const mt=bar(12);const x=60,y=1210,w=960,h=520;
  pop(t,mt,s=>{ctx.fillStyle=C.panel;rr(x,y,w,h,18);ctx.fill();ctx.strokeStyle='rgba(255,164,58,.6)';ctx.lineWidth=2;rr(x,y,w,h,18);ctx.stroke();ctx.fillStyle=C.amber;ctx.fillRect(x+40,y+40,8,40);tx('러닝 메모',x+62,y+74,34,F.hd,C.white)},{from:.95});
  if(t>=mt){const MLN=MemoEmphasis.parse(RUN.review,RUN.reviewMarks);const mo=memoStyle();
    if(!ML){for(let px=50;px>=32;px-=2){mo.px=px;if(MLN.every(l=>MemoEmphasis.width(ctx,l,mo)<=w-110)){ML={px};break}}if(!ML)ML={px:32}}mo.px=ML.px;
    const lh=ML.px*1.6,top=y+100+(h-100-MLN.length*lh)/2+ML.px*.95;
    MLN.forEach((ln,i)=>{const t1=mt+BPER*(.5+i);if(t<t1)return;mo.k=eo3(P(t,t1+.35,t1+.8));const p=eo3(P(t,t1,t1+.3));
      ctx.save();ctx.globalAlpha*=p;ctx.translate(0,16*(1-p));MemoEmphasis.drawLine(ctx,ln,540,top+i*lh,mo);ctx.restore()})}
  if(flash>0){ctx.fillStyle=`rgba(255,246,230,${.1*flash})`;ctx.fillRect(0,0,W,H)}}

// ---------- timeline: scenes change on the bar; the old page rushes past the camera into the tunnel
const SCENES=[[0,sceneIntro],[T1,sceneCapture],[T2,sceneSplits],[T3,sceneWave],[T4,sceneZones],[T5,sceneEnd]];
const BUF=document.createElement('canvas');BUF.width=W;BUF.height=H;
function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';
  if(DR){const hero=t<T1||t>=T5;DR.draw(hero?riderState(t):bobbleState(t))}
  let k=0;SCENES.forEach(([s],i)=>{if(t>=s)k=i});const s0=SCENES[k][0];const tr=k>0?P(t,s0,s0+.32):1;
  if(tr<1){SCENES[k-1][1](Math.min(t,s0-.001));const b=BUF.getContext('2d');b.clearRect(0,0,W,H);b.drawImage(cv,0,0);SCENES[k][1](t);
    const e=eio3(tr),sc=1+.9*e;ctx.save();ctx.globalAlpha=1-e;ctx.translate(VP.x,VP.y);ctx.scale(sc,sc);ctx.translate(-VP.x,-VP.y);ctx.drawImage(BUF,0,0);ctx.restore()}
  else SCENES[k][1](t);
  const fi=1-P(t,0,.5);if(fi>0){ctx.fillStyle=`rgba(7,9,13,${fi})`;ctx.fillRect(0,0,W,H)}}
window.render=render;window.DUR=DUR;
(async()=>{await Promise.all([ROAD,COCK,...Object.values(IMG),...PHOTOS].map(im=>im.complete?0:new Promise(r=>{im.onload=r;im.onerror=r})));
  const fams=[[F.hd,''],[F.num,'600'],[F.num,'800'],[F.kr,'500'],[F.kr,'700'],[F.kr,'900'],[F.memo,'']];
  await Promise.all(fams.map(([f,w])=>document.fonts.load(`${w} 40px "${f}"`,'가나다ABC123')));await document.fonts.ready;
  GLC=document.createElement('canvas');DR=await Rider3D.init(GLC,{px:DPX});window.READY=true;
  const q=new URLSearchParams(location.search);if(q.has('t'))render(+q.get('t'));else{const s=performance.now();(function loop(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(loop)})()}})();
</script></body></html>

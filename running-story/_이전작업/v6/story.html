<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="data.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=30;
// ---------- editable record info (Garmin Connect title / memo are not stored in the FIT file)
const INFO={title:'조깅',memo:'ROR 정기런',date:'11월 24일 오후 8시 30분',kcal:368,avgHR:120,maxHR:129,
  review:'영하 2도의 찬 공기 속에서 크루와 천천히 달렸다 숨이 편안해서 다음 주에도 꾸준히 이어가고 싶다'};
const C={paper:'#E8E1D2',pencil:'#2E2C29',ink:'#3446C9',blue:'#1F37D6',white:'#F4F6FF',black:'#08090A',mint:'#3FE0B5',mintD:'#1F9E80',dim:'rgba(255,255,255,.55)'};
const ZC=['#5B6670','#8D97A3','#4AB3F4','#3DDC84','#F5A623','#F0524F'];
const F={wide:'Archivo Black',big:'Anton',kh:'Nanum Pen Script',kr:'Noto Sans KR',mono:'JetBrains Mono'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const OFF=document.createElement('canvas');OFF.width=W;OFF.height=H;const octx=OFF.getContext('2d');

// ---------- utils
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=t=>1-Math.pow(1-t,3),ei3=t=>t*t*t,ei2=t=>t*t;
const eio3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eo5=t=>1-Math.pow(1-t,5);
const eoBack=(t,s=1.7)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const font=(px,fam,w='')=>`${w} ${px}px "${fam}"`.trim();
const mmss=s=>{s=Math.round(s);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const pace=s=>{s=Math.round(s);return `${Math.floor(s/60)}'${String(s%60).padStart(2,'0')}"`};
const paceColon=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const zoneOf=h=>DATA.zones.filter(b=>h>=b).length;
let BOIL=0; // pencil boil seed (10 fps, 4 states)

// ---------- images
const IMG={};['wave','cheer','point','jump','front','fq','fql','run_sheet'].forEach(n=>{const im=new Image();im.src=`img/${n}.png`;IMG[n]=im});
function drawImg(n,cx,by,h,{rot=0,sx=1,sy=1,alpha=1,filter='none'}={}){const im=IMG[n];const w=im.width*h/im.height;
  ctx.save();ctx.globalAlpha*=alpha;ctx.filter=filter;ctx.translate(cx,by);ctx.rotate(rot);ctx.scale(sx,sy);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore()}
function egg(n,cx,lineY,h,t,tUp,tDown,{show=.6,flip=false,filter='none',wob=1}={}){
  const up=P(t,tUp,tUp+.3),dn=P(t,tDown,tDown+.22);if(up<=0||dn>=1)return;
  const off=h*(1-show)+(1-eoBack(up,2))*h*show*1.05+ei2(dn)*h*show*1.05;
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,lineY);ctx.clip();drawImg(n,cx,lineY+off,h,{rot:Math.sin((t-tUp)*5)*.05*wob,sx:flip?-1:1,filter});ctx.restore()}
function drawRun(cx,by,h,t,flip,filter='none'){const im=IMG.run_sheet;const cw=im.width/8,ch=im.height/6;const f=Math.floor((((t%0.8)+0.8)%0.8)*60)%48;
  const w=cw*h/ch;ctx.save();ctx.filter=filter;ctx.translate(cx,by);if(flip)ctx.scale(-1,1);ctx.drawImage(im,(f%8)*cw,Math.floor(f/8)*ch,cw,ch,-w/2,-h,w,h);ctx.restore()}
const SKETCH='grayscale(1) contrast(1.25) sepia(.25)';

// ---------- data
const R=DATA.route,TOTAL=R[R.length-1][2];
const bx=[Math.min(...R.map(p=>p[0])),Math.max(...R.map(p=>p[0]))],by=[Math.min(...R.map(p=>p[1])),Math.max(...R.map(p=>p[1]))];
const RH=by[1]-by[0],RWm=bx[1]-bx[0];
function routeXY(p,cx,top,h){const s=h/RH;return[cx-RWm*s/2+(p[0]-bx[0])*s,top+(p[1]-by[0])*s]}
function idxAtDist(d){let i=0;while(i<R.length-1&&R[i+1][2]<d)i++;return i}
function lerpPt(pts,i,f){const j=Math.min(i+1,pts.length-1);return[lerp(pts[i][0],pts[j][0],f),lerp(pts[i][1],pts[j][1],f)]}
function atDist(d){const i=idxAtDist(d);if(i>=R.length-1)return{i,f:0,t:R[i][3],hr:R[i][4],pc:R[i][5]};const a=R[i],b=R[i+1];const f=clamp((d-a[2])/((b[2]-a[2])||1));
  return{i,f,t:lerp(a[3],b[3],f),hr:Math.round(lerp(a[4],b[4],f)),pc:lerp(a[5],b[5],f)}}
const LAPS=DATA.laps.map(l=>l[1]/(l[0]/1000));
const TT=DATA.laps.reduce((a,l)=>a+l[1],0);
const AVGP=TT/(TOTAL/1000);
const HR=DATA.hr;
const HRMIN=(()=>{const o=[];for(let i=0;i<HR.length;i+=6){const s=HR.slice(i,i+6);o.push(s.reduce((a,b)=>a+b,0)/s.length)}return o})();
function resample(pts,N){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const T=L[L.length-1],o=[];let j=0;for(let k=0;k<N;k++){const d=T*k/(N-1);while(j<L.length-2&&L[j+1]<d)j++;const f=clamp((d-L[j])/((L[j+1]-L[j])||1));o.push([lerp(pts[j][0],pts[j+1][0],f),lerp(pts[j][1],pts[j+1][1],f)])}return o}

// ---------- backgrounds
const grain=document.createElement('canvas');grain.width=grain.height=256;
{const g=grain.getContext('2d'),im=g.createImageData(256,256);for(let i=0;i<256*256;i++){const v=rnd(i*.731)*255;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=16}g.putImageData(im,0,0)}
let grainPat=null;
function grid(col,step=60){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=W;x+=step){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}for(let y=0;y<=H;y+=step){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}ctx.stroke();ctx.restore()}
function bgPaper(){ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);grid('rgba(60,50,35,.07)');
  const g=ctx.createRadialGradient(W/2,H*.45,300,W/2,H*.45,1300);g.addColorStop(0,'rgba(255,255,255,.25)');g.addColorStop(1,'rgba(90,70,40,.18)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(!grainPat)grainPat=ctx.createPattern(grain,'repeat');ctx.fillStyle=grainPat;ctx.fillRect(0,0,W,H)}
function bgBlue(){ctx.fillStyle=C.blue;ctx.fillRect(0,0,W,H);grid('rgba(255,255,255,.07)');
  const g=ctx.createRadialGradient(W/2,H*.45,200,W/2,H*.45,1300);g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(1,'rgba(0,0,40,.28)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function bgBlack(){ctx.fillStyle=C.black;ctx.fillRect(0,0,W,H);grid('rgba(63,224,181,.05)');
  const g=ctx.createRadialGradient(W/2,H*.4,100,W/2,H*.4,1200);g.addColorStop(0,'rgba(63,224,181,.07)');g.addColorStop(1,'rgba(0,0,0,.4)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

// ---------- drawing primitives
function text(txt,x,y,px,fam,col,{align='left',alpha=1,w='',ls=0}={}){ctx.save();ctx.globalAlpha*=alpha;ctx.font=font(px,fam,w);ctx.fillStyle=col;ctx.textAlign=align;ctx.letterSpacing=ls+'px';ctx.fillText(txt,x,y);ctx.restore()}
function tw(txt,px,fam,w='',ls=0){ctx.save();ctx.font=font(px,fam,w);ctx.letterSpacing=ls+'px';const v=ctx.measureText(txt).width;ctx.restore();return v}
function typeOn(txt,x,y,px,fam,col,p,o={}){text(txt.slice(0,Math.ceil(txt.length*clamp(p))),x,y,px,fam,col,o)}
function mono(txt,x,y,col,{align='left',alpha=1,px=22}={}){text(txt,x,y,px,F.mono,col,{align,alpha,ls:3,w:'700'})}
function label(txt,x,y,col,{align='left',alpha=1,px=28,w='500'}={}){text(txt,x,y,px,F.kr,col,{align,alpha,w,ls:1})}
// pencil line: two jittered passes, boiling at 10fps
function pline(pts,p,col,w=2.4,{alpha=.9,jit=1.6,seed=0}={}){if(p<=0||pts.length<2)return;const n=(pts.length-1)*clamp(p),k=Math.floor(n);
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';
  for(let pass=0;pass<2;pass++){ctx.globalAlpha=alpha*(pass?.55:1);ctx.beginPath();
    for(let i=0;i<=k;i++){const q=pts[i];const jx=(rnd(i*3.7+seed+BOIL*11+pass*29)-.5)*jit*2,jy=(rnd(i*5.3+seed+BOIL*17+pass*31)-.5)*jit*2;i?ctx.lineTo(q[0]+jx,q[1]+jy):ctx.moveTo(q[0]+jx,q[1]+jy)}
    if(k<pts.length-1){const a=pts[k],b=pts[k+1],f=n-k;ctx.lineTo(lerp(a[0],b[0],f),lerp(a[1],b[1],f))}ctx.stroke()}ctx.restore()}
function seg(x0,y0,x1,y1,n=12){const o=[];for(let i=0;i<=n;i++)o.push([lerp(x0,x1,i/n),lerp(y0,y1,i/n)]);return o}
function rectPts(x,y,w,h){return[...seg(x,y,x+w,y),...seg(x+w,y,x+w,y+h).slice(1),...seg(x+w,y+h,x,y+h).slice(1),...seg(x,y+h,x,y).slice(1)]}
function line(x0,y0,x1,y1,col,w=2,p=1,dash=null){if(p<=0)return;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(lerp(x0,x1,p),lerp(y0,y1,p));ctx.stroke();ctx.restore()}
function sline(pts,p,col,w){if(p<=0||pts.length<2)return;const n=(pts.length-1)*clamp(p),k=Math.floor(n);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  for(let i=0;i<=k;i++)i?ctx.lineTo(...pts[i]):ctx.moveTo(...pts[i]);if(k<pts.length-1)ctx.lineTo(...lerpPt(pts,k,n-k));ctx.stroke();ctx.restore()}
// hatched (pencil-shaded) text: diagonal hatching masked to glyphs + jittered outline; p = reveal (left->right)
function hatchText(txt,x,y,px,fam,w,col,p,{align='left',ls=0,gap=7,ink=null,inkP=0}={}){if(p<=0)return;
  octx.setTransform(1,0,0,1,0,0);octx.clearRect(0,0,W,H);octx.font=font(px,fam,w);octx.letterSpacing=ls+'px';const tw0=octx.measureText(txt).width;const x0=align==='center'?x-tw0/2:align==='right'?x-tw0:x;
  octx.strokeStyle=col;octx.lineWidth=2.2;octx.globalAlpha=.85;octx.beginPath();for(let k=-px*2;k<tw0+px;k+=gap){octx.moveTo(x0+k,y+px*.3);octx.lineTo(x0+k+px*1.2,y-px*1.05)}octx.stroke();
  if(ink&&inkP>0){octx.strokeStyle=ink;octx.globalAlpha=.9;octx.lineWidth=2.6;octx.beginPath();for(let k=-px*2;k<(tw0+px)*inkP;k+=gap){octx.moveTo(x0+k+gap/2,y+px*.3);octx.lineTo(x0+k+gap/2-px*1.0,y-px*1.05)}octx.stroke()}
  octx.globalAlpha=1;octx.globalCompositeOperation='destination-in';octx.fillStyle='#000';octx.fillText(txt,x0,y);octx.globalCompositeOperation='source-over';
  octx.strokeStyle=col;octx.lineWidth=2.6;for(let pass=0;pass<2;pass++){octx.globalAlpha=pass?.5:.9;octx.save();octx.translate((rnd(BOIL*7+pass)-.5)*2.4,(rnd(BOIL*13+pass)-.5)*2.4);octx.strokeText(txt,x0,y);octx.restore()}
  ctx.save();ctx.beginPath();ctx.rect(x0-30,y-px*1.3,(tw0+60)*eio3(clamp(p)),px*1.8);ctx.clip();ctx.drawImage(OFF,0,0);ctx.restore()}
// dimension ruler (ticks + bracket)
function ruler(x0,x1,y,p,col,{ticks=40,label:lab=null}={}){if(p<=0)return;const e=eo3(p);pline(seg(x0,y,lerp(x0,x1,e),y,24),1,col,2);
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.6;ctx.globalAlpha=.8;ctx.beginPath();for(let i=0;i<=ticks;i++){const x=lerp(x0,x1,i/ticks);if(x>lerp(x0,x1,e))break;const h=i%5===0?14:7;ctx.moveTo(x,y);ctx.lineTo(x,y-h)}ctx.stroke();ctx.restore();
  if(lab&&p>=1)mono(lab,x1+14,y+8,col)}
function hud(t,fig,name,col){mono(`FIG ${String(fig).padStart(2,'0')} — ${name}`,70,250,col,{px:22});mono(`BEAT ${String(Math.min(60,Math.floor(t*2)+1)).padStart(2,'0')} / 60`,1010,1640,col,{align:'right',px:22})}
function cursor(x,y,press=0){ctx.save();ctx.translate(x,y);const s=1-press*.12;ctx.scale(s,s);ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=2.5;ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(0,40);ctx.lineTo(10,31);ctx.lineTo(17,47);ctx.lineTo(24,44);ctx.lineTo(17,28);ctx.lineTo(29,28);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
  if(press>0){ctx.save();ctx.strokeStyle='rgba(255,255,255,'+(1-press)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,10+press*40,0,7);ctx.stroke();ctx.restore()}}
// simple 3D
function proj(x,y,z,yaw,pitch,cx,cy,f=900){const cy_=Math.cos(yaw),sy_=Math.sin(yaw);let X=x*cy_+z*sy_,Z=-x*sy_+z*cy_;const cp=Math.cos(pitch),sp=Math.sin(pitch);let Y=y*cp-Z*sp;Z=y*sp+Z*cp;const k=f/(f+Z);return[cx+X*k,cy-Y*k,Z]}

// =============== ACT 1 : paper draft
const RULE_Y=560;
function fig01(t){ // 0 - 1.5
  const a=1;
  pline(seg(80,RULE_Y,1000,RULE_Y,30),eo3(P(t,0,.4)),C.pencil,2.6,{seed:1});
  typeOn(INFO.date,80,RULE_Y-26,30,F.kr,C.pencil,P(t,.15,.5),{w:'500',ls:2});
  hatchText(INFO.title,540,900,300,F.kr,'900',C.pencil,P(t,.1,.75),{align:'center',ls:12,ink:C.ink,inkP:eo3(P(t,.85,1.3))});
  label(INFO.memo,540,1000,C.pencil,{align:'center',alpha:P(t,.6,.9),px:44});
  ruler(170,910,1060,P(t,.7,1.1),C.pencil,{ticks:48});
  // mascot (pencil sketch) dropped onto the rule
  if(t>.3){const p=P(t,.3,.62);const y=p<1?lerp(260,RULE_Y,ei2(p)):RULE_Y;const sq=t>.62&&t<.85?Math.sin(P(t,.62,.85)*Math.PI)*.12:0;drawImg('front',880,y,120,{sx:1+sq,sy:1-sq,filter:SKETCH})}
}
const CELLS=[['평균 심박수',()=>String(INFO.avgHR),'bpm'],['평균 페이스',()=>paceColon(AVGP),'/km'],['총 시간',()=>mmss(TT),''],['총 칼로리',()=>String(INFO.kcal),'']];
function fig02(t){ // 1.5 - 4.0
  ruler(90,990,470,P(t,1.5,1.8),C.pencil,{ticks:60});
  hatchText((TOTAL/1000).toFixed(2),90,760,270,F.wide,'',C.pencil,P(t,1.55,1.95),{ls:4,ink:C.ink,inkP:eo3(P(t,2.0,2.6))});
  text('km',100+tw((TOTAL/1000).toFixed(2),270,F.wide,'',4),760,80,F.wide,C.pencil,{alpha:P(t,1.85,2.0)});
  label('거리',90,820,C.pencil,{alpha:P(t,1.8,2.0),px:34});
  // dimension bracket for the distance number
  const dp=P(t,1.9,2.2);if(dp>0){pline(seg(1000,500,1000,lerp(500,760,eo3(dp)),10),1,C.ink,2);if(dp>=1){mono('5560 m',990,640,C.ink,{align:'right'})}}
  CELLS.forEach((c,i)=>{const t0=2.0+i*.5;const p=P(t,t0,t0+.35);if(p<=0)return;const x=90+(i%2)*460,y=880+Math.floor(i/2)*220;
    pline(rectPts(x,y,440,200),eo3(p),C.pencil,2.2,{seed:i*9});
    label(c[0],x+26,y+56,C.pencil,{alpha:P(t,t0+.1,t0+.3),px:30});
    const v=c[1]();text(v,x+26,y+160,84,F.wide,C.pencil,{alpha:P(t,t0+.15,t0+.35)});if(c[2])text(c[2],x+36+tw(v,84,F.wide),y+160,34,F.kr,C.pencil,{alpha:P(t,t0+.2,t0+.35),w:'700'})});
  egg('fq',1010,880,130,t,3.55,3.9,{show:.5,filter:SKETCH});
}
// route geometry used by fig03/fig04 morphs
const N=220;
const ROUTE_PTS=R.map(p=>routeXY(p,540,380,820));
const ROUTE_RS=resample(ROUTE_PTS,N);
const LINE_RS=seg(90,RULE_Y,990,RULE_Y,N-1);
const SP_AX={x0:150,x1:930,y0:1150,y1:600};
const spY=s=>lerp(SP_AX.y0-60,SP_AX.y1+60,(450-s)/(450-360));
const SPLIT_PTS=(()=>{const pts=LAPS.map((s,i)=>[230+i*135,spY(s)]);const full=[[SP_AX.x0,pts[0][1]],...pts,[SP_AX.x1,pts[pts.length-1][1]]];const o=[];
  for(let i=0;i<full.length-1;i++)for(let k=0;k<12;k++){const f=k/12;o.push([lerp(full[i][0],full[i+1][0],f),lerp(full[i][1],full[i+1][1],eio3(f))])}o.push(full[full.length-1]);return o})();
const SPLIT_RS=resample(SPLIT_PTS,N);
const RT0=4.45,RT1=6.0;const routeF=t=>eio3(P(t,RT0,RT1));
function fig03(t){ // 4.0 - 6.5
  const m=eio3(P(t,4.0,4.45));
  if(t<4.45){pline(LINE_RS.map((q,i)=>[lerp(q[0],ROUTE_RS[i][0],m),lerp(q[1],ROUTE_RS[i][1],m)]),1,C.pencil,2.6,{jit:1.2});return}
  pline(ROUTE_RS,1,C.pencil,2.2,{jit:1.2,alpha:.6});
  const f=routeF(t);const d=f*TOTAL;const c=atDist(d);
  if(f>0){const pts=ROUTE_PTS.slice(0,c.i+1).concat([lerpPt(ROUTE_PTS,c.i,c.f)]);sline(pts,1,'rgba(52,70,201,.25)',16);sline(pts,1,C.ink,6)}
  [1000,2000,3000,4000,5000].forEach((dk,i)=>{if(d<dk)return;const cc=atDist(dk);const [x,y]=lerpPt(ROUTE_PTS,cc.i,cc.f);const side=(i===3?-1:1)*(x>540?1:-1);
    pline(seg(x-12,y,x+12,y,4),1,C.pencil,3);mono(`${i+1}K ${pace(LAPS[i])}`,x+side*28,y+8,C.pencil,{align:side>0?'left':'right',px:20})});
  const st=ROUTE_PTS[0];
  if(t<RT1+.05){const [x,y]=f>0?lerpPt(ROUTE_PTS,c.i,c.f):st;const ahead=lerpPt(ROUTE_PTS,Math.min(c.i+3,ROUTE_PTS.length-1),0);drawRun(x,y+4,74,t,ahead[0]>x+.5)}
  if(t>RT1){const p=P(t,RT1,RT1+.35);const ring=[];for(let i=0;i<=48;i++){const an=-1.3+i/48*Math.PI*2.1;ring.push([st[0]+Math.cos(an)*70,st[1]+Math.sin(an)*70])}pline(ring,eo3(p),C.ink,3);
    mono('한 바퀴 5560 m',st[0]+90,st[1]+60,C.ink,{alpha:P(t,RT1+.2,RT1+.4),px:22});egg('cheer',st[0]-92,st[1]+6,104,t,RT1+.05,6.5,{show:1,wob:.6})}
  // live data

  label(BOXES[k][2],cx,cy+bh/2+64,'rgba(63,224,181,.85)',{align:'center',px:36,w:'700'});
  mono('4 / 4'.replace('4 ',String(k+1)+' '),cx,cy-bh/2-30,'rgba(63,224,181,.6)',{align:'center',px:20});
  egg('point',Math.min(1000,cx+bw/2+70),cy+bh/2,150,t,18.6,19.9,{show:.85,flip:true,wob:.4});
}
// =============== FIG 10 : finish card + 10 s loop (20 - 30)
const LT0=20.0,LP=2.5;
const RING=`${INFO.title}   ${(TOTAL/1000).toFixed(2)}KM   ${mmss(TT)}   ${pace(AVGP)}   ${INFO.avgHR}BPM   `;
function wrapLines(txt,px,fam,w,maxW){ctx.save();ctx.font=font(px,fam,w);const words=txt.split(/\s+/);const lines=[];let cur='';for(const wd of words){const tl=cur?cur+' '+wd:wd;if(ctx.measureText(tl).width<=maxW||!cur)cur=tl;else{lines.push(cur);cur=wd}}if(cur)lines.push(cur);ctx.restore();return lines}
const MEMO=(()=>{const box={x:110,y:1395,w:860,h:210};for(let px=46;px>=26;px-=2){const lh=px*1.45;const lines=wrapLines(INFO.review,px,F.kr,'500',box.w);if(lines.length*lh<=box.h)return{px,lh,lines,box}}const px=26,lh=px*1.45;return{px,lh,lines:wrapLines(INFO.review,px,F.kr,'500',box.w).slice(0,Math.floor(210/lh)),box}})();
function fig10(t){
  const ph=((t-LT0)/LP)%1;const cx=540,cy=560,r=150;const yaw=(t-LT0)/(LP*2)*Math.PI*2;const tilt=.35;
  const sp=eo3(P(t,20.0,20.6));
  // ring text (back half)
  const chars=[...RING];const n=chars.length;const rx=330,ry=105;const ringRot=(t-LT0)/(LP*2)*Math.PI*2;
  const drawRing=(front)=>{chars.forEach((ch,i)=>{const an=ringRot-i/n*Math.PI*2;const z=Math.sin(an);if((z>0)!==front)return;const x=cx+Math.cos(an)*rx*sp,y=cy+40+z*ry*sp;
    ctx.save();ctx.globalAlpha=(front?1:.18)*sp;ctx.translate(x,y);ctx.rotate(.18*Math.cos(an));ctx.font=font(34,/[가-힣]/.test(ch)?F.kr:F.wide,'900');ctx.fillStyle=C.mint;ctx.textAlign='center';ctx.fillText(ch,0,0);ctx.restore()})};
  drawRing(false);
  // wireframe globe
  ctx.save();ctx.globalAlpha=sp;ctx.strokeStyle=C.mint;ctx.lineWidth=1.6;
  for(let la=-60;la<=60;la+=30){const pts=[];for(let k=0;k<=48;k++){const lo=k/48*Math.PI*2;const rr=Math.cos(la*Math.PI/180)*r;pts.push(proj(Math.cos(lo)*rr,Math.sin(la*Math.PI/180)*r,Math.sin(lo)*rr,yaw,tilt,cx,cy))}ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}
  for(let k=0;k<12;k++){const lo=k/12*Math.PI;const pts=[];for(let j=0;j<=48;j++){const a=j/48*Math.PI*2;pts.push(proj(Math.cos(a)*r*Math.cos(lo),Math.sin(a)*r,Math.cos(a)*r*Math.sin(lo),yaw,tilt,cx,cy))}ctx.globalAlpha=sp*.7;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke()}
  ctx.restore();
  // mascot cheering on top of the globe (hops every 2 beats)
  if(t>20.4){const hop=Math.abs(Math.sin(((t-LT0)/1)*Math.PI))*22;const p=eoBack(P(t,20.4,20.7),2);drawImg('cheer',cx,cy-r*.98-hop,96*p,{rot:Math.sin((t-LT0)*Math.PI)*.05})}
  drawRing(true);
  // title + meta
  const tp=P(t,20.5,20.85);
  ctx.save();ctx.globalAlpha=clamp(tp*3);ctx.translate(90,920);const s=lerp(1.6,1,eoBack(tp,1.5));ctx.scale(s,s);text(INFO.title,0,0,150,F.kr,C.mint,{w:'900'});ctx.restore();
  text(INFO.memo,95+tw(INFO.title,150,F.kr,'900')+30,880,40,F.kr,C.white,{w:'700',alpha:P(t,20.7,20.9)});
  mono(INFO.date,95+tw(INFO.title,150,F.kr,'900')+30,920,'rgba(63,224,181,.7)',{px:20,alpha:P(t,20.75,20.95)});
  line(90,960,990,960,C.mint,2,eo3(P(t,20.6,20.9)));
  const ST=[['총 거리',(TOTAL/1000).toFixed(2),'km'],['달린시간',mmss(TT),''],['평균페이스',pace(AVGP),'/km'],['평균심박수',String(INFO.avgHR),'bpm'],['최대심박수',String(INFO.maxHR),'bpm'],['칼로리',String(INFO.kcal),'kcal']];
  ST.forEach((s,i)=>{const c=i%3,rw=Math.floor(i/3);const x=90+c*310,y=990+rw*150;const p=P(t,20.75+i*.06,21.05+i*.06);if(p<=0)return;
    ctx.save();ctx.globalAlpha=p;ctx.translate(0,(1-eo3(p))*30);label(s[0],x,y+40,'rgba(255,255,255,.6)',{px:24});text(s[1],x,y+112,64,F.wide,C.white);if(s[2])text(s[2],x+tw(s[1],64,F.wide)+8,y+112,22,F.kr,C.mint,{w:'700'});ctx.restore()});
  line(90,1300,990,1300,'rgba(63,224,181,.35)',1.5,eo3(P(t,21.0,21.3)));
  // memo box
  const M=MEMO;const mp=P(t,21.1,21.35);ctx.save();ctx.globalAlpha=mp;ctx.strokeStyle=C.mint;ctx.lineWidth=2;ctx.strokeRect(90,1320,900,300);ctx.restore();
  label('러닝 메모',M.box.x,1365,C.mint,{px:24,w:'700',alpha:mp});mono('GARMIN CONNECT',970,1362,'rgba(63,224,181,.6)',{align:'right',px:16,alpha:mp});
  const total=M.lines.reduce((a,l)=>a+l.length,0);const dur=clamp(total*.03,.8,2.0);let acc=0;let cursorAt=null;
  M.lines.forEach((ln,i)=>{const t0=21.3+dur*acc/total,t1=21.3+dur*(acc+ln.length)/total;acc+=ln.length;const p=P(t,t0,t1);if(p<=0)return;const s=ln.slice(0,Math.ceil(ln.length*p));
    text(s,M.box.x,M.box.y+i*M.lh+M.px*.4,M.px,F.kr,C.white,{w:'500'});cursorAt=[M.box.x+tw(s,M.px,F.kr,'500')+6,M.box.y+i*M.lh+M.px*.4]});
  if(cursorAt&&Math.floor(t*2)%2===0){ctx.fillStyle=C.mint;ctx.fillRect(cursorAt[0],cursorAt[1]-M.px*.85,M.px*.5,M.px)}
}

// =============== master
function render(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.clearRect(0,0,W,H);BOIL=Math.floor(t*10)%4;
  if(t<9.0){bgPaper();
    if(t<1.5){fig01(t);hud(t,1,'기록',C.pencil)}
    else if(t<4.0){fig02(t);hud(t,2,'기록',C.pencil)}
    else if(t<6.5){fig03(t);hud(t,3,'코스',C.pencil)}
    else{fig04(t);hud(t,4,'구간',C.pencil)}
    if(t>8.45){const p=ei3(P(t,8.45,9.0));ctx.save();ctx.beginPath();ctx.arc(540,880,10+p*1500,0,7);ctx.clip();bgBlue();ctx.restore()}
  } else if(t<16.1){bgBlue();
    if(t<10.0){fig05(t);hud(t,5,'패널',C.white)}
    else{dashboard(t);hud(t,t<13?6:7,t<13?'데이터':'존',C.white);
      // cursor: -> 심박 tab (click 11.6) -> toggle (click 15.62)
      let cx,cy,pr=0;if(t<11.6){const p=eio3(P(t,11.0,11.55));cx=lerp(1100,815,p);cy=lerp(1300,PANEL.y+40,p)}else if(t<15.0){cx=815;cy=PANEL.y+40;const p=eio3(P(t,12.0,12.6));cx=lerp(815,1120,p);cy=lerp(PANEL.y+40,800,p)}
      else{const p=eio3(P(t,15.0,15.55));cx=lerp(1120,948,p);cy=lerp(800,PANEL.y+40,p)}
      pr=Math.max(P(t,11.6,11.9)*(t<11.9?1:0),P(t,15.62,15.92)*(t<15.92?1:0));if(cx<1090)cursor(cx,cy,pr)}
    if(t>15.65){const p=ei3(P(t,15.65,16.1));ctx.save();ctx.beginPath();ctx.arc(948,PANEL.y+36,10+p*2200,0,7);ctx.clip();bgBlack();ctx.restore()}
  } else {bgBlack();
    if(t<18.0){fig08(t);hud(t,8,'입체',C.mint)}
    else if(t<20.0){fig09(t);hud(t,9,'숫자',C.mint)}
    else{fig10(t);hud(t,10,'완주',C.mint)}
  }
}
window.render=render;window.DUR=DUR;
async function ready(){await Promise.all(Object.values(IMG).map(im=>im.decode()));
  const fams=[[F.wide,''],[F.big,''],[F.kh,''],[F.kr,'900'],[F.kr,'700'],[F.kr,'500'],[F.mono,'700']];
  await Promise.all(fams.map(([f,w])=>document.fonts.load(`${w} 40px "${f}"`,'가나다ABC123')));await document.fonts.ready;window.READY=true;
  const q=new URLSearchParams(location.search);if(q.has('t'))render(+q.get('t'));else{const s=performance.now();(function loop(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(loop)})()}}
ready();

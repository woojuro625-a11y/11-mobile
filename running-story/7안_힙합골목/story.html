</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=30;
// ---------- per-run text (title / memo are not in the FIT file)
const RUN={title:'회복조깅',memo:'10km 뛰려다가 8km까지만',
  review:'10km 뛰려다가 8km까지만\n아직도 근육통이 심하다\n따뜻하게 입어서 그런지 다리가 힘들어서 그런지\n심박수가 급상승 해버렸다\n내일은 하루 더 쉬고 토요일 오전에 뛰어야지',   // keep the memo's own line breaks (\n)
  reviewMarks:'[[10km]] 뛰려다가 [[8km]]까지만\n아직도 [[근육통|body]]이 심하다\n따뜻하게 입어서 그런지 [[다리가 힘들어서|body]] 그런지\n[[심박수가 급상승|body]] 해버렸다\n내일은 [[하루 더 쉬고|plan]] [[토요일 오전|plan]]에 뛰어야지',
  photos:['img/photo1.jpg','img/photo2.jpg'],photoCaps:['11월 26일 밤','오후 7시 24분']};
// ---------- look: a hip-hop back alley at night (brick wall, graffiti blobs, fire escapes, a street lamp, a boombox on the ground)
const C={bg:'#1A1210',bg2:'#241815',cream:'#F6F1E7',dim:'rgba(246,241,231,.66)',faint:'rgba(246,241,231,.14)',amber:'#FFC93C',green:'#4FD18B',red:'#E8433A',blue:'#5BB8FF',pink:'#FF5FA2',wood:'#2B2B30'};
const ZC=['#9AA3AD','#C9D0D8','#4AB3F4','#3DDC84','#F5A623','#F0524F'];        // zone colours (존 미만 1 2 3 4 5) on dark
const hrCol=h=>ZC[DATA.zones.filter(b=>h>=b).length];
const F={slab:'Anton',kd:'Do Hyeon',hd:'Gothic A1',kr:'Noto Sans KR',pen:'Do Hyeon',tag:'Do Hyeon'};   // street poster type: Gasoek One (heavy titles, graffiti-treated), Anton (numbers), Do Hyeon (subtitles, memo), Noto Sans KR (small labels)
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---------- utils
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=t=>1-Math.pow(1-t,3),eio3=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mmss=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const pace=s=>{s=Math.round(s);return `${Math.floor(s/60)}'${String(s%60).padStart(2,'0')}"`};
const dsec=s=>{s=Math.round(s);return s>=60?`${Math.floor(s/60)}분 ${s%60}초`:`${s}초`};
function tx(s,x,y,px,fam,col,{w='',al='left',a=1,ls=0,maxW=0}={}){
  ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.textAlign=al;ctx.textBaseline='alphabetic';ctx.letterSpacing=ls+'px';ctx.fillStyle=col;
  const m=ctx.measureText(s).width;ctx.translate(x,y);if(maxW&&m>maxW)ctx.scale(maxW/m,1);ctx.fillText(s,0,0);ctx.restore()}
function tw(s,px,fam,w='',ls=0){ctx.save();ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

// ---------- the song: dub reggae ~92 BPM, one-drop kick on beat 3, skank chords on the offbeat, tape echo at 8th notes; from the start, then its own echo-out ending
const BT=BEATS.map(b=>b[0]),DB=BEATS.filter(b=>b[1]).map(b=>b[0]);
const BPER=(()=>{const d=BT.slice(1).map((b,i)=>b-BT[i]).sort((a,b)=>a-b);return d[Math.floor(d.length/2)]})();
const ECHO=BPER/2;                                                              // the song's delay time (8th note)
const lastOf=(arr,t)=>{let r=-1e9;for(const x of arr){if(x<=t)r=x;else break}return r};
const KK=DRUMS.beats.filter(b=>b[1]>.45).map(b=>b[0]);
const kickP=(t,k=.1)=>{const b=lastOf(KK,t);return t-b<1?Math.exp(-(t-b)/k):0};
const OFF=BT.map(b=>b+BPER/2);const offP=(t,k=.07)=>{const b=lastOf(OFF,t);return t-b<1?Math.exp(-(t-b)/k):0};   // the skank on the "and"
const fr=t=>Math.max(0,Math.min(1799,Math.floor(t*60)));const bassAt=t=>BASS[fr(t)],loudAt=t=>LOUD[fr(t)];
const nearDB=x=>DB.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a,DB[0]);
const beatsFrom=(t0,n)=>{const i=BT.findIndex(b=>b>=t0-.02);return BT.slice(i,i+n)};
const I1=BT.indexOf(nearDB(5.46));const T1=BT[I1],T2=BT[I1+4],T3=BT[I1+9],T4=BT[I1+16],T5=BT[I1+20];   // ending from 18.46 s so the whole page is up by 22 s and holds   // capture 5 beats, splits 6, pace graph 8 (time to read the sprint card), zones 5
const LASTBEAT=28.0-BPER;   // the 1 s fade-out: he relaxes and waves

// ---------- pop-in: whatever appears at t0 slides up a little and fades in (no after-images)
function echo(t,t0,draw){if(t<t0)return;const p=eo3(P(t,t0,t0+.22));ctx.save();ctx.globalAlpha*=p;ctx.translate(0,18*(1-p));draw(p);ctx.restore()}

// ---------- graffiti lettering (cached per text): overspray halo, 3D block extrude, white then black outline, two-tone fill with a shine stroke, spray speckle and drips
const GCACHE={};
function graf(s,px,{fill=['#FFE14A','#FF7A1A'],out='#0E0E10',edge='#F6F1E7',glow='255,95,162',ext=Math.round(px*.09),drips=3,seed=1}={}){
  const key=[s,px,fill,glow,ext,drips,seed].join('|');if(GCACHE[key])return GCACHE[key];
  const c=document.createElement('canvas');const g=c.getContext('2d');g.font=`900 ${px}px "${F.hd}"`;const w=Math.ceil(g.measureText(s).width);
  const pad=Math.round(px*.55);c.width=w+pad*2+ext;c.height=Math.round(px*1.9)+pad;const g2=c.getContext('2d');g2.font=`900 ${px}px "${F.hd}"`;g2.textBaseline='alphabetic';g2.lineJoin='round';
  const X=pad,Y=Math.round(pad*.6+px);
  g2.save();g2.shadowColor=`rgba(${glow},.75)`;g2.shadowBlur=px*.45;g2.fillStyle=`rgba(${glow},.55)`;g2.fillText(s,X,Y);g2.restore();            // overspray
  for(let k=ext;k>=1;k--){g2.lineWidth=px*.09;g2.strokeStyle=out;g2.strokeText(s,X+k,Y+k);g2.fillStyle=out;g2.fillText(s,X+k,Y+k)}              // 3D block
  g2.lineWidth=px*.085;g2.strokeStyle=edge;g2.strokeText(s,X,Y);g2.lineWidth=px*.035;g2.strokeStyle=out;g2.strokeText(s,X,Y);
  const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const fg=f.getContext('2d');fg.font=g2.font;fg.textBaseline='alphabetic';
  const gr=fg.createLinearGradient(0,Y-px*.85,0,Y);gr.addColorStop(0,fill[0]);gr.addColorStop(.55,fill[0]);gr.addColorStop(.56,fill[1]);gr.addColorStop(1,fill[1]);fg.fillStyle=gr;fg.fillText(s,X,Y);
  fg.globalCompositeOperation='source-atop';fg.strokeStyle='rgba(255,255,255,.75)';fg.lineWidth=px*.06;fg.lineCap='round';
  for(let i=0;i<Math.max(2,s.length);i++){const x0=X+rnd(seed*7+i)*w;fg.beginPath();fg.moveTo(x0,Y-px*.78);fg.lineTo(x0+px*.12,Y-px*.62);fg.stroke()}              // shine ticks
  for(let i=0;i<w*1.2;i++){fg.fillStyle=rnd(seed*13+i)>.5?'rgba(0,0,0,.16)':'rgba(255,255,255,.14)';fg.fillRect(X+rnd(seed*3+i*1.7)*w,Y-px+rnd(seed*5+i*2.3)*px,2,2)}  // spray speckle
  g2.drawImage(f,0,0);
  for(let i=0;i<drips;i++){const dx=X+w*(.15+.7*rnd(seed*11+i)),len=px*(.16+.26*rnd(seed*17+i)),dw=Math.max(4,px*.06);                           // drips
    g2.fillStyle=out;g2.beginPath();g2.roundRect(dx-dw/2-3,Y-px*.1,dw+6,len+6,dw);g2.fill();g2.fillStyle=fill[1];g2.beginPath();g2.roundRect(dx-dw/2,Y-px*.08,dw,len,dw/2);g2.fill();
    g2.beginPath();g2.arc(dx,Y-px*.08+len,dw*.75,0,7);g2.fill()}
  return GCACHE[key]={c,X,Y,w}}
function gtx(s,x,y,px,o={}){const G=graf(s,px,o);const al=o.al||'left';const ox=al==='center'?G.w/2:al==='right'?G.w:0;ctx.save();ctx.globalAlpha*=(o.a??1);ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.drawImage(G.c,-G.X-ox,-G.Y);ctx.restore()}
// a spray-painted bar: soft overspray, slightly rough top and bottom edges, one drip
function sprayBar(x,y,w,h,col,seed=1,drip=true){if(w<=1)return;ctx.save();ctx.shadowColor=col;ctx.shadowBlur=18;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x+h*.3,y);
  for(let i=0;i<=12;i++){const u=i/12;ctx.lineTo(x+h*.3+(w-h*.6)*u,y+(rnd(seed*31+i)-.5)*5)}ctx.quadraticCurveTo(x+w+h*.1,y+h/2,x+w-h*.3,y+h);
  for(let i=12;i>=0;i--){const u=i/12;ctx.lineTo(x+h*.3+(w-h*.6)*u,y+h+(rnd(seed*37+i)-.5)*5)}ctx.quadraticCurveTo(x-h*.1,y+h/2,x+h*.3,y);ctx.fill();ctx.shadowBlur=0;
  if(drip){const dx=x+w*(.3+.5*rnd(seed*41)),dl=10+28*rnd(seed*43);ctx.beginPath();ctx.roundRect(dx-3,y+h-4,6,dl,3);ctx.fill();ctx.beginPath();ctx.arc(dx,y+h-4+dl,4.5,0,7);ctx.fill()}
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x+h*.4,y+h*.18,Math.max(0,w-h*.9),3);ctx.restore()}

// ---------- images
const IMG={};['garmin'].forEach(n=>{const im=new Image();im.src=`img/${n}.png`;IMG[n]=im});
const PHOTOS=RUN.photos.map(src=>{const im=new Image();im.src=src;return im});

// ---------- data
const S=DATA.session,TOTD=S.dist,TT=S.time;
const LAPS=DATA.laps.map(l=>l[1]/(l[0]/1000)),LAPD=DATA.laps.map(l=>l[0]),NL=LAPS.length;
const LAPR=LAPS.map(s=>Math.round(s));
const FAST=LAPR.indexOf(Math.min(...LAPR)),SLOW=LAPR.indexOf(Math.max(...LAPR));
const lapLabel=i=>LAPD[i]>=990?`${i+1}km`:`${(LAPD.slice(0,i+1).reduce((a,b)=>a+b,0)/1000).toFixed(2)}km`;
const MAXP=(DATA.maxPace&&DATA.maxPace.sec)||Math.min(...LAPS),MAXD=(DATA.maxPace&&DATA.maxPace.dist)||TOTD;
const PSER=DATA.paceSeries||[];const PSORT=PSER.map(x=>x[1]).sort((a,b)=>a-b);const P98=PSORT.length?PSORT[Math.floor(PSORT.length*.98)]:Math.max(...LAPS);
const PLO=Math.floor((Math.min(MAXP,PSORT[0]||MAXP,...LAPS)-8)/10)*10,PHI=Math.ceil((Math.max(P98,...LAPS)+10)/10)*10;
const AVGP=TT/(TOTD/1000);
const SPLIT_LINE=(()=>{const sp=Math.max(...LAPR)-Math.min(...LAPR);const last=LAPR[NL-1],first=LAPR[0];
  if(sp<=20)return'흔들림 없이 같은 리듬으로';if(last===Math.min(...LAPR)&&first>=Math.max(...LAPR)-5)return'갈수록 빨라지고 마지막은 스퍼트';
  if(last===Math.min(...LAPR))return'마지막 1km는 스퍼트';return'구간마다 리듬을 바꿔 가며'})();
const ZS=DATA.zoneSec,ZTOT=ZS.reduce((a,b)=>a+b,0),ZMAX=Math.max(...ZS);const ZTOP=ZS.slice(1).indexOf(Math.max(...ZS.slice(1)))+1;
const ZONE_LINE=`가장 오래 머문 구간은 ${ZTOP}존 ${Math.round(ZS[ZTOP]/ZTOT*100)}%`;
const zRange=i=>i===0?`${DATA.zones[0]-1} 이하`:i<5?`${DATA.zones[i-1]}~${DATA.zones[i]-1}`:`${DATA.zones[4]} 이상`;
const BRK=DATA.breaks||[];
const BREAK_LINE=BRK.length?`중간에 ${BRK.length}번 멈춤 ${dsec(BRK.reduce((a,b)=>a+b.dur,0))}`:'중간 멈춤 없이 연속 달리기';
const SK=Math.min(NL-1,Math.floor(MAXD/1000));
const SPRINT_T=SK===NL-1&&LAPR[NL-1]===Math.min(...LAPR)?'마지막 1km 스퍼트':SK===NL-1?'마지막 1km 가장 빠른 순간':`${SK+1}km 구간 가장 빠른 순간`;

// ---------- backdrop: a cinematic photo of a back alley at night (wet asphalt, graffiti, fire escapes, steam), slowly pushing in;
// the street lamp breathes a little with the kick, steam drifts from the manhole, film grain; data scenes use a blurred darker copy (depth of field)
const BGI={sharp:new Image(),blur:new Image()};BGI.sharp.src='img/alley.jpg';BGI.blur.src='img/alley_blur.jpg';
const GRAIN=document.createElement('canvas');GRAIN.width=540;GRAIN.height=960;
function buildWall(){const g=GRAIN.getContext('2d');const id=g.createImageData(540,960);for(let i=0;i<id.data.length;i+=4){const v=128+(rnd(i*.37)-.5)*120;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0)}
function bg(t,{dim=0}={}){const im=dim>0?BGI.blur:BGI.sharp;const s=1+.045*t/30;const fx=540,fy=860;
  ctx.save();ctx.translate(fx,fy);ctx.scale(s,s);ctx.drawImage(im,-fx-54,-fy-96,1188,2112);ctx.restore();
  const lx=640,ly=228,k=.16+.1*kickP(t,.18)*Math.min(1,loudAt(t)*3)+.03*Math.sin(t*23)*Math.sin(t*3.1);
  const g=ctx.createRadialGradient(lx,ly,0,lx,ly,420);g.addColorStop(0,`rgba(255,190,110,${k})`);g.addColorStop(1,'rgba(255,190,110,0)');ctx.fillStyle=g;ctx.fillRect(lx-420,ly-420,840,840);
  for(let i=0;i<14;i++){const life=((t*.22+i/14)%1),x=520+Math.sin(i*2.1+t*.4)*40+life*60*(rnd(i)-.3),y=1000-life*520,r=60+life*170;   // steam
    const a=(dim>0?.04:.075)*Math.sin(Math.PI*life);const sg=ctx.createRadialGradient(x,y,0,x,y,r);sg.addColorStop(0,`rgba(235,235,240,${a})`);sg.addColorStop(1,'rgba(235,235,240,0)');ctx.fillStyle=sg;ctx.fillRect(x-r,y-r,r*2,r*2)}
  if(dim>0){ctx.fillStyle=`rgba(8,8,10,${dim*.55})`;ctx.fillRect(0,0,W,H)}
  else{const sc=ctx.createLinearGradient(0,0,0,640);sc.addColorStop(0,'rgba(6,6,8,.72)');sc.addColorStop(1,'rgba(6,6,8,0)');ctx.fillStyle=sc;ctx.fillRect(0,0,W,640)}   // a soft scrim so the titles read over the lamp
  const v=ctx.createRadialGradient(540,900,500,540,960,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.07;ctx.globalCompositeOperation='overlay';ctx.drawImage(GRAIN,-Math.floor(rnd(Math.floor(t*30))*200),-Math.floor(rnd(Math.floor(t*30)+7)*300),1080+200,1920+300);ctx.restore()}
function boombox(x,y,w,t){const h=w*.56,k=kickP(t,.12)*Math.min(1,loudAt(t)*3+.2);
  ctx.save();ctx.strokeStyle='#C9CCD2';ctx.lineWidth=w*.03;ctx.beginPath();ctx.moveTo(x+w*.22,y);ctx.lineTo(x+w*.22,y-h*.22);ctx.lineTo(x+w*.78,y-h*.22);ctx.lineTo(x+w*.78,y);ctx.stroke();
  ctx.fillStyle='#2E3138';rr(x,y,w,h,w*.06);ctx.fill();ctx.fillStyle='#41454E';rr(x+w*.03,y+h*.05,w*.94,h*.16,w*.03);ctx.fill();
  [[.2,.6],[.8,.6]].forEach(([u,v])=>{const cx=x+w*u,cy=y+h*v,r=h*.32;ctx.fillStyle='#16171B';ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
    const rr_=r*(.8+.1*k);ctx.fillStyle='#24262C';ctx.beginPath();ctx.arc(cx,cy,rr_,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=2;for(let j=1;j<4;j++){ctx.beginPath();ctx.arc(cx,cy,rr_*j/4,0,7);ctx.stroke()}
    ctx.fillStyle=`rgba(255,201,60,${.4+.5*k})`;ctx.beginPath();ctx.arc(cx,cy,r*.16*(1+.3*k),0,7);ctx.fill()});
  ctx.fillStyle='#15161A';rr(x+w*.37,y+h*.36,w*.26,h*.42,6);ctx.fill();ctx.fillStyle='#3A3E47';rr(x+w*.4,y+h*.44,w*.2,h*.18,4);ctx.fill();
  ctx.fillStyle='#E8E2D4';ctx.beginPath();ctx.arc(x+w*.45,y+h*.53,h*.04,0,7);ctx.arc(x+w*.55,y+h*.53,h*.04,0,7);ctx.fill();
  for(let i=0;i<6;i++){const on=loudAt(t)*6*(1+.4*k)>i;ctx.fillStyle=on?(i>3?C.red:i>2?C.amber:C.green):'#20232A';ctx.fillRect(x+w*.06+i*w*.045,y+h*.09,w*.035,h*.08)}
  ctx.restore()}
function header(t,t0,title,sub){echo(t,t0,()=>gtx(title,90,250,80,{rot:-.03,seed:title.length,drips:2}));tx(sub,96,336,32,F.pen,C.cream,{a:P(t,t0+.2,t0+.4)})}
function header0(t,t0,title,sub){echo(t,t0,()=>{tx(title,90,250,74,F.kd,C.cream);const w=tw(title,74,F.kd);ctx.fillStyle=C.amber;ctx.fillRect(92,272,Math.min(w,90+w*eo3(P(t,t0,t0+.4))),6)});
  tx(sub,92,326,26,F.kr,C.dim,{w:'700',a:P(t,t0+.2,t0+.4)})}

// ---------- Star Runner, hip-hop head (live 3D, red bandana + gold chain): hands pump down on every beat, hard head nod, knees bounce.
// A different move every bar (both hands / alternating / lean with one hand / side rock), every joint on smooth curves, moves blend at the bar line; waves goodbye at the end
const DPX=330;let DR=null,GLC=null;
const MOVES=['pump','alt','lean','pump','rock','alt','pump','lean','rock','alt','pump','lean'];
const DEF={bob:0,squash:1,lean:0,yaw:0,roll:0,head:0,headTurn:0,headTilt:0,shR:[0,0,-8],shL:[0,0,8],elR:0,elL:0,hipR:0,kneeR:0,hipL:0,kneeL:0,tails:0};
function mixPose(a,b,w){const o={};for(const k in DEF){const x=a[k]??DEF[k],y=b[k]??DEF[k];o[k]=Array.isArray(x)?x.map((v,i)=>lerp(v,y[i],w)):lerp(x,y,w)}return o}
function movePose(mv,t){const e=t<.6?.45:clamp(.5+.6*loudAt(t)*2.4,0,1);const bt=(t-BT[0])/BPER;const ph=((bt%1)+1)%1;
  const hit=Math.pow(.5+.5*Math.cos(2*Math.PI*ph),1.6);                       // 1 on the beat, 0 between: hands and head come down on the beat
  const sw=Math.sin(Math.PI*bt);                                                // left-right over two beats
  const o={bob:-.06*e*hit,squash:1-.045*e*hit,head:-4+18*e*hit,lean:5*e*hit,roll:0,yaw:0,tails:sw*e,kneeR:14*e*hit,kneeL:14*e*hit,hipR:-8*e*hit,hipL:-8*e*hit};
  const arm=(u)=>[lerp(-78,-30,u),0,0],elb=(u)=>lerp(-62,-100,u);              // hand up (u=0) -> hand down (u=1), in front of the chest
  if(mv==='pump'){const u=hit*e;o.shR=arm(u);o.shR[2]=-22;o.shL=arm(u);o.shL[2]=22;o.elR=o.elL=elb(u)}
  if(mv==='alt'){const r=.5+.5*sw,l=1-r;const uR=clamp(hit*r*1.3)*e,uL=clamp(hit*l*1.3)*e;o.shR=arm(uR);o.shR[2]=-20;o.shL=arm(uL);o.shL[2]=20;o.elR=elb(uR);o.elL=elb(uL);o.roll=5*sw*e;o.yaw=8*sw*e}
  if(mv==='lean'){const u=hit*e;o.shR=arm(u);o.shR[2]=-26;o.elR=elb(u);o.shL=[-10,0,48];o.elL=-105;o.roll=-7*e;o.yaw=-14;o.headTurn=-8}
  if(mv==='rock'){const u=hit*e;o.yaw=18*sw*e;o.roll=-6*sw*e;o.shR=arm(u*.8);o.shR[2]=-30;o.shL=arm(u*.8);o.shL[2]=30;o.elR=o.elL=elb(u*.8);o.headTurn=10*sw}
  return o}
function danceState(t){const db=lastOf(DB,t);const bi=Math.max(0,DB.indexOf(db));const mv=i=>MOVES[((i%MOVES.length)+MOVES.length)%MOVES.length];
  let o=movePose(mv(bi),t);const w=eio3(P(t,db,db+BPER*.75));if(bi>0&&w<1)o=mixPose(movePose(mv(bi-1),t),o,w);
  if(t>LASTBEAT+BPER){const u=t-(LASTBEAT+BPER);const fade=clamp(1-u/2);const still={...DEF,head:-4,shR:[-10,0,-14],shL:[-10,0,14],elR:-20,elL:-20};o=mixPose(still,o,fade);
    const wv=P(u,1.2,1.6);if(wv>0){o.shR=[-15,0,lerp(-14,-100,eo3(wv))];o.elR=-40+30*Math.sin(u*9);o.headTilt=8*wv}}
  return o}
function dancer(t,cx,feetY,sc,{alpha=1}={}){if(!DR)return;const [gw,gh]=DR.size;const k=sc*240/DPX;const y0=feetY-gh*DR.feet*k;
  ctx.save();ctx.globalAlpha*=alpha;ctx.drawImage(GLC,cx-gw*k/2,y0,gw*k,gh*k);ctx.restore()}

// ---------- 0 ~ T1: the alley at night, a boombox on the ground, the title, photos pasted on the brick like posters on the offbeats
function sceneIntro(t){bg(t);
  const b=BT;echo(t,b[0],()=>{tx('오늘의 러닝',540,186,40,F.pen,C.amber,{al:'center',ls:6})});

  PHOTOS.forEach((im,i)=>{const t0=b[4+i]+BPER/2;const cx=i?775:305,cy=860+(i?40:0),rot=i?.05:-.05,w=400,h=500;
    echo(t,t0,()=>{ctx.save();ctx.translate(cx,cy+(i?0:0));ctx.rotate(rot);const chop=1+.012*offP(t);ctx.scale(chop,chop);ctx.fillStyle=C.cream;ctx.fillRect(-w/2-14,-h/2-14,w+28,h+80);
      const s=Math.max(w/im.width,h/im.height);const sw=w/s,sh=h/s;ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,-w/2,-h/2,w,h);
      [[-w/2+30,-h/2-14],[w/2-30,-h/2-14]].forEach(([x,y])=>{ctx.fillStyle='rgba(230,225,210,.75)';ctx.save();ctx.translate(x,y);ctx.rotate(.5);ctx.fillRect(-40,-12,80,24);ctx.restore()});tx(RUN.photoCaps[i]||'',0,h/2+50,34,F.pen,'#1A1410',{al:'center'});ctx.restore()})});
  dancer(t,540,1760,.62)}

// ---------- T1 ~ T2: the whole Garmin capture (never zoomed or covered) with echoing labels
const CAP={w:1080,h:1483};
function sceneCapture(t){bg(t,{dim:.55});header(t,T1,'오늘의 기록','가민 커넥트 그대로');dancer(t,965,330,.42);
  const cw=700,ch=cw*CAP.h/CAP.w,x=540-cw/2+40,y=380;echo(t,T1,()=>{ctx.fillStyle=C.cream;ctx.fillRect(x-12,y-12,cw+24,ch+24);ctx.drawImage(IMG.garmin,x,y,cw,ch)},{dx:18,dy:8,a0:.3});

// ---------- T2 ~ T3: splits, 1km to the last km top to bottom, each bar arrives with its echoes
function sceneSplits(t){bg(t,{dim:.55});header(t,T2,'구간 기록','1km마다 걸린 시간  막대가 길수록 빠름');dancer(t,965,330,.42);
  const lo=Math.min(...LAPS)-25,hi=Math.max(...LAPS)+15;const rh=Math.min(112,900/NL);
  LAPS.forEach((s,k)=>{const t0=T2+.05+k*BPER/2;const y=420+k*rh;const isF=k===FAST,isS=k===SLOW;const len=lerp(220,560,(hi-s)/(hi-lo));const col=isF?C.red:isS?C.blue:C.amber;
    if(t<t0)return;tx(lapLabel(k),90,y+56,36,F.kd,C.dim);
    echo(t,t0,(p)=>sprayBar(200,y+12,len*p,56,col,k+2));
    const vt=t0+.15;if(t>=vt){tx(pace(s),200+len+22,y+60,50,F.slab,isF?C.red:isS?C.blue:C.cream,{a:P(t,vt,vt+.2)});
      if(isF||isS){const tg=isF?'가장 빠름':'가장 느림';tx(tg,216,y+52,26,F.kd,'#1A1410',{a:P(t,vt,vt+.2)})}}});
  const ft=T2+BPER*3.6;echo(t,ft,()=>{tx('평균페이스',92,1400,30,F.kr,C.dim,{w:'700'});tx(pace(AVGP),90,1490,82,F.slab,C.green);
    tx('빠른 1km와 느린 1km 차이',990,1400,30,F.kr,C.dim,{al:'right',w:'700'});tx(dsec(LAPR[SLOW]-LAPR[FAST]),990,1482,60,F.kd,C.amber,{al:'right'})},{dx:16,dy:0})}

// ---------- T3 ~ T4: pace graph; the line is drawn with its echoes trailing behind; the km of the fastest moment is lit red, then a card stays
const GX0=160,GX1=975,GY0=560,GY1=1110;
const gx=d=>GX0+d/TOTD*(GX1-GX0),gy=p=>GY0+clamp((p-PLO)/(PHI-PLO))*(GY1-GY0);
function sceneWave(t){bg(t,{dim:.55});header(t,T3,'페이스 그래프',`${(TOTD/1000).toFixed(2)}km 실제 페이스`);dancer(t,965,330,.42);
  const WS=[];let c=T3+.1;for(let k=0;k<NL;k++){WS.push(c);c+=k===SK?BPER*2:BPER/4}
  const SK0=WS[SK],SK1=SK0+BPER*2;const kEnd=k=>k<NL-1?(k+1)*1000:TOTD;
  const revAt=tt=>{let d=0;for(let k=0;k<NL;k++){const q=k===SK?Math.pow(P(tt,SK0,SK1),1.4):eo3(P(tt,WS[k],WS[k]+.2));if(q>0)d=Math.max(d,lerp(k*1000,kEnd(k),q))}return d};
  const sp=P(t,SK0,SK0+.15);
  for(let p=Math.ceil(PLO/60)*60;p<=PHI;p+=60){const y=gy(p);ctx.strokeStyle=C.faint;ctx.lineWidth=2;ctx.setLineDash([6,10]);ctx.beginPath();ctx.moveTo(GX0,y);ctx.lineTo(GX1,y);ctx.stroke();ctx.setLineDash([]);
    tx(pace(p),GX0-14,y+8,22,F.kr,C.dim,{al:'right',w:'700'})}
  for(let k=0;k<=NL;k++){const x=gx(Math.min(k*1000,TOTD));tx(k===NL?`${(TOTD/1000).toFixed(2)}km`:String(k),x,GY1+40,22,F.kr,C.dim,{al:k===NL?'right':'center',w:'700'})}
  const sx0=gx(SK*1000),sx1=gx(kEnd(SK));if(sp>0){const g=ctx.createLinearGradient(0,GY0-80,0,GY1);g.addColorStop(0,`rgba(217,72,59,${.32*sp})`);g.addColorStop(1,'rgba(217,72,59,0)');ctx.fillStyle=g;ctx.fillRect(sx0,GY0-80,sx1-sx0,GY1-GY0+80)}
  LAPS.forEach((s,k)=>{if(t<WS[k])return;const x0=gx(k*1000),x1=gx(kEnd(k));const isK=k===SK&&sp>0;const col=isK?C.red:k===FAST?C.amber:k===SLOW?C.blue:C.cream;
    tx(pace(s),(x0+x1)/2,GY0-36,isK?32:26,F.slab,col,{al:'center',a:isK?1:1-.45*sp})});
  const line=(dR,col,wd,al,off)=>{const pts=PSER.filter(q=>q[0]<=dR).map(q=>[gx(q[0])+off,gy(q[1])+off*.4,q[0]]);if(pts.length<2)return pts;ctx.save();ctx.globalAlpha*=al;ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore();return pts};
  const pts=line(revAt(t),C.cream,4.5,1-.5*sp,0);
  if(sp>0){const pk=pts.filter(q=>q[2]>=SK*1000-30&&q[2]<=kEnd(SK));if(pk.length>1){ctx.save();ctx.strokeStyle=C.red;ctx.lineWidth=7;ctx.lineJoin='round';ctx.beginPath();pk.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore()}}
  if(t>=SK1){const x=gx(MAXD),y=gy(MAXP);ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.fill();
    echo(t,SK1+BPER*.5,()=>{ctx.save();ctx.translate(470,700);ctx.strokeStyle=C.red;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(300,0);ctx.lineTo(x-470-16,y-700);ctx.stroke();
      ctx.fillStyle='#1A1410';rr(-300,-104,600,208,24);ctx.fill();ctx.strokeStyle=C.red;ctx.lineWidth=3;rr(-300,-104,600,208,24);ctx.stroke();
      tx(SPRINT_T,-268,-44,38,F.kd,C.cream);tx('순간 최고',-268,40,26,F.kr,C.dim,{w:'700'});tx(pace(MAXP),-140,66,80,F.slab,C.red);
      tx(`${lapLabel(SK)} 구간`,268,6,26,F.kr,C.dim,{al:'right',w:'700'});tx(pace(LAPS[SK]),268,66,46,F.slab,C.cream,{al:'right'});ctx.restore()},{dx:18,dy:6,a0:.3})}
  const rb=[T3+BPER*4,T3+BPER*4.5,T3+BPER*5];
  [['평균페이스',pace(AVGP),C.green],['최고 페이스',pace(MAXP),C.red],['총 거리',(TOTD/1000).toFixed(2)+'km',C.amber]].forEach(([l,v,c],i)=>echo(t,rb[i],()=>{tx(l,90+i*310,1300,28,F.kr,C.dim,{w:'700'});tx(v,90+i*310,1384,68,F.slab,c)},{dx:14,dy:0}));
  if(t>rb[2]+BPER)echo(t,rb[2]+BPER,()=>tx(SPLIT_LINE,540,1530,52,F.pen,C.cream,{al:'center'}),{dx:12,dy:0})}

// ---------- T4 ~ T5: heart rate zones (Garmin order 5존 -> 존 미만), bars arrive with echoes, then sit still
function sceneZones(t){bg(t,{dim:.55});header(t,T4,'심박존별 시간','가민 심박존 기준');dancer(t,965,330,.42);
  [5,4,3,2,1,0].forEach((z,r)=>{const t0=T4+.05+r*BPER/3;const y=420+r*126;const sec=ZS[z];const col=ZC[z];if(t<t0)return;
    echo(t,t0,(p)=>{sprayBar(88,y+2,124,60,col,z+20,false);tx(z?`${z}존`:'존 미만',150,y+44,z?36:24,F.kd,'#1A1410',{al:'center'});
      const len=sec>0?Math.max(30,520*sec/ZMAX)*p:0;if(len>0)sprayBar(250,y+6,len,52,col,z+40)});
    tx(zRange(z),150,y+90,22,F.kr,C.dim,{al:'center',w:'700',a:P(t,t0,t0+.2)});
    const x2=250+(sec>0?Math.max(30,520*sec/ZMAX):0)+22;tx(mmss(sec),x2,y+52,46,F.slab,sec>0?C.cream:'rgba(241,230,207,.35)',{a:P(t,t0+.1,t0+.3)});tx(`${Math.round(sec/ZTOT*100)}%`,x2+tw(mmss(sec),46,F.slab)+12,y+50,26,F.kr,col,{w:'900',a:P(t,t0+.1,t0+.3)})});
  const hb=[T4+BPER*1.5,T4+BPER*1.8];
  [['평균심박수',S.avgHR],['최대심박수',S.maxHR]].forEach(([l,v],k)=>echo(t,hb[k],()=>{const al=k?'right':'left',x=k?990:90;tx(l,x,1270,30,F.kr,C.dim,{al,w:'700'});
    const vw=tw(String(v),92,F.slab),uw=tw('bpm',28,F.kr,'700');tx(String(v),k?x-uw-10:x,1370,92,F.slab,hrCol(v),{al});tx('bpm',k?x:x+vw+10,1370,28,F.kr,C.dim,{al,w:'700'})},{dx:14,dy:0}));
  if(t>hb[1]+BPER*.5){tx(ZONE_LINE,540,1486,50,F.pen,C.cream,{al:'center'});tx(BREAK_LINE,540,1540,26,F.kr,BRK.length?C.amber:C.dim,{al:'center',w:'700'})}}

// ---------- T5 ~ 30: the song's last bars and its fade: title, 완주 stamp, boombox, Star Runner pumping his hands, stats, memo with emphasis
function memoStyle(){const COL={num:C.amber,body:C.red,plan:C.green,feel:C.blue,key:C.cream};
  return{px:44,headScale:1.15,glow:0,k:0,
    font:(px,kind)=>kind==="num"?`${Math.round(px*.78)}px "${F.kd}"`:`${px}px "${F.pen}"`,
    color:(kind,k)=>!kind?C.cream:k>.5?COL[kind]:C.cream,
    decorate:(c,kind,x,y,w,px,k)=>{if(k<=0)return;
      if(kind==='plan'){c.save();c.fillStyle='rgba(79,209,139,.3)';c.beginPath();c.roundRect(x-4,y-px*.74,(w+8)*k,px*.98,px*.2);c.fill();c.restore()}
      else if(kind==='body'){c.save();c.strokeStyle=C.red;c.lineWidth=3.5;c.lineCap='round';c.lineWidth=5;c.beginPath();c.moveTo(x,y+10);c.quadraticCurveTo(x+w*k*.5,y+15,x+w*k,y+9);c.stroke();c.restore()}   // a marker underline   // underline with its own echoes
      else if(kind==='num'){c.save();c.fillStyle=`rgba(255,201,60,${.18*k})`;c.beginPath();c.roundRect(x-6,y-px*.78,w+12,px*1.02,px*.5);c.fill();c.restore()}
      else{c.save();c.fillStyle=C.cream;c.fillRect(x,y+9,w*k,3);c.restore()}}}}
let ML=null;
function sceneLoop(t){bg(t);const lb=beatsFrom(T5,16);
  echo(t,T5,()=>tx('오늘의 러닝',94,156,36,F.pen,C.amber,{ls:5}));
  echo(t,T5+BPER/2,()=>gtx(RUN.title,90,275,112,{rot:-.03,seed:5,drips:3}));
  echo(t,T5+BPER,()=>{ctx.save();ctx.translate(880,210);ctx.rotate(-.14);ctx.strokeStyle='#E8433A';ctx.lineWidth=9;ctx.shadowColor='rgba(232,67,58,.8)';ctx.shadowBlur=16;ctx.beginPath();ctx.ellipse(0,0,108,74,0,.2,6.1);ctx.stroke();ctx.shadowBlur=0;ctx.restore();gtx('완주',880,236,64,{al:'center',rot:-.14,fill:['#FFFFFF','#FF5FA2'],glow:'232,67,58',seed:9,drips:2})});
  dancer(t,540,880,.95);
  const CR=[['총 거리',(TOTD/1000).toFixed(2),'km',C.amber],['달린시간',mmss(TT),'',C.blue],['평균페이스',pace(AVGP),'',C.green],
    ['평균심박수',String(S.avgHR),'bpm',hrCol(S.avgHR)],['최대심박수',String(S.maxHR),'bpm',hrCol(S.maxHR)],['칼로리',String(S.kcal),'kcal',C.cream]];
  echo(t,T5+BPER*1.5,()=>{ctx.fillStyle='rgba(10,10,12,.62)';rr(70,905,940,268,20);ctx.fill();ctx.strokeStyle='rgba(246,241,231,.12)';ctx.lineWidth=2;rr(70,905,940,268,20);ctx.stroke()});
  CR.forEach(([l,v,u,c],i)=>{const t0=T5+BPER*1.5+BPER/3*i;const col=i%3,row=Math.floor(i/3);const cx=240+col*300,y=955+row*130;
    echo(t,t0,()=>{tx(l,cx,y,26,F.kr,C.dim,{al:'center',w:'700'});const vw=tw(v,56,F.slab),uw=u?tw(u,22,F.kr,'700')+6:0;tx(v,cx-uw/2,y+66,56,F.slab,c,{al:'center'});if(u)tx(u,cx-uw/2+vw/2+6,y+64,22,F.kr,C.dim,{w:'700'})},{dx:14,dy:0,n:2})});
  const mt=T5+BPER*2.6;echo(t,mt,()=>{const x=60,y=1215,w=960,h=520;ctx.fillStyle='rgba(20,16,12,.65)';rr(x,y,w,h,24);ctx.fill();ctx.strokeStyle='rgba(242,177,52,.5)';ctx.lineWidth=2;rr(x,y,w,h,24);ctx.stroke();
    tx('러닝 메모',x+40,y+62,34,F.pen,C.amber,{ls:3});ctx.fillStyle=C.faint;ctx.fillRect(x+40,y+82,w-80,2)},{dx:16,dy:6,a0:.25});
  if(t>=mt){const x=60,y=1215,w=960,h=520;const MLN=MemoEmphasis.parse(RUN.review,RUN.reviewMarks);const mo=memoStyle();
    if(!ML){for(let px=54;px>=36;px-=2){mo.px=px;if(MLN.every(l=>MemoEmphasis.width(ctx,l,mo)<=w-110)){ML={px};break}}if(!ML)ML={px:32}}mo.px=ML.px;
    const lh=ML.px*1.42,top=y+96+(h-96-MLN.length*lh)/2+ML.px*.9;
    MLN.forEach((ln,i)=>{const t1=mt+.15+.22*i;if(t<t1)return;mo.k=eo3(P(t,t1+.2,t1+.5));
      ctx.save();ctx.globalAlpha*=eo3(P(t,t1,t1+.2));MemoEmphasis.drawLine(ctx,ln,540,top+i*lh,mo);ctx.restore()})}}

// ---------- timeline (scenes change on the bar / the one-drop; the old page slides out to the left)
const SCENES=[[0,sceneIntro],[T1,sceneCapture],[T2,sceneSplits],[T3,sceneWave],[T4,sceneZones],[T5,sceneLoop]];
const BUF=document.createElement('canvas');BUF.width=W;BUF.height=H;
function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  if(DR)DR.draw(danceState(t));
  let k=0;SCENES.forEach(([s],i)=>{if(t>=s)k=i});const s0=SCENES[k][0];const tr=k>0?P(t,s0,s0+.35):1;
  if(tr<1){SCENES[k-1][1](Math.min(t,s0-.001));const b=BUF.getContext('2d');b.clearRect(0,0,W,H);b.drawImage(cv,0,0);SCENES[k][1](t);
    const e=eio3(tr);ctx.save();ctx.globalAlpha=1-e;ctx.drawImage(BUF,-W*.5*e,0);ctx.restore()}
  else SCENES[k][1](t);
  const fi=1-P(t,0,.5);if(fi>0){ctx.fillStyle=`rgba(26,18,16,${fi})`;ctx.fillRect(0,0,W,H)}}
window.render=render;window.DUR=DUR;
(async()=>{buildWall();await Promise.all([...Object.values(IMG),...PHOTOS,BGI.sharp,BGI.blur].map(im=>im.complete?0:new Promise(r=>{im.onload=r;im.onerror=r})));
  const fams=[[F.slab,''],[F.kd,''],[F.hd,'900'],[F.kr,'500'],[F.kr,'700'],[F.kr,'900'],[F.pen,'']];
  await Promise.all(fams.map(([f,w])=>document.fonts.load(`${w} 40px "${f}"`,'가나다ABC123')));await document.fonts.ready;
  GLC=document.createElement('canvas');DR=await HipHop3D.init(GLC,{px:DPX});window.READY=true;
  const q=new URLSearchParams(location.search);if(q.has('t'))render(+q.get('t'));else{const s=performance.now();(function loop(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(loop)})()}})();

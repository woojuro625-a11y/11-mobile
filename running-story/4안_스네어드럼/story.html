<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script src="data.js"></script>
<script src="beat.js"></script>
<script src="drums.js"></script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,DUR=30;
// ---------- per-run text (title / memo are not in the FIT file)
const RUN={title:'회복조깅',memo:'10km 뛰려다가 8km까지만',
  review:'10km 뛰려다가 8km까지만\n아직도 근육통이 심하다\n따뜻하게 입어서 그런지 다리가 힘들어서 그런지\n심박수가 급상승 해버렸다\n내일은 하루 더 쉬고 토요일 오전에 뛰어야지',   // keep the memo's own line breaks (\n)
  photos:['img/photo1.jpg','img/photo2.jpg']};
// ---------- look: snare drum stage (black stage, white type, red snare accent)
const C={bg:'#0A0A0B',white:'#F4F4F2',dim:'rgba(244,244,242,.6)',faint:'rgba(244,244,242,.14)',red:'#FF2D3A',blue:'#5B8CFF',green:'#3DDC84',orange:'#FF8A3D',tape:'#F4F4F2'};
const ZC=['#7F8891','#AEB6BF','#4AB3F4','#3DDC84','#F5A623','#F0524F'];       // zone colours (존 미만 1 2 3 4 5) on black
const hrCol=h=>ZC[DATA.zones.filter(b=>h>=b).length];
const F={kd:'Black Han Sans',num:'Anton',kr:'Noto Sans KR',mono:'Space Mono',pen:'Nanum Pen Script'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');

// ---------- utils
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo3=t=>1-Math.pow(1-t,3);
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mmss=s=>{s=Math.round(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const pace=s=>{s=Math.round(s);return `${Math.floor(s/60)}'${String(s%60).padStart(2,'0')}"`};
const dsec=s=>{s=Math.round(s);return s>=60?`${Math.floor(s/60)}분 ${s%60}초`:`${s}초`};
function tx(s,x,y,px,fam,col,{w='',al='left',a=1,ls=0,maxW=0}={}){
  ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.textAlign=al;ctx.textBaseline='alphabetic';ctx.letterSpacing=ls+'px';ctx.fillStyle=col;
  const m=ctx.measureText(s).width;ctx.translate(x,y);if(maxW&&m>maxW)ctx.scale(maxW/m,1);ctx.fillText(s,0,0);ctx.restore()}
function tw(s,px,fam,w='',ls=0){ctx.save();ctx.font=`${w} ${px}px "${fam}"`.trim();ctx.letterSpacing=ls+'px';const m=ctx.measureText(s).width;ctx.restore();return m}

// ---------- drums measured from the song (per beat: kick and snare strength) + beat grid
const BT=BEATS.map(b=>b[0]),DB=BEATS.filter(b=>b[1]).map(b=>b[0]);
const BPER=(()=>{const d=BT.slice(1).map((b,i)=>b-BT[i]).sort((a,b)=>a-b);return d[Math.floor(d.length/2)]})();
const DBEATS=DRUMS.beats,CUTSIL=DRUMS.cuts;
const SN=DBEATS.filter(b=>b[2]>.6).map(b=>[b[0],Math.min(1,b[2])]),KK=DBEATS.filter(b=>b[1]>.45).map(b=>[b[0],Math.min(1,b[1])]);
const lastHit=(arr,t)=>{let r=null;for(const h of arr){if(h[0]<=t)r=h;else break}return r};
const snP=(t,k=.09)=>{const h=lastHit(SN,t);return h&&t-h[0]<1?Math.exp(-(t-h[0])/k)*h[1]:0};
const kkP=(t,k=.12)=>{const h=lastHit(KK,t);return h&&t-h[0]<1?Math.exp(-(t-h[0])/k)*h[1]:0};
const snSince=t=>{const h=lastHit(SN,t);return h?t-h[0]:9};
const inCut=t=>CUTSIL.some(([s,d])=>t>=s&&t<s+d);
const nearDB=x=>DB.reduce((a,b)=>Math.abs(b-x)<Math.abs(a-x)?b:a,DB[0]);
const beatsFrom=(t0,n)=>{const i=BT.findIndex(b=>b>=t0-.02);return BT.slice(i,i+n)};
const T1=nearDB(3.2),T2=nearDB(7.4),T3=nearDB(11.65),TJ=nearDB(13.8),T4=nearDB(15.9),T5=nearDB(20.1);
const SNin=(a,b)=>SN.filter(h=>h[0]>=a-.01&&h[0]<b-.01).map(h=>h[0]);   // snare hits inside a span

// ---------- images
const IMG={};['garmin','front','wave'].forEach(n=>{const im=new Image();im.src=`img/${n}.png`;IMG[n]=im});
const PHOTOS=RUN.photos.map(src=>{const im=new Image();im.src=src;return im});
function drawImg(n,cx,by,h,{rot=0,sx=1,alpha=1}={}){const im=IMG[n];const w=im.width*h/im.height;
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(cx,by);ctx.rotate(rot);ctx.scale(sx,1);ctx.drawImage(im,-w/2,-h,w,h);ctx.restore()}

// ---------- data
const S=DATA.session,TOTD=S.dist,TT=S.time;
const LAPS=DATA.laps.map(l=>l[1]/(l[0]/1000)),LAPD=DATA.laps.map(l=>l[0]),NL=LAPS.length;
const LAPR=LAPS.map(s=>Math.round(s));
const FAST=LAPR.indexOf(Math.min(...LAPR)),SLOW=LAPR.indexOf(Math.max(...LAPR));
const lapLabel=i=>LAPD[i]>=990?`${i+1}km`:`${(LAPD.slice(0,i+1).reduce((a,b)=>a+b,0)/1000).toFixed(2)}km`;
const MAXP=(DATA.maxPace&&DATA.maxPace.sec)||Math.min(...LAPS),MAXD=(DATA.maxPace&&DATA.maxPace.dist)||TOTD;
const PSER=DATA.paceSeries||[];const PSORT=PSER.map(x=>x[1]).sort((a,b)=>a-b);const P98=PSORT.length?PSORT[Math.floor(PSORT.length*.98)]:Math.max(...LAPS);
const PLO=Math.floor((Math.min(MAXP,PSORT[0]||MAXP,...LAPS)-8)/10)*10,PHI=Math.ceil((Math.max(P98,...LAPS)+10)/10)*10;
const AVGP=TT/(TOTD/1000);
const SPLIT_LINE=(()=>{const sp=Math.max(...LAPR)-Math.min(...LAPR);const last=LAPR[NL-1],first=LAPR[0];
  if(sp<=20)return'흔들림 없이 같은 리듬으로';if(last===Math.min(...LAPR)&&first>=Math.max(...LAPR)-5)return'갈수록 빨라지고 마지막은 스퍼트';
  if(last===Math.min(...LAPR))return'마지막 1km는 스퍼트';return'구간마다 리듬을 바꿔 가며'})();
const ZS=DATA.zoneSec,ZTOT=ZS.reduce((a,b)=>a+b,0),ZMAX=Math.max(...ZS);const ZTOP=ZS.slice(1).indexOf(Math.max(...ZS.slice(1)))+1;
const ZONE_LINE=`가장 오래 머문 구간은 ${ZTOP}존 ${Math.round(ZS[ZTOP]/ZTOT*100)}%`;
const zRange=i=>i===0?`${DATA.zones[0]-1} 이하`:i<5?`${DATA.zones[i-1]}~${DATA.zones[i]-1}`:`${DATA.zones[4]} 이상`;
const BRK=DATA.breaks||[];
const BREAK_LINE=BRK.length?`중간에 ${BRK.length}번 멈춤 ${dsec(BRK.reduce((a,b)=>a+b.dur,0))}`:'중간 멈춤 없이 연속 달리기';
const MEMO=RUN.review.split('\n').map(s=>s.trim()).filter(Boolean);
const SK=Math.min(NL-1,Math.floor(MAXD/1000));
const SPRINT_T=SK===NL-1&&LAPR[NL-1]===Math.min(...LAPR)?'마지막 1km 스퍼트':SK===NL-1?'마지막 1km 가장 빠른 순간':`${SK+1}km 구간 가장 빠른 순간`;

// ---------- the snare drum (top view) + stick
function snareDrum(cx,cy,r,t,{title='',sub='',alpha=1}={}){const hit=snP(t,.12);ctx.save();ctx.globalAlpha*=alpha;
  ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=r*.15;const g=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);g.addColorStop(0,'#E9EAEC');g.addColorStop(.45,'#7C7F86');g.addColorStop(.55,'#C9CBD0');g.addColorStop(1,'#5A5D63');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.08,0,7);ctx.fill();ctx.shadowColor='transparent';
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2+.31;ctx.save();ctx.translate(cx+Math.cos(a)*r*1.1,cy+Math.sin(a)*r*1.1);ctx.rotate(a);ctx.fillStyle='#B9BCC2';ctx.fillRect(-r*.05,-r*.035,r*.1,r*.07);ctx.fillStyle='#55585E';ctx.fillRect(-r*.02,-r*.012,r*.04,r*.024);ctx.restore()}
  const hg=ctx.createRadialGradient(cx-r*.2,cy-r*.25,r*.1,cx,cy,r);hg.addColorStop(0,'#FBFBF8');hg.addColorStop(1,'#DADAD4');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(cx,cy,r*.98,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=r*.02;ctx.beginPath();ctx.arc(cx,cy,r*.93,0,7);ctx.stroke();
  const HX=cx+r*.42,HY=cy+r*.5;                                                            // hit point: lower right, clear of the lettering
  if(hit>.02){for(let k=0;k<3;k++){const rr=r*(.1+(1-hit)*.5+k*.1);ctx.strokeStyle=`rgba(255,45,58,${.45*hit})`;ctx.lineWidth=r*.025;ctx.beginPath();ctx.arc(HX,HY,rr,0,7);ctx.stroke()}}
  if(title)tx(title,cx-r*.06,cy+r*.02,r*.34,F.kd,'#111',{al:'center',maxW:r*1.2});
  if(sub)tx(sub,cx-r*.06,cy+r*.24,r*.12,F.kd,C.red,{al:'center'});
  // stick: tip comes down on every snare hit
  const since=snSince(t);const up=since<.04?0:clamp((since-.04)/.18);const tipx=HX,tipy=HY;const ang=-1.05;const L=r*1.9;const lift=r*(.06+.55*Math.pow(up,.7));
  const bx=tipx+Math.cos(ang)*L+lift*.3,byy=tipy+Math.sin(ang)*L-lift;ctx.lineCap='round';
  ctx.fillStyle=`rgba(0,0,0,${.25*(1-up)})`;ctx.beginPath();ctx.ellipse(tipx+r*.03,tipy+r*.03,r*.07,r*.05,0,0,7);ctx.fill();   // contact shadow only when the tip is down
  const sg=ctx.createLinearGradient(tipx,tipy,bx,byy);sg.addColorStop(0,'#E8D3A8');sg.addColorStop(1,'#B88A52');ctx.strokeStyle=sg;ctx.lineWidth=r*.075;ctx.beginPath();ctx.moveTo(tipx+lift*.06,tipy-lift*.2);ctx.lineTo(bx,byy);ctx.stroke();
  ctx.fillStyle='#F1E3C4';ctx.beginPath();ctx.ellipse(tipx+lift*.06,tipy-lift*.2,r*.055,r*.045,ang,0,7);ctx.fill();
  ctx.restore()}
// shockwave rings from a point on each snare hit (strength = how hard the snare hit)
function shock(t,x,y,maxR=700){const h=lastHit(SN,t);if(!h)return;const e=t-h[0];if(e>.4)return;ctx.save();
  for(let k=0;k<2;k++){const q=clamp((e-k*.05)/.35);if(q<=0)continue;ctx.strokeStyle=`rgba(255,45,58,${(1-q)*.55*h[1]})`;ctx.lineWidth=10*(1-q)+2;ctx.beginPath();ctx.arc(x,y,40+maxR*eo3(q),0,7);ctx.stroke()}ctx.restore()}
// a word that slams in on a hit: oversize + three smear copies for one beat-fraction
function slamTx(t,t0,s,x,y,px,fam,col,{al='left',w=''}={}){if(t<t0)return;const p=P(t,t0,t0+.08);const sc=1+.35*(1-p);
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);if(p<1)for(let k=1;k<=3;k++)tx(s,-k*14*(1-p),0,px,fam,col,{al,w,a:.18*(1-p)});tx(s,0,0,px,fam,col,{al,w});ctx.restore()}
function slamIn(t,t0){if(t<t0)return null;const p=P(t,t0,t0+.08);return 1+.25*(1-p)}
function tapeLabel(x,y,s,{bg=C.red,fg='#fff',px=34,rot=-.04}={}){const w=tw(s,px,F.kd)+36;ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=bg;ctx.fillRect(-w/2,-px*.95,w,px*1.5);
  ctx.fillStyle='rgba(0,0,0,.12)';for(let i=0;i<w;i+=7)ctx.fillRect(-w/2+i,-px*.95,1,px*1.5);tx(s,0,px*.28,px,F.kd,fg,{al:'center'});ctx.restore()}
function header(t,t0,title,sub){const k=slamIn(t,t0);if(!k)return;ctx.save();ctx.translate(90,250);ctx.scale(k,k);tx(title,0,0,72,F.kd,C.white);ctx.restore();
  tx(sub,92,306,26,F.kr,C.dim,{w:'700',a:t>t0+BPER?1:0});snareDrum(940,232,58,t)}

// ---------- drum lane at the bottom: the song's real kick (white, up) and snare (red, down) scrolling past a playhead
function drumLane(t,a=1){if(a<=0)return;const y=1760,pxPerS=260;ctx.save();ctx.globalAlpha*=a;
  ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,y-60,W,120);ctx.fillStyle=C.faint;ctx.fillRect(0,y,W,2);
  DBEATS.forEach(([bt,k,s])=>{const x=540+(bt-t)*pxPerS;if(x<-20||x>W+20)return;const past=bt<=t;
    ctx.fillStyle=past?C.white:'rgba(244,244,242,.35)';ctx.fillRect(x-5,y-4-54*Math.min(1,k),10,54*Math.min(1,k));
    ctx.fillStyle=past?C.red:'rgba(255,45,58,.35)';ctx.fillRect(x-5,y+6,10,50*Math.min(1,s))});
  ctx.fillStyle=C.white;ctx.fillRect(538,y-66,4,132);tx('KICK',24,y-36,18,F.mono,C.dim,{w:'700'});tx('SNARE',24,y+46,18,F.mono,C.red,{w:'700'});ctx.restore()}

// ---------- 0 ~ T1: the drum, the title, the photos cut in on the three snares
function sceneOpen(t){const d1=DB[0];const b=beatsFrom(d1,4);
  // photos: hard cuts on snares 2 and 3 of the first bar, split screen on 4
  const ph=b[1],ph2=b[2],ph3=b[3];
  const photo=(im,x,y,w,h)=>{const s=Math.max(w/im.width,h/im.height);const sw=w/s,sh=h/s;ctx.save();ctx.filter='grayscale(1) contrast(1.35) brightness(.72)';ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,x,y,w,h);ctx.filter='none';
    ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgba(255,45,58,${.25+.5*snP(t,.15)})`;ctx.fillRect(x,y,w,h);ctx.restore()};
  if(t>=ph&&t<ph3)photo(t<ph2?PHOTOS[0]:PHOTOS[1],0,0,W,H);
  if(t>=ph3){ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W,820);ctx.lineTo(0,1080);ctx.closePath();ctx.clip();photo(PHOTOS[0],0,0,W,1080);ctx.restore();
    ctx.save();ctx.beginPath();ctx.moveTo(0,1100);ctx.lineTo(W,840);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.clip();photo(PHOTOS[1],0,840,W,1080);ctx.restore();
    ctx.strokeStyle=C.red;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(0,1090);ctx.lineTo(W,830);ctx.stroke()}
  // pickup: the drum and the words on the two pickup beats
  const big=t<d1;const dr=big?300:150;const dcy=big?900:330;
  if(big)snareDrum(540,dcy,dr,t);else snareDrum(940,232,58,t);
  if(big){slamTx(t,BT[0],'오늘의',540,420,120,F.kd,C.white,{al:'center'});slamTx(t,BT[1]||.5,'러닝',540,1420,150,F.kd,C.red,{al:'center'})}
  else{// title on the downbeat, memo and date on the last snare
    tx('오늘의 러닝',90,170,40,F.kd,C.red);slamTx(t,d1,RUN.title,90,330,190,F.kd,C.white);
    if(t>=ph3){slamTx(t,ph3,RUN.memo,92,420,46,F.kr,C.white,{w:'900'});tx(S.dateLong,92,480,30,F.kr,C.dim,{w:'700'})}
    shock(t,940+.42*58,232+.5*58,800)}}

// ---------- T1 ~ T2: the whole Garmin capture on the stage; labels land on the snares (never zoomed, nothing drawn on it)
const CAP={w:1080,h:1483};
function sceneCapture(t){header(t,T1,'오늘의 기록','가민 커넥트 그대로');
  const ih=1080,cs=ih/CAP.h,iw=CAP.w*cs,ix=540-iw/2+40,iy=380;const k=slamIn(t,T1);
  {const REGc=[[0,.405],[.41,.565],[.575,1]];const hs0=SNin(T1+.05,T2).slice(0,3);REGc.forEach(([a_,b_],i)=>{if(hs0[i]!==undefined&&t>=hs0[i])shock(t,100,iy+(a_+b_)/2*ih,300)})}
  ctx.save();ctx.translate(ix+iw/2,iy+ih/2);ctx.scale(k,k);ctx.fillStyle='#fff';ctx.fillRect(-iw/2-8,-ih/2-8,iw+16,ih+16);ctx.drawImage(IMG.garmin,-iw/2,-ih/2,iw,ih);ctx.restore();
  const REG=[[0,.405,'지도'],[.41,.565,'제목'],[.575,1,'기록']];const hs=SNin(T1+.05,T2).slice(0,3);while(hs.length<3)hs.push((hs[hs.length-1]||T1)+BPER);
  REG.forEach(([a,b,lab],i)=>{if(t<hs[i])return;const cy=iy+(a+b)/2*ih;const kk=slamIn(t,hs[i]);ctx.save();ctx.translate(100,cy);ctx.scale(kk,kk);tapeLabel(0,0,lab,{rot:i%2?.06:-.06});ctx.restore();
    ctx.strokeStyle=C.red;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(150,cy);ctx.lineTo(ix-12,cy);ctx.stroke()})}

// ---------- T2 ~ T3: splits as velocity bars, 1km to the last km top to bottom
function sceneSplits(t){header(t,T2,'구간 기록','1km마다 걸린 시간  막대가 길수록 빠름');
  const lo=Math.min(...LAPS)-25,hi=Math.max(...LAPS)+15;const rh=Math.min(112,900/NL);
  LAPS.forEach((s,k)=>{const t0=T2+.05+k*BPER/2;if(t<t0)return;const y=420+k*rh;const len=lerp(250,640,(hi-s)/(hi-lo))*eo3(P(t,t0,t0+.1));
    const isF=k===FAST,isS=k===SLOW;const col=isF?C.red:isS?C.blue:C.white;
    tx(lapLabel(k),90,y+56,40,F.num,C.dim);
    ctx.fillStyle=col;for(let x=0;x<len;x+=16)ctx.fillRect(210+x,y+8,Math.min(12,len-x),62);           // segmented like a velocity lane
    slamTx(t,t0,pace(s),210+len+22,y+62,56,F.num,col);
    const tg=isF?'가장 빠름':isS?'가장 느림':'';const hs=SNin(T2+4*BPER,T3);if(tg&&t>=(isF?hs[0]:hs[1]||hs[0]||T3)){ctx.save();ctx.translate(320,y+40);ctx.scale(slamIn(t,isF?hs[0]:hs[1]||hs[0]),slamIn(t,isF?hs[0]:hs[1]||hs[0]));tapeLabel(0,10,tg,{bg:'#111',fg:col,px:28,rot:-.03});ctx.restore()}});
  const ft=nearDB(T2+2*BPER*2-.01)+BPER*2;if(t>=ft){slamTx(t,ft,pace(AVGP),90,1440,86,F.num,C.green);tx('평균페이스',92,1340,30,F.kr,C.dim,{w:'700'});
    tx('빠른 1km와 느린 1km 차이',990,1340,30,F.kr,C.dim,{al:'right',w:'700'});slamTx(t,ft,dsec(LAPR[SLOW]-LAPR[FAST]),990,1430,64,F.kd,C.orange,{al:'right'})}}

// ---------- T3 ~ T4: pace graph; the km of the fastest moment is lit red from the song's section change (TJ)
const GX0=160,GX1=975,GY0=560,GY1=1110;
const gx=d=>GX0+d/TOTD*(GX1-GX0),gy=p=>GY0+clamp((p-PLO)/(PHI-PLO))*(GY1-GY0);
function sceneWave(t){header(t,T3,'페이스 그래프',`${(TOTD/1000).toFixed(2)}km 실제 페이스`);
  const WS=[];let c=T3+.1;for(let k=0;k<NL;k++){if(k===SK){c=Math.max(c,TJ);WS.push(c);c+=2*BPER}else{WS.push(c);c+=BPER/2}}
  const SK0=WS[SK],SK1=SK0+2*BPER;const kEnd=k=>k<NL-1?(k+1)*1000:TOTD;
  const prog=k=>k===SK?Math.pow(P(t,SK0,SK1),1.4):eo3(P(t,WS[k],WS[k]+.2));
  let dR=0;for(let k=0;k<NL;k++){const q=prog(k);if(q>0)dR=Math.max(dR,lerp(k*1000,kEnd(k),q))}
  const sp=P(t,SK0,SK0+.1);
  for(let p=Math.ceil(PLO/60)*60;p<=PHI;p+=60){const y=gy(p);ctx.strokeStyle=C.faint;ctx.lineWidth=2;ctx.setLineDash([6,10]);ctx.beginPath();ctx.moveTo(GX0,y);ctx.lineTo(GX1,y);ctx.stroke();ctx.setLineDash([]);
    tx(pace(p),GX0-14,y+8,22,F.mono,C.dim,{al:'right',w:'700'})}
  for(let k=0;k<=NL;k++){const x=gx(Math.min(k*1000,TOTD));ctx.fillStyle=C.faint;ctx.fillRect(x-1,GY0-10,2,GY1-GY0+10);tx(k===NL?`${(TOTD/1000).toFixed(2)}km`:String(k),x,GY1+40,22,F.mono,C.dim,{al:k===NL?'right':'center',w:'700'})}
  const sx0=gx(SK*1000),sx1=gx(kEnd(SK));if(sp>0){ctx.fillStyle=`rgba(255,45,58,${(.16+.1*snP(t))*sp})`;ctx.fillRect(sx0,GY0-80,sx1-sx0,GY1-GY0+80)}
  LAPS.forEach((s,k)=>{if(t<WS[k])return;const x0=gx(k*1000),x1=gx(kEnd(k));const isK=k===SK&&sp>0;const col=isK?C.red:k===FAST?C.orange:k===SLOW?C.blue:C.white;
    tx(pace(s),(x0+x1)/2,GY0-36,isK?34:28,F.num,col,{al:'center',a:isK?1:1-.5*sp});
    ctx.save();ctx.globalAlpha*=.7*(isK?1:1-.5*sp);ctx.strokeStyle=col;ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(x0+4,gy(s));ctx.lineTo(x1-4,gy(s));ctx.stroke();ctx.restore()});
  const pts=PSER.filter(q=>q[0]<=dR).map(q=>[gx(q[0]),gy(q[1]),q[0]]);
  const line=(arr,col,wd,al)=>{if(arr.length<2)return;ctx.save();ctx.globalAlpha*=al;ctx.strokeStyle=col;ctx.lineWidth=wd;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();arr.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.restore()};
  line(pts,C.white,4.5,1-.6*sp);if(sp>0)line(pts.filter(q=>q[2]>=SK*1000-30&&q[2]<=kEnd(SK)),C.red,7,1);
  if(t>=SK1){const x=gx(MAXD),y=gy(MAXP);ctx.fillStyle=C.red;ctx.beginPath();ctx.arc(x,y,11*slamIn(t,SK1),0,7);ctx.fill();shock(t,x,y,260);
    const ct=SK1+BPER/2;if(t>=ct){const kk=slamIn(t,ct);ctx.save();ctx.translate(440,690);ctx.scale(kk,kk);ctx.rotate(-.025);
      ctx.strokeStyle=C.red;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(280,0);ctx.lineTo(x-440-18,y-690);ctx.stroke();
      ctx.fillStyle=C.red;ctx.fillRect(-290,-100,580,200);ctx.fillStyle='rgba(0,0,0,.12)';for(let i=0;i<580;i+=7)ctx.fillRect(-290+i,-100,1,200);
      tx(SPRINT_T,-260,-40,38,F.kd,'#fff');tx('순간 최고',-260,50,28,F.kr,'#fff',{w:'900'});tx(pace(MAXP),-118,66,90,F.num,'#111');
      tx(`${lapLabel(SK)} 구간`,262,8,26,F.kr,'#fff',{al:'right',w:'900'});tx(pace(LAPS[SK]),262,66,50,F.num,'#fff',{al:'right'});ctx.restore()}}
  const rb=beatsFrom(T3+2*BPER-.02,3);
  [['평균페이스',pace(AVGP),C.green],['최고 페이스',pace(MAXP),C.red],['총 거리',(TOTD/1000).toFixed(2)+'km',C.orange]].forEach(([l,v,c],i)=>{if(t<rb[i])return;tx(l,90+i*310,1300,28,F.kr,C.dim,{w:'700'});slamTx(t,rb[i],v,90+i*310,1384,76,F.num,c)});
  if(t>rb[2]+BPER)tx(SPLIT_LINE,540,1520,58,F.pen,C.white,{al:'center'})}

// ---------- T4 ~ T5: heart rate zones; every bar shoots from 0 to its max on each snare hit (the time is printed next to each bar)
function sceneZones(t){header(t,T4,'심박존별 시간','가민 심박존 기준  스네어마다 펌핑');
  [5,4,3,2,1,0].forEach((z,r)=>{const y=420+r*132;const t0=T4+.05+r*BPER/2;if(t<t0)return;const sec=ZS[z];const col=ZC[z];const k=slamIn(t,t0);
    ctx.save();ctx.translate(155,y+32);ctx.scale(k,k);ctx.fillStyle=col;ctx.fillRect(-65,-32,130,64);tx(z?`${z}존`:'존 미만',0,z?16:11,z?42:28,F.kd,'#111',{al:'center'});ctx.restore();
    tx(zRange(z),155,y+92,22,F.mono,C.dim,{al:'center',w:'700'});
    const max=sec>0?Math.max(14,540*sec/ZMAX):0;const since=snSince(t);const h=lastHit(SN,t);const v=h?h[1]:0;
    const pump=t<t0+.1?eo3(P(t,t0,t0+.1)):since<.035?since/.035:Math.pow(clamp(1-(since-.035)/(BPER*.85)),1.6);
    const cur=max*(t<t0+.1?pump:pump*(.55+.45*v));
    if(cur>0){ctx.fillStyle=col;for(let x=0;x<cur;x+=14)ctx.fillRect(250+x,y+4,Math.min(10,cur-x),56)}
    const x2=250+max+22;tx(mmss(sec),x2,y+54,54,F.num,sec>0?C.white:'rgba(244,244,242,.35)');tx(`${Math.round(sec/ZTOT*100)}%`,x2+tw(mmss(sec),54,F.num)+14,y+52,28,F.mono,col,{w:'700'})});
  const hb=beatsFrom(nearDB(T4+4*BPER-.01),3);
  [['평균심박수',S.avgHR],['최대심박수',S.maxHR]].forEach(([l,v],k)=>{if(t<hb[k])return;const al=k?'right':'left',x=k?990:90;tx(l,x,1290,30,F.kr,C.dim,{al,w:'700'});
    const vw=tw(String(v),100,F.num),uw=tw('bpm',30,F.kr,'700');slamTx(t,hb[k],String(v),k?x-uw-10:x,1396,100,F.num,hrCol(v),{al});tx('bpm',k?x:x+vw+10,1396,30,F.kr,C.dim,{al,w:'700'})});
  if(t>hb[2]){tx(ZONE_LINE,540,1520,58,F.pen,C.white,{al:'center'});tx(BREAK_LINE,540,1580,26,F.kr,BRK.length?C.orange:C.dim,{al:'center',w:'700'})}}

// ---------- T5 ~ 30: loop: the drum with the title on its head, stats, the memo as a setlist taped on the stage
function memoLayout(maxW,maxLines){for(let px=50;px>=38;px-=2){if(MEMO.length<=maxLines&&MEMO.every(l=>tw(l,px,F.pen)<=maxW))return{px,lines:MEMO}}
  for(let px=50;px>28;px-=2){const lines=[];for(const ln of MEMO){if(tw(ln,px,F.pen)<=maxW){lines.push(ln);continue}let cur='';for(const w of ln.split(' ')){const tt=cur?cur+' '+w:w;if(tw(tt,px,F.pen)>maxW&&cur){lines.push(cur);cur=w}else cur=tt}if(cur)lines.push(cur)}
    if(lines.length<=maxLines)return{px,lines}}return{px:28,lines:MEMO.slice(0,maxLines)}}
let ML=null;
function sceneLoop(t){const lb=beatsFrom(T5,12);
  tx('오늘의 러닝',540,150,40,F.kd,C.red,{al:'center',a:t>=T5?1:0});
  const dk=slamIn(t,T5)||1;ctx.save();ctx.translate(540,470);ctx.scale(dk,dk);snareDrum(0,0,270,t,{title:RUN.title,sub:`완주  ${(TOTD/1000).toFixed(2)}KM`});ctx.restore();shock(t,540+.42*270,470+.5*270,620);
  {const t0=lb[4];if(t>=t0){const e=t-t0;const wv=(e%4)>2.6&&(e%4)<3.6;drawImg(wv?'wave':'front',190,790,80)}}
  const CR=[['총 거리',(TOTD/1000).toFixed(2),'km',C.orange],['달린시간',mmss(TT),'',C.blue],['평균페이스',pace(AVGP),'',C.green],
    ['평균심박수',String(S.avgHR),'bpm',hrCol(S.avgHR)],['최대심박수',String(S.maxHR),'bpm',hrCol(S.maxHR)],['칼로리',String(S.kcal),'kcal',C.white]];
  ctx.fillStyle=C.faint;ctx.fillRect(90,850,900,2);
  CR.forEach(([l,v,u,c],i)=>{const t0=lb[1]+BPER/2*i;if(t<t0)return;const col=i%3,row=Math.floor(i/3);const cx=240+col*300,y=905+row*150;
    tx(l,cx,y,26,F.kr,C.dim,{al:'center',w:'700'});const vw=tw(v,68,F.num),uw=u?tw(u,24,F.kr,'700')+6:0;slamTx(t,t0,v,cx-uw/2,y+78,68,F.num,c,{al:'center'});if(u)tx(u,cx-uw/2+vw/2+6,y+76,24,F.kr,C.dim,{w:'700'})});
  // setlist paper
  const pt=lb[5];if(t>=pt){const k=slamIn(t,pt);const px0=90,py0=1230,pw=900,ph=420;ctx.save();ctx.translate(540,py0+ph/2);ctx.scale(k,k);ctx.rotate(-.012);ctx.translate(-540,-(py0+ph/2));
    ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=24;ctx.fillStyle='#F2F1EC';ctx.fillRect(px0,py0,pw,ph);ctx.shadowColor='transparent';
    [[px0+70,py0],[px0+pw-70,py0]].forEach(([x,y],i)=>{ctx.save();ctx.translate(x,y);ctx.rotate(i?.3:-.3);ctx.fillStyle='rgba(30,30,30,.85)';ctx.fillRect(-60,-18,120,36);ctx.restore()});   // gaffer tape
    tx('SETLIST',px0+40,py0+66,26,F.mono,C.red,{w:'700',ls:6});tx('러닝 메모',px0+pw-40,py0+66,30,F.kd,'#111',{al:'right'});ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(px0+40,py0+86,pw-80,2);
    if(!ML)ML=memoLayout(pw-120,6);const lh=ML.px*1.22,top=py0+86+(ph-86-ML.lines.length*lh)/2+ML.px*.9;
    ML.lines.forEach((ln,i)=>{const t0=pt+BPER/2*(i+1);if(t<t0)return;tx(ln,540,top+i*lh,ML.px,F.pen,'#111',{al:'center'})});ctx.restore()}}

// ---------- timeline
const SCENES=[[0,sceneOpen],[T1,sceneCapture],[T2,sceneSplits],[T3,sceneWave],[T4,sceneZones],[T5,sceneLoop]];
function render(t){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  const sh=snP(t,.06)*12;const kp=1+.018*kkP(t);
  ctx.translate(540,960);ctx.scale(kp,kp);ctx.translate(-540+(rnd(Math.floor(t*60))-.5)*sh,-960+(rnd(Math.floor(t*60)+7)-.5)*sh);
  let k=0;SCENES.forEach(([s],i)=>{if(t>=s)k=i});
  const s0=SCENES[k][0];if(k>0&&t<s0+.09){ctx.save();ctx.translate(-(1-P(t,s0,s0+.09))*W*.15,0);SCENES[k][1](t);ctx.restore()}else SCENES[k][1](t);
  ctx.setTransform(1,0,0,1,0,0);drumLane(t,t>=DB[0]?1:0);
  const fl=snP(t,.05);if(fl>.02){ctx.fillStyle=`rgba(255,255,255,${.13*fl})`;ctx.fillRect(0,0,W,H)}
  if(inCut(t)){ctx.fillStyle='rgba(0,0,0,.9)';ctx.fillRect(0,0,W,H)}                                       // the song's silent cuts: the stage goes dark
  const vg=ctx.createRadialGradient(540,900,500,540,960,1250);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H)}
window.render=render;window.DUR=DUR;
(async()=>{await Promise.all([...Object.values(IMG),...PHOTOS].map(im=>im.complete?0:new Promise(r=>{im.onload=r;im.onerror=r})));
  const fams=[[F.kd,''],[F.num,''],[F.kr,'700'],[F.kr,'900'],[F.mono,'700'],[F.pen,'']];
  await Promise.all(fams.map(([f,w])=>document.fonts.load(`${w} 40px "${f}"`,'가나다ABC123')));await document.fonts.ready;window.READY=true;
  const q=new URLSearchParams(location.search);if(q.has('t'))render(+q.get('t'));else{const s=performance.now();(function loop(){render(((performance.now()-s)/1000)%DUR);requestAnimationFrame(loop)})()}})();
